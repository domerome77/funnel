<script>
// Fake backend. Every call is async with a small latency so loading states are real.
// Local reference data first; free OSM geocoder Photon (no key) for arbitrary addresses when online.
window.GO = window.GO || {};

GO.api = (function () {
  const { sleep } = GO.u;
  const byId = Object.fromEntries(GO.DATA.places.map(p => [p.id, p]));
  const PHOTON = 'https://photon.komoot.io/api/';
  // Search area: where GoOpti drives (Slovenia, Italy, Croatia, Austria and neighbours)
  const BBOX = '5.5,40.5,24,50.5';

  function latency() { return 120 + Math.random() * 180; }
  function place(id) { return byId[id] || null; }
  function isAirport(p) { return !!p && p.type === 'airport'; }
  // Label of a leg's date and time in the search form (user 23.10.2026): what the time is, not "Date".
  // From the airport the time is the pick-up, otherwise the drop-off; off-airport routes without the place (Phil)
  function timeLabel(from, to) {
    if (isAirport(from)) return 'Pick-up at Airport';
    // "Drop-off at Airport" (approved Mobile 11.11.2026, 3323:20723; "Arrive at Airport" since the client call 22.10.2026)
    return isAirport(to) ? 'Drop-off at Airport' : 'Drop-off at';
  }
  // Short label for titles: "Venice Airport (VCE)"
  function shortName(p) { return p ? (p.short || p.name) : ''; }

  function norm(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

  async function popular(kind, from) {
    await sleep(latency() / 2);
    if (kind === 'from') return GO.DATA.popularFrom.map(place);
    const list = isAirport(from) ? GO.DATA.popularCities : GO.DATA.popularAirports;
    return list.map(place).filter(p => !from || p.id !== from.id);
  }

  async function searchLocal(q) {
    await sleep(latency());
    const n = norm(q).trim();
    if (!n) return [];
    const scored = [];
    for (const p of GO.DATA.places) {
      const hay = norm(p.name + ' ' + p.detail + ' ' + p.city + ' ' + (p.id.length === 3 ? p.id : ''));
      const i = hay.indexOf(n);
      if (i < 0) continue;
      // airports and prefix matches first
      scored.push({ p, s: (p.type === 'airport' ? 0 : 10) + (norm(p.name).startsWith(n) ? 0 : 5) + i / 100 });
    }
    return scored.sort((a, b) => a.s - b.s).slice(0, 8).map(x => x.p);
  }

  function fromPhoton(f) {
    const pr = f.properties || {};
    const street = pr.street ? pr.street + (pr.housenumber ? ' ' + pr.housenumber : '') : '';
    const name = pr.name || street || pr.city;
    const detail = [pr.name && street ? street : '', pr.city || pr.county, pr.country].filter(Boolean)
      .filter((v, i, a) => a.indexOf(v) === i).join(', ');
    const air = pr.osm_key === 'aeroway' || pr.osm_value === 'aerodrome';
    const [lon, lat] = (f.geometry && f.geometry.coordinates) || [];
    const place = { id: 'osm-' + pr.osm_type + pr.osm_id, type: air ? 'airport' : 'address', name, detail, city: pr.city || pr.county || '', lat, lon };
    // a whole street, no house number: Offers asks for the number before going on
    if (pr.osm_key === 'highway' && !pr.housenumber) Object.assign(place, { street: pr.name || pr.street, noNumber: true });
    return place;
  }

  // Remote addresses (hotels, streets). Resolves to [] when offline.
  async function searchRemote(q, signal) {
    if (q.trim().length < 3 || !navigator.onLine) return [];
    try {
      const url = PHOTON + '?q=' + encodeURIComponent(q) + '&limit=8&lang=en&lat=46.05&lon=14.5&bbox=' + BBOX;
      const r = await fetch(url, { signal });
      const j = await r.json();
      return (j.features || []).map(fromPhoton).filter(p => p.name);
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      return [];
    }
  }

  async function reverse(lat, lon) {
    try {
      const r = await fetch('https://photon.komoot.io/reverse?lat=' + lat + '&lon=' + lon + '&lang=en');
      const j = await r.json();
      const f = (j.features || [])[0];
      if (f) return Object.assign(fromPhoton(f), { lat, lon });
    } catch (e) { /* fall through */ }
    return null;
  }

  async function locate() {
    if (window.isSecureContext && navigator.geolocation) {
      try {
        const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 8000, maximumAge: 60000 }));
        const p = await reverse(pos.coords.latitude, pos.coords.longitude);
        if (p) return p;
      } catch (e) { /* denied or timed out */ }

    await sleep(600);
    return place(GO.DATA.fallbackLocation);

  // Booking window: from tomorrow up to a year ahead.
  function bookingWindow() {

  // Real prices from goopti.com for Ljubljana → Venice Airport (and back), as in the layouts.
  // Every other route: duration and price from the distance, a little dearer at weekends and close to the date.
  const FEE = 3.2;
  const REAL = {
    'lj>VCE': { dur: 165, shared: { flex3: 26, flex2: 34, flex1: 43, fixed: 51, earlier: 31 }, priv: 224, privRef: 248 },

    const R = 6371, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function round5(n) { return Math.round(n / 5) * 5; }
  function hash(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
  function inLjubljana(p) { return p.type !== 'airport' && p.city === 'Ljubljana'; }
  function realKey(from, to) {
    if (inLjubljana(from) && to.id === 'VCE') return 'lj>VCE';

  // Route base: travel minutes and prices for one passenger (shared) or one vehicle (private).
  // The real route keeps the site prices on any date, so it always matches the layouts.
  function routeBase(from, to, date) {
    const real = REAL[realKey(from, to)];
    if (real) return real;
    const days = (GO.u.parseIso(date) - GO.u.parseIso(GO.u.today())) / 864e5;
    const dow = GO.u.parseIso(date).getDay();
    const k = (dow === 5 || dow === 0 ? 1.08 : 1) * (days <= 3 ? 1.1 : 1);
    const road = km(from, to) * 1.35;
    const dur = Math.max(20, round5(15 + road * 0.63));
    const fixed = Math.max(15, Math.round(road * 0.21));
    const base = { flex3: fixed * 0.51, flex2: fixed * 0.67, flex1: fixed * 0.84, fixed, earlier: fixed * 0.61, later: fixed * 0.69 };
    const priv = Math.max(60, road * 0.93);

    const shared = {};
    for (const key in base) shared[key] = Math.round(base[key] * k);
    return { dur, shared, priv: Math.round(priv * k), privRef: Math.round(privRef * k) };
  }

  // otherwise it is the latest drop-off (the same rule the offers use). Used to keep the return after the first ride.
  // landing: the time is the flight's landing, the ride starts after it
  function span(from, to, date, time, landing) {
    const dur = routeBase(from, to, date).dur;
    const t = GO.u.toMin(time);
    if (!isAirport(from)) return { start: GO.u.down15(t - dur), end: t };

  function returnClash(s, out, ret) {

    const days = Math.round((GO.u.parseIso(ret.date) - GO.u.parseIso(out.date)) / 864e5);

    return [s.from && s.from.id, s.to && s.to.id, s.date, s.time, s.landing ? 'L' : '', s.adults, s.children, s.offersScenario || ''].join('|');
  }

  function legSearch(s, leg) {
    const q = { adults: s.adults, children: s.children, offersScenario: s.offersScenario };
    if (leg === 'ret') return Object.assign(q, { from: s.to, to: s.from, date: s.retDate, time: s.retTime, landing: !!s.retLanding });

  function minutesFromNow(date, min) {
    const now = new Date();
    const days = Math.round((GO.u.parseIso(date) - GO.u.parseIso(GO.u.today())) / 864e5);

  // ready state held in memory only, so the phones do not share sessionStorage
  const SEED = window.GO_SEED;
  let state = initial();
  if (SEED) state = Object.assign(initial(), SEED.state);
  else try { const s = sessionStorage.getItem(KEY); if (s) state = Object.assign(initial(), JSON.parse(s)); } catch (e) {}

// so the phone's back gesture and the browser back button work, and any step opens by link.

    '/': 'home',

    '/offers/when': 'offers-when',
    '/offers/return/when': 'offers-when-return',
    '/edit': 'edit',
    '/edit/from': 'edit-from',
    '/edit/to': 'edit-to',
    '/edit/when': 'edit-when',
    '/edit/return': 'edit-when-return',
    '/extras': 'extras',
    '/extras/flight': 'extras-flight',
    '/extras/when': 'extras-when',
    '/extras/return/when': 'extras-when-return',
    '/extras/flight/manual': 'extras-flight-manual',
    '/extras/no-worries': 'extras-no-worries',
    '/extras/seats': 'extras-seats',
    '/extras/total': 'extras-total',
    '/extras/luggage': 'extras-luggage',
    '/extras/invoice': 'extras-invoice',
    '/details': 'details',
    '/details/total': 'details-total',
    '/details/invoice': 'details-invoice',
    '/details/signin': 'details-signin',
    '/details/choose': 'details-choose',
    '/details/code': 'details-code',
    '/details/profile': 'details-profile',
    '/signin': 'login-signin',
    '/signin/code': 'login-code',
    '/signin/choose': 'login-choose',
    '/signin/profile': 'login-profile',
    '/details/passengers': 'details-passengers',
    '/booked': 'booked',
    '/booked/receipt': 'booked-receipt',

    '/booked/code': 'booked-code',
    '/booked/profile': 'booked-profile',

    if (GO.screens[name].mount) GO.screens[name].mount(app);

  // opens the price details, in the right half presses the button, so a finger near the button doesn't miss
  function barZone(ev) {
    const bar = ev.target.closest && ev.target.closest('.cta-inline');
    if (!bar || ev.target.closest('button, a')) return null;

})();

<script>
// Where from? / Where to? — Streamline 14.10.2026: Flow 02 (2237:12967), Flow 03 (2237:13129), Flow 04 typing (2237:13294)
(function () {
  const { esc, highlight } = GO.u;
  const ic = GO.icon;
  const api = GO.api;

  let items = [];       // places shown in the list, picked by index
  let seq = 0;          // drops stale search responses
  let viaChip = false;  // Where from? opened by the From chip on Where to?: picking or closing goes back there (user 22.10.2026)
  let remoteCtl = null;
  let remoteTimer = null;

  function option(p, i, q, opts) {
    const iconName = opts && opts.icon || (p.type === 'airport' ? 'flight-takeoff' : 'map-pin');
    const name = opts && opts.name || p.name;
    const detail = opts && 'detail' in opts ? opts.detail : p.detail;
    return '<button class="place-option place-option--loc" data-act="pick" data-i="' + i + '">' +
      '<span class="place-option__icon">' + ic(iconName, 20) + '</span>' +
      '<span class="place-option__text">' +
        '<span class="place-option__name ellipsis' + (opts && opts.strong ? ' is-strong' : '') + '">' + highlight(name, q) + '</span>' +
        (detail ? '<span class="place-option__detail ellipsis">' + highlight(detail, q) + '</span>' : '') +
      '</span></button>';
  }

  function initialList(kind, s) {
    if (kind === 'from') {
      items = [{ locate: true }].concat(GO.DATA.popularFrom.map(api.place));
      // name only, no detail line (user 28.10.2026)
      return option({}, 0, '', { icon: 'locate', name: 'Use my current location', detail: '', strong: true }) +
        '<hr class="divider">' +
        '<div class="list-heading" role="presentation">Popular pick-up points</div>' +
        items.slice(1).map((p, i) => option(p, i + 1, '')).join('');
    }
    const fromAir = api.isAirport(s.from);
    const ids = fromAir ? GO.DATA.popularCities : GO.DATA.popularAirports;
    items = ids.map(api.place).filter(p => !s.from || p.id !== s.from.id);
    const city = (s.from && s.from.city) || 'Ljubljana';
    return '<div class="list-heading" role="presentation">' + (fromAir ? 'Popular destinations from ' : 'Popular airports from ') + esc(city) + '</div>' +
      items.map((p, i) => option(p, i, '')).join('');
  }

  // edit: the same sheet opened from Edit search, over the offers; picking a place goes back to the form
  function screen(kind, edit) {
    return {
      overlay: true,
      base: edit ? () => GO.editBase() : null,
      render(s) {
        const title = kind === 'from' ? 'Where from?' : 'Where to?';
        // No slot above the title: the From chip on Where to is gone and the title sits level with the close (user 28.10.2026);
        // the 'change-from' handler and viaChip return path stay unused
        return '' +
          '<header class="sheet-header">' +
            '<div class="sheet-header__titles">' +
              '<h2 id="sheet-title" class="t-h1">' + title + '</h2>' +
            '</div>' +
            '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button>' +
          '</header>' +
          '<div class="sheet__body">' +
            '<label class="field">' +
              '<span class="sr-only">' + (kind === 'from' ? 'Pick-up address' : 'Drop-off address') + '</span>' +
              // the chosen place stays in the field, so one digit of the house number can be changed (user 21.10.2026)
              '<input id="place-q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Address, hotel or airport" value="' + esc(s[kind] ? s[kind].name : '') + '">' +
              '<button class="field__clear" data-act="clear" aria-label="Clear"' + (s[kind] ? '' : ' hidden') + '>' + ic('clear', 20, 'icon--muted') + '</button>' +
            '</label>' +
            '<div id="place-list" class="place-list" aria-live="polite">' + initialList(kind, s) + '</div>' +
          '</div>';
      },

      mount(root) {
        const input = root.querySelector('#place-q');
        const clear = root.querySelector('[data-act=clear]');
        input.addEventListener('input', () => { clear.hidden = !input.value; search(kind, input.value); });
        input.addEventListener('keydown', ev => {
          if (ev.key !== 'Enter') return;
          ev.preventDefault();
          // Enter confirms what is in the field (user 21.10.2026): the chosen place untouched, the edited address,
          // otherwise the first match. Computed here, not from the list, which may still wait for the search.
          const q = input.value.trim(), cur = GO.store.get()[kind];
          if (!q) return;
          if (cur && q === cur.name) return pick(kind, cur);
          const typed = withTyped(kind, [], q)[0];
          if (typed) return pick(kind, typed);
          if (items[0] && !items[0].locate && document.getElementById('place-list').querySelector('[data-i]')) pick(kind, items[0]);
        });
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length); // caret after the address, ready to edit
      },

      actions: {
        close() {
          if (kind === 'from' && viaChip) { viaChip = false; return GO.router.go(edit ? '/edit/to' : '/to', { replace: true }); }
          GO.router.back();
        },
        // replace: Where from? takes the place of Where to?, picking or closing it comes back here
        'change-from'() { viaChip = true; GO.router.go(edit ? '/edit/from' : '/from', { replace: true }); },
        clear(el) {
          const input = document.getElementById('place-q');
          input.value = ''; el.hidden = true; input.focus();
          search(kind, '');
        },
        pick(el) {
          const p = items[+el.getAttribute('data-i')];
          if (!p) return;
          if (p.locate) return locate(kind, el);
          pick(kind, p);
        },
      },
    };
  }

  // Editing the chosen address (one digit of the house number, user 21.10.2026): the geocoder rarely knows that exact house,
  // so the typed address comes first, at the same spot as the chosen one
  function withTyped(kind, list, q) {
    const cur = GO.store.get()[kind];
    if (!cur || cur.type !== 'address' || !/\d/.test(q) || q === cur.name) return list;
    const typed = Object.assign({}, cur, { id: cur.id + '#' + q, name: q, noNumber: false, street: undefined, twin: undefined });
    return [typed].concat(list.filter(p => p.name.toLowerCase() !== q.toLowerCase()));
  }

  async function search(kind, q) {
    const list = document.getElementById('place-list');
    const my = ++seq;
    clearTimeout(remoteTimer);
    if (remoteCtl) remoteCtl.abort();
    q = q.trim();
    if (!q) { list.innerHTML = initialList(kind, GO.store.get()); return; }

    const local = await api.searchLocal(q);
    if (my !== seq) return;
    items = withTyped(kind, local, q);
    draw(list, q, true);

    // Addresses from the geocoder, after a pause in typing
    remoteTimer = setTimeout(async () => {
      remoteCtl = new AbortController();
      try {
        const remote = await api.searchRemote(q, remoteCtl.signal);
        if (my !== seq) return;
        const seen = new Set(items.map(p => p.name.toLowerCase()));
        items = items.concat(remote.filter(p => !seen.has(p.name.toLowerCase()))).slice(0, 12);
      } catch (e) { if (e.name === 'AbortError') return; }
      if (my === seq) draw(list, q, false);
    }, 350);
  }

  function draw(list, q, pending) {
    const rows = items.map((p, i) => option(p, i, q)).join('');
    const status = pending && q.length >= 3 && navigator.onLine
      ? '<div class="place-list__status t-body-sm"><span class="spinner" aria-hidden="true"></span>Looking for addresses…</div>'
      : (!items.length ? '<div class="place-list__status t-body-sm">Nothing found. Try a street, hotel or airport.</div>' : '');
    list.innerHTML = rows + status;
  }

  async function locate(kind, el) {
    // no detail line on this row: the status shows under the name while locating
    el.querySelector('.place-option__text').insertAdjacentHTML('beforeend', '<span class="place-option__detail ellipsis">Finding where you are…</span>');
    el.setAttribute('aria-busy', 'true');
    const p = await api.locate();
    if (p) pick(kind, p);
  }

  function pick(kind, p) {
    const s = GO.store.get();
    const edit = GO.router.path().startsWith('/edit');
    if (kind === 'from') {
      GO.store.set({ from: p });
      if (viaChip) { viaChip = false; return GO.router.go(edit ? '/edit/to' : '/to', { replace: true }); }
      if (!s.to && !edit) return GO.router.go('/to', { replace: true });
    } else {
      GO.store.set({ to: p });
      if ((!s.date || !s.time) && !edit) return GO.router.go('/when', { replace: true });
    }
    GO.router.back();
  }

  // left Where from? another way (Esc, system back): the chip no longer applies
  addEventListener('hashchange', () => { if (!/^\/(edit\/)?from$/.test(GO.router.path())) viaChip = false; });

  GO.screens.from = screen('from');
  GO.screens.to = screen('to');
  GO.screens['edit-from'] = screen('from', true);
  GO.screens['edit-to'] = screen('to', true);
})();
</script>

(function () {
  const u = GO.u;
  const ic = GO.icon;
  const api = GO.api;

  // pick-up after the flight lands, the advice and the promise (Anya's desktop 23.10.2026; the offers use the same, api.afterLanding)

  const AT_AIRPORT = 'Drop-off at the airport at ';
  const MINUTES = ['00', '15', '30', '45'];
  const HOURS = Array.from({ length: 24 }, (_, i) => u.pad(i));
  // the selects open on 12:00 (user 28.10.2026)
  const DEFAULT_TIME = ['12', '00'];
  const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  // From Finish booking: a ride time moved by up to 30m keeps the picked ride (its times follow), more needs a new ride (user 22.10.2026)
  const REPICK = 30;

  function initDraft(s, leg) {
    const k = name => s[key(leg, name)];

    let time = k('time');
    // a search saved by v1 with the landing time: show the pick-up after it
    if (leg === 'ret' && s.retLanding && time) time = u.fromMin(api.afterLanding(u.toMin(time)));
    const [h, m] = time ? time.split(':') : DEFAULT_TIME;
    // the first ride opens on the first day with rides at the default time: today if it still fits the 8 hours, else tomorrow
    // (user 10.11.2026; was always today, 21.10.2026, and a midday search fell on "No rides"); the return with the day after the departure (user 28.10.2026)
    const retDay = leg === 'ret' && s.date ? (u.addDays(s.date, 1) > win.max ? s.date : u.addDays(s.date, 1)) : null;
    const date = k('date') || (leg === 'ret' ? retDay : api.firstRideDay(s.from, s.to, h + ':' + m));
    const view = u.parseIso(date || win.min);

      leg, date, h, m,
      vy: view.getFullYear(), vm: view.getMonth(),
    };
  }

  // The leg's route: the return goes the other way
  function route() {
    const s = GO.store.get();
    return d.leg === 'ret' ? { from: s.to, to: s.from } : { from: s.from, to: s.to };
  }
  function airportMode() { return api.isAirport(route().to); }

  function cityMode() { return !airportMode() && !api.isAirport(route().from); }
  // Return from the airport: the person picks the pick-up time

  // Opened from Finish booking with the flight added: the flight is fixed, the person moves the ride's time (user 21.10.2026)
  function fixedDep() { return !!(d.flight && d.flight.dep && airportMode()); }
  function fixedArr() { return !!(d.flight && !d.flight.dep && landingMode()); }
  // minutes between the ride and the flight, across midnight too: before the departure / after the landing
  function flightGap() {

    const days = Math.round((u.parseIso(d.flight.date) - u.parseIso(r.date)) / 864e5);

  function title() {
    const r = route(), at = (lead, p) => u.esc(lead) + '<br>' + u.esc(api.shortName(p));
    if (landingMode()) return at('Return ride from', r.from);
    if (cityMode() || airportMode()) return at(d.leg === 'ret' ? 'Return drop-off at' : 'Drop-off at', r.to);
    return d.leg === 'ret' ? 'When do you need the return ride?' : 'When do you need the ride?';
  }

  // Selects show only numbers: "10 : 15" (10.10.2026), always filled: 12:00 until picked (v2, user 28.10.2026).
  // One-field variants of the picker: GoOpti-time-picker-variants.html (23.10.2026), the prototype keeps two selects.
  // off: values that can't be picked, they stay in the list greyed out
  function select(id, value, options, label, off) {
    return '<div class="select select--time"><label class="sr-only" for="' + id + '">' + label + '</label>' +
      '<select id="' + id + '">' +
        options.map(o => '<option' + (o === value ? ' selected' : '') + (off && off(o) ? ' disabled' : '') + '>' + o + '</option>').join('') +
      '</select>' + ic('chevron-selector', 20) + '</div>'; // up-and-down chevron, borderless white on the grey card (v5, Presentations New 05.11 679:822)
  }

  // The return can't be before the departure day
  function minDate() {
    const win = api.bookingWindow();
    const s = GO.store.get();
    return d.leg === 'ret' && s.date && s.date > win.min ? s.date : win.min;
  }

  function calendar() {
    const win = api.bookingWindow();
    const lo = minDate();
    const first = new Date(d.vy, d.vm, 1);
    const lead = (first.getDay() + 6) % 7; // Monday first
    const days = new Date(d.vy, d.vm + 1, 0).getDate();
    const minD = u.parseIso(lo), maxD = u.parseIso(win.max);
    const today = u.today();
    // return: the departure day stays visible, pale pink (as in Anya's desktop, 20.10.2026)
    const dep = d.leg === 'ret' ? GO.store.get().date : null;
    const prevOff = d.vy < minD.getFullYear() || (d.vy === minD.getFullYear() && d.vm <= minD.getMonth());
    const nextOff = d.vy > maxD.getFullYear() || (d.vy === maxD.getFullYear() && d.vm >= maxD.getMonth());
    let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(x => '<div class="calendar__dow" aria-hidden="true">' + x + '</div>').join('');
    for (let i = 0; i < lead; i++) cells += '<div></div>';
    for (let day = 1; day <= days; day++) {
      const iso = u.iso(new Date(d.vy, d.vm, day));
      const off = iso < lo || iso > win.max;
      const sel = iso === d.date;
      const dt = new Date(d.vy, d.vm, day);
      const cls = (iso === today ? ' is-today' : '') + (iso === dep && !sel ? ' is-departure' : '');
      cells += '<button class="calendar__day t-body' + cls + '" data-act="day" data-date="' + iso + '"' + (off ? ' disabled' : '') +
        ' aria-pressed="' + sel + '" aria-label="' + DOW_LONG[dt.getDay()] + ' ' + day + ' ' + u.MONTH[d.vm] + '"><span>' + day + '</span></button>';
    }
    // no "Departure date: …" line above the calendar in v2 (user 28.10.2026)
    return '<div class="calendar">' +
      '<div class="calendar__header">' +
        '<button class="icon-btn" data-act="month" data-dir="-1" aria-label="Previous month"' + (prevOff ? ' disabled' : '') + '>' + ic('chevron-left', 24) + '</button>' +
        '<div class="calendar__month t-label-lg" aria-live="polite">' + u.monthTitle(d.vy, d.vm) + '</div>' +
        '<button class="icon-btn" data-act="month" data-dir="1" aria-label="Next month"' + (nextOff ? ' disabled' : '') + '>' + ic('chevron-right', 24) + '</button>' +
      '</div>' +
      '<div class="calendar__grid">' + cells + '</div>' +
    '</div>';
  }

  // at an airport the label names it, as "Arrive at Airport" on home (v5, Presentations New 05.11 679:821: "Drop-off at Airport")
  function fieldLabel() {
    if (airportMode()) return 'Drop-off at Airport';
    if (api.isAirport(route().from)) return 'Pick-up at Airport';
    return isPickup() ? 'Pick-up time' : 'Drop-off time';
  }

  // Label on the left, hour : minutes on the right (label row, 2237:13474)
  function timeField() {
    const label = fieldLabel();
    // the ride's time goes in quarters (Phil 23.10.2026);
    // an hour is closed when none of its minutes works, the minutes are checked for the picked hour
    const hourOff = h => MINUTES.every(m => clashAt(h, m));
    const minOff = m => clashAt(d.h, m);
    const help = fixedDep() || fixedArr() ? '' : timeHelp(); // with the flight added the note under the selects says it
    // v5 (Presentations New 05.11 679:819): only the label in the card, the advice under the card as a line of its own
    return '<div class="time-field" role="group" aria-labelledby="t-label"' + (help ? ' aria-describedby="t-help"' : '') + '>' +
      '<span class="time-field__label"><span id="t-label" class="t-label-lg">' + label + '</span></span>' +
      select('t-hour', d.h, HOURS, label + ', hour', hourOff) +
      '<span class="time-field__colon t-h3" aria-hidden="true">:</span>' +
      select('t-min', d.m, MINUTES, label + ', minutes', minOff) +
    '</div>' +
    (help ? '<p id="t-help" class="time-help t-body-sm c-secondary">' + help + '</p>' : '');
  }

  // Grey hint (14.10.2026), without the pointer since 20.10.2026. Emoji in its own column on the left, as in Anya's desktop
  // (user 21.10.2026; from 20.10 it stood inside the title). tone: green / yellow / red with the added flight, 'warn' for the yellow plate
  function hint(emoji, titleText, text, opts) {
    opts = opts || {};
    // grey advice and promise: just the text, without the emoji and the title (user 02.11.2026)
    if (!opts.tone) return '<div class="hint hint--plain" role="status"><div class="hint__body"><p class="hint__text t-body-sm">' + text + '</p>' + (opts.extra || '') + '</div></div>';
    const style = opts.zone ? ' data-zone="' + opts.tone + '"' : ' style="--hint-bg:var(--gauge-' + opts.tone + '-bg);--hint-icon:var(--gauge-' + opts.tone + '-text);"';
    return '<div class="hint' + (opts.zone ? ' hint--zone' : '') + '" role="status"' + style + '>' +
      (emoji ? '<span class="hint__emoji" aria-hidden="true">' + emoji + '</span>' : '') +
      '<div class="hint__body">' + (titleText ? '<p class="hint__title t-label-lg">' + u.esc(titleText) + '</p>' : '') + '<p class="hint__text t-body-sm">' + text + '</p>' +
        (opts.extra || '') + '</div>' +
    '</div>';
  }

  // Helper text under the time label: one short line, the same before and after the time is picked (user 02.11.2026;
  // from 23.10.2026 a hint under the selects with advice and a promise as Anya's informers, GoOpti-informer-states.html)
  function timeHelp() {
    // v5 (Presentations New 05.11 679:833): the text as in the design, with its full stop (user 05.11.2026: texts from the layouts);
    // the pick-up and the city lines by analogy, the same form
    const pickup = 'Select pick-up time ' + AFTER_LANDING + ' minutes after your flight lands.';
    if (landingMode()) return d.fromOffers ? '' : pickup; // editing the landing from the offers: no note (1719:13909)
    // city to city: no line (user 12.11.2026; "We’ll get you there by then." was ours, 02.11.2026, not from the design) -
    // a hint helps where there is a rule (2 hours before the flight, 45 minutes after landing), a city has none
    if (cityMode()) return '';
    if (!airportMode()) return pickup;
    return 'Choose drop-off time 2 hours before your flight.';
  }

  // yellow plate: the return would start before the first ride arrives — the person has to change the time or the day
  function clashNote() {
    const at = clash();
    if (!at) return '';
    return hint('⚠️', 'Your first ride arrives at ' + at, 'Choose a later time for the return, or another day', { tone: 'warn' });
  }

  // Night ride (client 12.11.2026, "crazy hours around midnight"; v1 had a grey "Night between…" note with the flight time only):
  // 00:00–04:59 is the night before the picked day. The yellow plate names that night in words and moves the ride a day on
  // in one tap, the usual mistake being "Friday night" booked as Fri 00:30. Not with an added flight: its own note says the time.
  function nightNote() {
    const r = result();
    if (!r || !u.night(r.time) || d.flight) return '';
    const prev = u.fmtDay(u.addDays(r.date, -1)).split(' '), day = u.fmtDay(r.date);
    const from = prev[2] === day.split(' ')[2] ? prev.slice(0, 2).join(' ') : prev.join(' ');
    // the client's wording (their site, 12.11.2026) in our formats: "Night between Thu 26 and Fri 27 Nov" / "Don't forget to
    // double-check the selected date of your transport", as the night verdict on Add-ons. No "Move to …" link (Anya 16.11.2026)
    // always the yellow plate, a saved night time too, and no moon (Anya 16.11.2026: the plate is enough; was a grey line once settled)
    return hint('', 'Night between ' + from + ' and ' + day,
      'Don’t forget to double-check the selected date of your transport', { tone: 'warn' });
  }

  function footer() {
    const r = result();
    // the button names what we book, without "time": the date and the time are confirmed together (client 05.11.2026; was "Confirm drop-off time", 15.10.2026)
    return '<button class="btn btn--primary" data-act="confirm"' + (r && !clash() ? '' : ' disabled') + '>' +
      (isPickup() ? 'Confirm pick-up' : 'Confirm drop-off') + '</button>';
  }

  function body() {
    // no "Remove return ride" on this screen since 23.10.2026 (user)
    return calendar() + timeField() +
      '<div id="when-alert">' + (clashNote() || nightNote() || (fixedDep() ? fixedNote() : fixedArr() ? fixedArrNote() : '')) + '</div>';
  }

  function update(focusId) {
    const sheet = document.querySelector('.sheet');
    const b = sheet.querySelector('.sheet__body');
    const top = b.scrollTop;
    sheet.querySelector('#sheet-title').innerHTML = title();
    b.innerHTML = body();
    b.scrollTop = top;
    sheet.querySelector('.cta-bar').innerHTML = footer();
    bind(sheet);
    if (focusId) { const el = sheet.querySelector(focusId); if (el) el.focus(); }
  }

  function bind(root) {
    const hour = root.querySelector('#t-hour'), min = root.querySelector('#t-min');
    hour.addEventListener('change', () => {
      d.h = hour.value;
      // the return's first hour after the first ride: the minutes move to the first one that works (18:00 → 18:15)
      if (clashAt(d.h, d.m)) {
        const ok = MINUTES.find(m => !clashAt(d.h, m));
        if (ok) d.m = ok;
      }
      update('#t-hour');
    });
    min.addEventListener('change', () => { d.m = min.value; update('#t-min'); });
  }

  // From Finish booking the screen starts from what is booked, not from the search (user 21.10.2026).
  // With the flight added: the selects hold the ride's time, the note says how long before the departure (after the landing)
  // and shows the flight as its second section.
  // Without a flight: the picked ride's time (an alternative offer has its own: searched 01:00, the ride arrives 07:00).
  function flightFromStore(s, leg) {
    const f = s.ex && s.ex.flights && s.ex.flights[leg];
    const q = api.legSearch(s, leg);
    if (!f || !q.date) return;
    if (airportMode() && f.dep != null) d.flight = { code: f.code, city: f.city, at: f.dep, dep: true, date: q.date };
    if (landingMode() && f.arr != null) d.flight = { code: f.code, city: f.city, at: f.arr, dep: false, date: q.date };
  }
  function fromPickedRide(s, leg) {
    const f = s.ex && s.ex.flights && s.ex.flights[leg];
    const q = api.legSearch(s, leg);
    let o = null;
    if (q.from && q.to && q.date && q.time && s.sel[leg].id) {
      const data = api.offersNow(q);
      o = data.shared.concat(data.priv, data.empty ? data.empty.alternatives : []).find(x => x.id === s.sel[leg].id) || null;
    }
    if (f && airportMode() && f.dep != null) d.flight = { code: f.code, city: f.city, at: f.dep, dep: true, date: q.date };
    if (f && landingMode() && f.arr != null) d.flight = { code: f.code, city: f.city, at: f.arr, dep: false, date: q.date };
    if (!o) return;
    let min = airportMode() ? o.arrival : o.pickFrom;
    min -= min % 15; // the selects go in quarters
    d.date = q.date;
    d.start = { date: q.date, min }; // the picked ride's time: Confirm compares the new one with it (REPICK)
    [d.h, d.m] = u.fromMin(min).split(':');
  }
  // note under the selects with the flight added: when we drop off and how long before the flight, in the zone colour
  function fixedNote() {
    const r = result(), g = flightGap();
    if (!r || g == null) return '';
    const at = ''; // no "Drop-off at the airport at …" title, the zone text alone (user 17.11.2026)
    const x = { extra: flightLine() };
    if (d.preset && d.preset !== r.time + ' ' + r.date) d.preset = false; // any change of date or time drops the preset note
    if (d.preset) return hint(ic('zone-ok', 22), at, 'Your drop-off is now set to 2h before your flight.', Object.assign(x, { tone: 'green', zone: true }));
    const z = dropZone(g);
    // calendar wording (user 17.11.2026): "30 min before your flight. Choose an earlier time."
    const text = g < 0 ? z.text + '<br>' + z.action : durText(g) + ' before your flight. ' + z.action;
    return hint(ic(z.emoji, 22), at, text, Object.assign(x, { tone: z.tone, zone: true }));
  }
  // drop-off zones (user 17.11.2026): <0 doesn't fit, under 1h 30 red, under 2h yellow, 2h to 2h 45 green, 3h and more yellow
  function durText(m) {
    const h = Math.floor(m / 60), r = m % 60;
    return h ? h + 'h' + (r ? ' ' + r + ' min' : '') : r + ' min';
  }
  function dropZone(g) {
    if (g < 0) return { tone: 'red', level: 'error', emoji: 'zone-error', text: 'Your drop-off doesn’t fit your flight time.', action: 'Change drop-off date or time.', preset: true };
    const text = 'Your drop-off is ' + durText(g) + ' before your flight.';
    if (g >= 180) return { tone: 'yellow', level: 'warn', emoji: 'zone-early', text, action: 'Choose later time.', preset: true };
    if (g >= 120) return { tone: 'green', level: 'ok', emoji: 'zone-ok', text, action: 'Great!' };
    if (g >= 90) return { tone: 'yellow', level: 'warn', emoji: 'zone-warn', text, action: 'Choose an earlier time.', preset: true };
    return { tone: 'red', level: 'error', emoji: 'zone-error', text, action: 'Choose an earlier time.', preset: true };
  }
  window.GO_dropZone = dropZone;
  // return from the airport with the landing known: pick-up after it
  function fixedArrNote() {
    const r = result(), g = flightGap();
    if (!r || g == null) return '';
    const at = 'Pick-up at the airport at ' + r.time, x = { extra: flightLine() };
    if (g < 0) return hint('🏃🏻', at, u.fmtDur(-g) + ' before your flight lands. Choose a later time.', Object.assign(x, { tone: 'red' }));
    // zones as Anya's (23.10.2026): 45m and more fine, 30m tight, less too short
    const text = 'We’ll take you from the airport ' + (g ? u.fmtDur(g) + ' after your flight lands' : 'when your flight lands');
    if (g >= AFTER_LANDING) return hint('🙂', at, text, Object.assign(x, { tone: 'green' }));
    if (g >= 30) return hint('😑', at, text + '. It can get tight with checked bags or a passport queue.', Object.assign(x, { tone: 'yellow' }));
    return hint('🏃🏻', at, text + '. You may not get through baggage claim in time.', Object.assign(x, { tone: 'red' }));
  }


  // The added flight as the second section of the note under the selects (user 21.10.2026: one message, not a plate on top)
  function flightLine() {
    const f = d.flight;
    if (!f) return '';
    const r = route();
    const here = api.isAirport(r.to) ? r.to : r.from;
    const city = here.city || api.shortName(here);
    return '<div class="hint__flight">' + ic(f.dep ? 'flight-takeoff' : 'flight-land', 20) +
      '<span class="hint__flight-text"><span class="t-label">' + u.esc(f.code + ', ' + u.fmtDay(d.date) + ' ' + u.fromMin(f.at)) + '</span>' +
      '<span class="t-body-sm c-tertiary">' + u.esc(f.dep ? GO.withCode(city, here.id) + ' → ' + GO.withCode(f.city) : GO.withCode(f.city) + ' → ' + GO.withCode(city, here.id)) + '</span>' + nightLanding(f) + '</span></div>';
  }
  // landing after midnight (before 04:00, as the night verdict on Add-ons that links here): the same client text under the flight
  // (user 12.11.2026), so the sheet says why the person came to check the date
  function nightLanding(f) {
    if (f.dep || f.at >= 240) return '';
    const a = u.fmtDay(u.addDays(f.date, -1)).split(' '), b = u.fmtDay(f.date);
    const first = a[2] === b.split(' ')[2] ? a.slice(0, 2).join(' ') : a.join(' ');
    return '<span class="t-body-sm hint__night">Night between ' + u.esc(first) + ' and ' + u.esc(b) + '. Don’t forget to double-check the selected date of your transport.</span>';
  }

  // fromOffers: the same screen over the offers from "Change time and date" in the empty state (Flow 08 - Offers - Return - sheet -
  // Change date & time, 1719:13909); full screen like the other editing since 22.10.2026, was a bottom sheet
  // edit: full-height sheet from Edit search (2303:6137), over the offers, back to the form on confirm
  // extras: full screen from the flight verdict links on Finish booking; Confirm opens the leg's offers when the time moved by more than
  // 30m, otherwise goes back to Finish booking with the same ride; the cross goes back (user 21.10.2026, 22.10.2026)
  function sheet(leg, fromOffers, edit, extras) {
    return {
      overlay: true,
      base: extras ? 'extras' : edit ? () => GO.editBase() : fromOffers ? (leg === 'ret' ? 'offers-return' : 'offers') : null,
      sheetClass: '',
      render(s) {
        initDraft(s, leg);
        d.fromOffers = !!fromOffers;
        d.extras = !!extras;
        d.flight = null;
        if (extras) fromPickedRide(s, leg);
        else flightFromStore(s, leg); // an entered flight shows under the calendar from every way in (user 17.11.2026)
        d.preset = false;
        // "Choose an earlier time" on Finish booking: the ride opens set 2h before the flight (user 17.11.2026)
        if (extras && GO.presetDrop && fixedDep()) {
          let min = d.flight.at - 120, date = d.flight.date;
          while (min < 0) { min += 1440; date = u.addDays(date, -1); }
          min -= min % 15;
          d.date = date; [d.h, d.m] = u.fromMin(min).split(':');
          const v = u.parseIso(date); d.vy = v.getFullYear(); d.vm = v.getMonth();
          d.preset = d.h + ':' + d.m + ' ' + d.date;
        }
        GO.presetDrop = false;
        return '' +
          '<header class="sheet-header">' +
            '<div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">' + title() + '</h2></div>' +
            '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button>' +
          '</header>' +
          '<div class="sheet__body sheet__body--gap16 when-body">' + body() + '</div>' +
          '<div class="cta-bar">' + footer() + '</div>';
      },
      mount(root) { bind(root); },
      actions: {
        close: () => GO.router.back(),
        month(el) {
          d.vm += +el.getAttribute('data-dir');
          if (d.vm < 0) { d.vm = 11; d.vy--; } else if (d.vm > 11) { d.vm = 0; d.vy++; }
          update();
        },
        day(el) { d.date = el.getAttribute('data-date'); fitReturn(); update('[data-date="' + d.date + '"]'); },
        confirm() {
          const r = result();
          if (!r) return;
          const k = name => key(d.leg, name);
          const patch = {};
          patch[k('date')] = r.date;
          patch[k('time')] = r.time;
          // v2 keeps only the ride's time: the flight fields of v1 are cleared
          patch[k('timeMode')] = 'dropoff';
          patch[k('flightDate')] = null;
          patch[k('flightTime')] = null;
          if (d.leg === 'ret') patch.retLanding = false;
          // a new departure day after the return makes the return invalid
          const s = GO.store.get();
          if (d.leg === 'out' && s.retDate && (s.retDate < r.date || api.returnClash(s, r, { date: s.retDate, time: s.retTime, landing: !!s.retLanding })))
            Object.assign(patch, { retDate: null, retTime: null });
          if (d.leg === 'ret' && clash()) return;
          if (d.leg === 'out' && s.retDate && patch.retDate === null) u.toast('Your return was before this ride, so we removed it. Add it again.');
          GO.store.set(patch);
          // from Finish booking: up to 30m the same ride follows the new time and Finish booking shows the updated flight messages;
          // a bigger move is a new ride, so the offers of that leg open to pick one (user 21.10.2026, threshold 22.10.2026)
          if (extras) {
            if (d.start && Math.abs(Math.round((u.parseIso(r.date) - u.parseIso(d.start.date)) / 864e5) * 1440 + u.toMin(r.time) - d.start.min) <= REPICK) {
              const ns = GO.store.get(), data = api.offersNow(api.legSearch(ns, d.leg));
              const id = ns.sel[d.leg].id;
              if (!data.empty && data.shared.concat(data.priv).some(x => x.id === id && !x.soldOut)) {
                GO.store.set({ sel: Object.assign({}, ns.sel, { [d.leg]: Object.assign({}, ns.sel[d.leg], { key: data.key }) }) });
                return GO.router.back();
              }
            }
            return GO.router.go(d.leg === 'ret' ? '/offers/return' : '/offers', { replace: true });
          }
          GO.router.back();
        },
      },
    };
  }

  GO.screens.when = sheet('out');
  GO.screens['when-return'] = sheet('ret');
  GO.screens['offers-when'] = sheet('out', true);
  GO.screens['offers-when-return'] = sheet('ret', true);
  GO.screens['edit-when'] = sheet('out', false, true);
  GO.screens['edit-when-return'] = sheet('ret', false, true);
  GO.screens['extras-when'] = sheet('out', false, false, true);
  GO.screens['extras-when-return'] = sheet('ret', false, false, true);
})();
</script>
<script>
// Edit search — Streamline 14.10.2026, section Edit search 2303:5283: the pencil on Offers opens the whole search
// as a full-height sheet over the offers (2303:5617, outlined form), its fields open full-height sheets of their own
// (Where from 2303:5815, Where to, Date & time 2303:6137) and come back to it (2306:6259, 2306:6823, 2303:6166).
// Changes stay in the state while editing; closing without "Update search" puts the old search back.
(function () {
  const { esc, fmtDay } = GO.u;
  const ic = GO.icon;
  const MAX_PAX = 8;
  const KEYS = ['from', 'to', 'date', 'time', 'timeMode', 'flightDate', 'flightTime', 'bufferIdx', 'adults', 'children',
    'retDate', 'retTime', 'retTimeMode', 'retFlightDate', 'retFlightTime', 'retBufferIdx', 'retLanding'];

  // Called by the pencil (Offers, Finish booking): remember the search and the screen underneath
  GO.editSearch = function (base) {
    const s = GO.store.get();
    const snap = {};
    KEYS.forEach(k => { snap[k] = s[k]; });
    GO.store.set({ editSnap: snap, editBase: base });
    GO.router.go('/edit');
  };
  // Back on the offers without "Update search": the old search returns
  GO.editRestore = function () {
    const s = GO.store.get();
    if (s.editSnap) GO.store.set(Object.assign({}, s.editSnap, { editSnap: null }));
  };
  const base = () => GO.store.get().editBase || 'offers';
  GO.editBase = base;

  function cell(act, label, value, iconName, cls) {
    return '<button class="edit-cell' + (cls ? ' ' + cls : '') + '" data-act="' + act + '">' + (iconName ? ic(iconName, 24) : '') +
      '<span class="booking__text"><span class="booking__label">' + label + '</span>' +
      '<span class="booking__value ellipsis' + (value ? '' : ' is-empty') + '">' + esc(value || 'Address, hotel or airport') + '</span></span></button>';
  }

  function stepper(kind, label, value, min, canAdd) {
    const id = 'edit-' + kind;
    return '<div class="pax-stepper" role="group" aria-labelledby="' + id + '">' +
      '<span id="' + id + '" class="booking__label">' + label + '</span>' +
      '<span class="stepper">' +
        '<button class="stepper__btn" data-act="pax" data-kind="' + kind + '" data-d="-1" aria-label="Fewer ' + label.toLowerCase() + '"' + (value <= min ? ' disabled' : '') + '>' + ic('minus', 20) + '</button>' +
        '<span class="stepper__value t-label-lg" aria-live="polite">' + value + '</span>' +
        '<button class="stepper__btn" data-act="pax" data-kind="' + kind + '" data-d="1" aria-label="More ' + label.toLowerCase() + '"' + (canAdd ? '' : ' disabled') + '>' + ic('plus', 20) + '</button>' +
      '</span></div>';
  }

  function form(s) {
    const room = s.adults + s.children < MAX_PAX;
    const ret = s.retDate && s.retTime;
    return '<div class="edit-form">' +
      '<div class="edit-box edit-route">' +
        cell('pick-from', 'From', s.from && s.from.name, 'waving', 'edit-cell--from') +
        '<span class="edit-divider" aria-hidden="true"></span>' +
        cell('pick-to', 'To', s.to && s.to.name, 'map-pin') +
        '<button class="booking__swap edit-swap" data-act="swap" aria-label="Swap From and To">' + ic('swap', 16) + '</button>' +
      '</div>' +
      '<div class="edit-box edit-dates">' +
        '<button class="edit-cell edit-cell--date" data-act="pick-when"><span class="booking__text"><span class="booking__label">' + esc(GO.api.timeLabel(s.from, s.to)) + '</span>' +
          '<span class="booking__value ellipsis">' + esc(s.date && s.time ? fmtDay(s.date) + ', ' + s.time : 'Choose a date') + '</span></span></button>' +
        '<span class="edit-divider edit-divider--v" aria-hidden="true"></span>' +
        (ret
          ? GO.retCell('edit-cell', esc(GO.api.timeLabel(s.to, s.from)), esc(fmtDay(s.retDate) + ', ' + s.retTime))
          : '<button class="edit-cell" data-act="return"><span class="booking__text"><span class="booking__value is-empty">+ Add return trip</span></span></button>') +
      '</div>' +
      '<div class="edit-box edit-pax">' +
        '<div class="edit-pax__row">' +
          stepper('adults', 'Adults', s.adults, 1, room) +
          // no divider between Adults and Children, as on home (user 21.10.2026)
          stepper('children', 'Children', s.children, 0, room) +
        '</div>' +
        // inside the passengers box, under the steppers (as in Anya's desktop, 20.10.2026)
        (s.children ? '<p class="pax-note t-body-sm">Child seats included for free</p>' : '') +
      '</div>' +
    '</div>';
  }

  GO.screens.edit = {
    overlay: true, base,
    render(s) {
      return '' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Edit search</h2></div>' +
          '<button class="icon-btn" data-act="close" aria-label="Close without changes">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body edit-body">' + form(s) + '</div>' +
        '<div class="cta-bar"><button class="btn btn--primary" data-act="update"' + (s.from && s.to && s.date && s.time ? '' : ' disabled') + '>Update search</button></div>';
    },
    actions: {
      close() { GO.editRestore(); GO.router.back(); },
      'pick-from': () => GO.router.go('/edit/from'),
      'pick-to': () => GO.router.go('/edit/to'),
      'pick-when': () => GO.router.go('/edit/when'),
      return: () => GO.router.go('/edit/return'),
      // the search snapshot brings the return back if the form is closed without "Update search"
      'clear-return'() { GO.clearReturn(); redraw('[data-act=return]'); },
      swap() {
        const s = GO.store.get();
        GO.store.set({ from: s.to, to: s.from });
        redraw('[data-act=swap]');
      },
      pax(el) {
        const s = GO.store.get();
        const k = el.dataset.kind, dlt = +el.dataset.d;
        const next = s[k] + dlt;
        if (next < (k === 'adults' ? 1 : 0) || (dlt > 0 && s.adults + s.children >= MAX_PAX)) return;
        GO.store.set({ [k]: next });
        redraw();
        const same = document.querySelector('.edit-pax [data-kind=' + k + '][data-d="' + dlt + '"]');
        (same && !same.disabled ? same : document.querySelector('.edit-pax [data-kind=' + k + '][data-d="' + -dlt + '"]')).focus();
      },
      // the offers underneath load the new search (the selection resets with the new search key)
      // from Finish booking a changed search means new rides: the offers open to pick them (as after a new time, 21.10.2026)
      update() {
        const s = GO.store.get();
        const changed = KEYS.some(k => JSON.stringify(s[k]) !== JSON.stringify(s.editSnap[k]));
        GO.store.set({ editSnap: null });
        if ((base() === 'extras' || base() === 'details') && changed) return GO.router.go('/offers', { replace: true });
        GO.router.back();
      },
    },
  };

  // Redraw the sheet in place: the base offers stay as they are until the search is updated
  function redraw(focusSel) {
    const sheet = document.querySelector('.sheet');
    if (!sheet) return;
    sheet.innerHTML = GO.screens.edit.render(GO.store.get());
    if (focusSel) { const el = sheet.querySelector(focusSel); if (el) el.focus(); }
  }
})();
</script>
<script>
// Offers — v4 (04.11.2026): variant 9 "Slider" of GoOpti-offers-variants-v2.html (sliderList below): one shared card with a slider
// Fixed / 1h / 2h / 3h flex, one private card, the headings inside the cards, Pick-up / Latest drop-off at the stops, no tag line and no (i).
// v2 (28.10.2026): variant 1 "Cards, tags" of GoOpti-offers-variants-v2.html (Figma v1 of GoOpti Presentations):
// no All / Shared / Private filter, shared 3 / 2 / 1 hours and fixed, one private (client 26.10.2026), the 2 hours ride picked,
// a tag line under the route instead of the badges, no ride time between the stops.
// The bottom as on that page since 28.10.2026: no refund row, one Every GoOpti ride, the bar in one line.
// Before: Streamline, section Offers 1529:82164, variant A (All 1529:80883, Private 1529:81232).
// Round trip: the same cards with Departure / Return tabs (Streamline 14.10: 2237:13957, 2237:14290, 2237:14636; 20.10.2026).
// The card shows the price per person, private too (the vehicle split by the passengers); the bar sums the group.
// Sheets: about the ride type (1573:10890 shared, 1573:11312 private), about this offer (1579:10601, 1579:11106),
// Add your house number for a street picked without one (2320:29071).
(function () {
  const u = GO.u;
  const { esc, fmtDay, fromMin, fmtDur } = u;
  const ic = GO.icon;
  const api = GO.api;

  // ---------- formatting ----------
  // "Ljubljana", "Venice Airport": addresses go by city, airports without the code
  function placeLabel(p) {
    if (!p) return '';
    if (p.type === 'airport') return api.shortName(p).replace(/\s*\([A-Z]{3}\)$/, '');
    return p.city || p.name;
  }
  // header only: a street without a house number goes by the street, so the reason for the house number sheet shows (2258:12892)
  function headLabel(p) { return p && p.noNumber && p.street ? p.street : placeLabel(p); }
  function routeLabel(q) { return headLabel(q.from) + ' → ' + headLabel(q.to); }
  function whenLabel(q, data) {
    if (q.landing) return fmtDay(q.date) + ', flight lands ' + q.time;
    return fmtDay(q.date) + (data && !data.dropBy ? ', at ' : ', by ') + q.time;
  }
  // the header of the next screens says the same for a one-way trip (user 12.11.2026); dropBy as api.offers works it out
  GO.whenLabel = q => whenLabel(q, { dropBy: api.isAirport(q.to) || !api.isAirport(q.from) });
  function paxLabel(s) {
    const a = s.adults + ' adult' + (s.adults > 1 ? 's' : '');
    return s.children ? a + ', ' + s.children + ' child' + (s.children > 1 ? 'ren' : '') : a;
  }
  function money(n) { return (Number.isInteger(n) ? n : n.toFixed(2)) + ' €'; } // the sign after the price (user 17.11.2026)
  function money2(n) { return n.toFixed(2) + ' €'; } // the sign after the price (user 17.11.2026)
  function pickLabel(o) { return o.kind === 'flex' ? fromMin(o.pickFrom) + '–' + fromMin(o.pickTo) : fromMin(o.pickFrom); }
  // the window length in words, no "window" (Phil 27.10.2026)
  function hours(min) { const h = min / 60; return h + (h === 1 ? ' hour' : ' hours'); }
  function shortTitle(o) {
    if (o.kind === 'private') return 'Private';
    return o.kind === 'flex' ? 'Shared, flexible ' + hours(o.window) : 'Shared, exact time';
  }
  // badge above the card: only Sold out and the alternatives of the empty state ("2h later") keep one in v2
  function badge(o) {
    if (!o.badge || (!o.soldOut && !/^alt-/.test(o.id))) return '';
    return '<span class="badge badge--' + (o.soldOut ? 'error' : o.tone || 'neutral') + '">' + esc(o.badge) + '</span>';
  }

  // ---------- context of a leg ----------
  function isRound(s) { return !!(s.retDate && s.retTime); }
  function ctx(leg) {
    const s = GO.store.get();
    const q = api.legSearch(s, leg);
    const data = q.from && q.to && q.date && q.time ? api.offersCached(q) : null;
    return { leg, s, q, data, round: isRound(s), sel: s.sel[leg] };
  }
  function setSel(leg, patch) {
    const sel = Object.assign({}, GO.store.get().sel);
    sel[leg] = Object.assign({}, sel[leg], patch);
    GO.store.set({ sel });
  }

  // ---------- selection ----------
  function allOffers(data) { return data.shared.concat(data.priv, data.empty ? data.empty.alternatives : []); }
  // the 2 hours ride is picked (client 26.10.2026), the cheapest shared one when it is sold out, else the private one
  function defaultOffer(data) {
    if (data.empty) return null;
    const ok = data.shared.filter(o => !o.soldOut);
    const two = ok.find(o => o.id === 'flex2');
    const cheapest = ok.slice().sort((a, b) => a.unit - b.unit)[0];
    return (two || cheapest || data.priv[0] || {}).id || null;
  }
  // A new search starts with the default ride picked
  function syncSelection(c) {
    if (!c.data || c.sel.key === c.data.key) return;
    setSel(c.leg, { key: c.data.key, id: defaultOffer(c.data) });
    Object.assign(c, ctx(c.leg));
  }
  function selected(c) {
    if (!c.data || !c.sel.id || c.sel.key !== c.data.key) return null;
    return allOffers(c.data).find(o => o.id === c.sel.id && !o.soldOut) || null;
  }
  // Picked offer of the other leg (for round-trip totals); its offers may not be loaded yet
  function pickedOf(leg) {
    const c = ctx(leg);
    return c.data ? (syncSelection(c), selected(c)) : null;
  }

  // ---------- pieces ----------
  // v6 (Mobile 09.11.2026 3253:25, user 09.11.2026): Anya's segmented switch under "Choose your ride", without the inset around
  // the active segment: a grey track 40 high, radius 12; the active segment black with white text; the leg's date next to its name
  // Dynamic as variant 6 of GoOpti-offers-variants-v2.html (user 09.11.2026): the black thumb is a layer of its own that slides
  // (left, 200ms, cubic-bezier(0.2, 0, 0, 1)) under the labels; the hover fill of the other leg runs under the thumb, so no
  // sliver of the track shows between them. The screen is redrawn on a leg change: the thumb starts at the old leg (legFrom) and slides
  let legFrom = null;
  function legTabs(c) {
    const at = c.leg === 'ret' ? 1 : 0;
    const from = legFrom == null ? at : legFrom;
    const tab = (leg, label, date, k) =>
      '<button class="leg-tab' + (k === at ? '' : k > at ? ' is-after' : ' is-before') + '" role="tab" data-act="leg" data-leg="' + leg + '" aria-selected="' + (c.leg === leg) + '">' +
        '<span class="leg-tab__title">' + label + '</span>' + (date ? '<span class="leg-tab__date">' + esc(fmtDay(date)) + '</span>' : '') + '</button>';
    return '<div class="leg-tabs" role="tablist" aria-label="Legs" style="--i: ' + from + '" data-to="' + at + '">' +
      '<span class="leg-tabs__thumb" aria-hidden="true"></span>' +
      tab('out', 'Departure', c.s.date, 0) + tab('ret', 'Return', c.s.retDate, 1) + '</div>';
  }
  // after the redraw: put the thumb where it goes, so it slides there
  function slideLegs(root) {
    const t = root.querySelector('.leg-tabs');
    legFrom = null;
    if (!t || t.style.getPropertyValue('--i').trim() === t.dataset.to) return;
    void t.offsetWidth;
    t.style.setProperty('--i', t.dataset.to);
  }

  // v6: the grey route header on top (GO.routeHead: Back, the route, the date and the passengers, the pencil), then on white
  // "Choose your ride" and the Departure / Return switch; only the grey header sticks (v5: the underline tabs over it, both sticky)
  function header(c) {
    return GO.routeHead(esc(routeLabel(c.q)), [esc(c.q.date ? whenLabel(c.q, c.data) : ''), esc(paxLabel(c.s))]) +
      GO.pageTitle('Choose your ride') +
      (c.round ? legTabs(c) : '');
  }

  function stops(q, o) {
    return '<div class="offer__route">' +
      '<div class="rail" aria-hidden="true"><span class="rail__dot"></span><span class="rail__line"></span><span class="rail__dot"></span></div>' +
      '<div class="offer__stops offer__stops--short">' +
        '<div class="offer__stop"><span class="t-label-lg nowrap">' + pickLabel(o) + '</span><span class="t-body">' + esc(placeLabel(q.from)) + '</span></div>' +
        '<div class="offer__stop"><span class="t-label-lg nowrap">' + fromMin(o.arrival) + '</span><span class="t-body">' + esc(placeLabel(q.to)) + '</span></div>' +
      '</div>' +
    '</div>';
  }

  // Per person on every card, as in variant 1 of GoOpti-offers-variants-v2.html: private too, the vehicle price split
  // by the passengers (client 28.10.2026; was per vehicle, 2237:13957). Price details still say "1 vehicle".
  // the refund inside the Private card is part of its price while it is on (user 17.11.2026)
  function cardPrice(o) {
    if (o.kind !== 'private') return o.unit;
    const r = GO.offersRefund() === 2 && GO.store.get().refund ? api.REFUND : 0;
    return Math.round((o.total + r) / o.pax * 100) / 100;
  }
  function unitLabel() { return 'per person'; }

  function price(o) {
    const n = cardPrice(o);
    return '<div class="offer__price">' +
      // "9 €/👤" as on No Worries (user 17.11.2026; was "per person" under the price)
      '<div class="offer__amount"><span class="offer__num">' + (Number.isInteger(n) ? n : n.toFixed(2)) + '</span><span class="offer__cur">€</span>' +
        '<span class="vper" aria-hidden="true">/' + GO.icon('user', 16) + '</span><span class="sr-only">' + unitLabel(o) + '</span></div>' +
    '</div>';
  }

  function hit(o, isSel) {
    const aria = [shortTitle(o), 'pick-up ' + pickLabel(o), 'arrives ' + fromMin(o.arrival), money(cardPrice(o)) + ' ' + unitLabel(o), tagLine(o)[0], tagLine(o)[2]].filter(Boolean).join(', ');
    return '<button class="offer__hit" role="radio" aria-checked="' + isSel + '" data-act="pick" data-id="' + o.id + '" aria-label="' + esc(aria) + '"' + (o.soldOut ? ' disabled' : '') + '></button>';
  }
  function infoBtn(o) {
    return o.soldOut ? '' : '<button class="icon-btn offer__info" data-act="info" data-id="' + o.id + '" aria-label="About this ride: ' + esc(shortTitle(o)) + '">' + ic('info-outline', 20, 'icon--muted') + '</button>';
  }

  // the line under the route (variant 1): a tag, then the text — [tag, tone, text]; the tag may be empty
  function tagLine(o) {
    if (o.soldOut) return ['', '', 'No seats left at this time'];
    if (o.kind === 'private') return ['Just you', 'success', 'No stops, no other passengers'];
    if (o.kind === 'fixed') return ['Exact pick-up time', 'neutral', 'No waiting'];
    return [o.id === 'flex2' ? 'Best offer' : '', 'success', 'Pick-up within ' + hours(o.window)];
  }
  // Variant 1, Cards, tags: route rail with places, price on the right, the tag line and (i) below
  function cardA(c, o, isSel) {
    const [tg, tone, text] = tagLine(o);
    return '<div class="offer' + (isSel ? ' is-selected' : '') + (o.soldOut ? ' is-off' : '') + '">' + hit(o, isSel) +
      badge(o) +
      '<div class="offer__content">' +
        '<div class="offer__body">' + stops(c.q, o) + price(o) + '</div>' +
        '<div class="offer__foot">' +
          '<div class="offer__tags t-body-sm c-secondary">' +
            (tg ? '<span class="badge badge--' + tone + '">' + esc(tg) + '</span>' : '') + '<span>' + text + '</span>' +
          '</div>' + infoBtn(o) +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function card(c, o, isSel) { return cardA(c, o, isSel); }

  // ---------- v4 (04.11.2026): variant 9 "Slider" of GoOpti-offers-variants-v2.html ----------
  // One shared card: the heading inside (How it works), a slider Fixed, 1h, 2h, 3h flex (dearest to cheapest) that picks the ride,
  // the route with what happens at the stops (Pick-up, Latest drop-off), the price per person. One private card the same way.
  // No tag line and no (i): the heading links open the ride sheet.
  const GAUGE_IDS = ['fixed', 'flex1', 'flex2', 'flex3'];
  function gaugeOpts(data) { return GAUGE_IDS.map(id => data.shared.find(o => o.id === id && !o.soldOut)).filter(Boolean); }
  // the option the shared card shows: the picked one, else the last one picked on this leg, else the default
  function curShared(c, opts, o) {
    if (o && opts.includes(o)) return o;
    const m = c.sel.key === c.data.key && opts.find(x => x.id === c.sel.mem);
    return m || opts.find(x => x.id === 'flex2') || opts.slice().sort((a, b) => a.unit - b.unit)[0];
  }
  function roleStops(c, o) {
    return '<div class="offer__route">' +
      '<div class="rail" aria-hidden="true"><span class="rail__dot"></span><span class="rail__line"></span><span class="rail__dot"></span></div>' +
      '<div class="offer__stops offer__stops--short">' +
        '<div class="offer__stop"><span class="t-label-lg nowrap">' + pickLabel(o) + '</span><span class="t-body nowrap">Pick-up</span></div>' +
        '<div class="offer__stop"><span class="t-label-lg nowrap">' + fromMin(o.arrival) + '</span><span class="t-body">' + (c.data.dropBy ? 'Latest ' : '') + '<span class="nowrap">' + (c.data.dropBy ? 'drop-off' : 'Drop-off') + '</span></span></div>' + // breaks between the words, not at the hyphen (320)
      '</div>' +
    '</div>';
  }
  function cardHead(kind, sub) {
    const shared = kind === 'shared';
    return '<div class="vc-title"><div class="vc-head">' +
        '<h2 class="offer-group__title t-h3">' + ic(shared ? 'shuttle' : 'car', 20) + (shared ? 'Shared transfer' : 'Private transfer') + '</h2>' +
        '<button class="link t-label is-live" data-act="about" data-kind="' + kind + '">' + (shared ? 'How it works' : 'What’s included') + '</button>' +
      '</div><span class="t-body-sm c-secondary">' + sub + '</span></div>';
  }
  const tickName = o => o.kind === 'flex' ? (o.window / 60) + 'h flex' : 'Fixed';
  // the window grows to the right from Fixed: the track is bright from the left end to the thumb; green on the picked card, grey on the other
  function gauge(opts, cur, on) {
    const last = opts.length - 1, at = opts.indexOf(cur);
    const ticks = opts.map((o, k) => {
      const pos = k === 0 ? '0' : k === last ? '100%' : 'calc(14px + (100% - 28px) * ' + k / last + ')';
      return '<button class="buffer__tick' + (k === at ? ' is-on' : '') + '" style="left:' + pos + '" data-act="pick" data-id="' + o.id + '" tabindex="-1" aria-hidden="true"><span>' + tickName(o) + '</span></button>';
    }).join('');
    const val = (cur.kind === 'flex' ? 'flexible pick-up, ' + hours(cur.window) : 'fixed pick-up') + ', ' + money(cur.unit);
    return '<div class="buffer vgauge is-live" style="' + (on ? '--tone:var(--color-icon-success);--tick-color:var(--color-text-success)' : '--tone:var(--color-icon-muted);--tick-color:var(--color-text-primary)') + '">' +
      '<div class="buffer__slider"><div class="buffer__track"></div><div class="vgauge__win" style="right:calc(14px + (100% - 28px) * ' + (1 - at / last) + ')"></div>' +
        '<input type="range" data-gauge min="0" max="' + last + '" step="1" value="' + at + '" aria-label="Pick-up time" aria-valuetext="' + esc(val) + '">' +
      '</div><div class="buffer__ticks">' + ticks + '</div></div>';
  }
  function slideCard(c, o, isSel, head, tail) {
    return '<div class="offer' + (isSel ? ' is-selected' : '') + '">' + hit(o, isSel) +
      '<div class="offer__content vgap">' + head + '<div class="offer__body">' + roleStops(c, o) + price(o) + '</div>' + (tail || '') + '</div></div>';
  }
  // 100% money refund (client 06.11.2026, moved here from Add-ons): once per booking, €4 into the total.
  // 9:41 menu: 1 - its own white card after Private; 2 - at the bottom of the Private card under a line, with the switch
  function refundCard(c) {
    return GO.offersRefund() === 1 && !c.data.empty ? '<section class="ex-card ex-card--line refund-card" aria-label="100% money refund">' + GO.refundBlock(!!c.s.refund) + '</section>' : '';
  }
  function refundIn(c) {
    return GO.offersRefund() === 2 ? '<hr class="offer__rule">' + GO.refundBlock(!!c.s.refund, 'refund--in') : '';
  }
  function refundSum(s) { return s.refund ? api.REFUND : 0; }
  function sliderList(c, o) {
    const opts = gaugeOpts(c.data);
    let html = '';
    if (opts.length) {
      const cur = curShared(c, opts, o), on = !!o && o.id === cur.id;
      html += '<section class="offer-group" aria-label="Shared transfer"><div class="offer-group__list" role="radiogroup" aria-label="Shared transfer">' +
        slideCard(c, cur, on, cardHead('shared', 'Flexible at pick-up? Pay less.' /* one line for every stop of the slider (user 17.11.2026) */) + (opts.length > 1 ? gauge(opts, cur, on) : '')) + '</div></section>';
    } else html += group(c, 'shared', c.data.shared, o && o.id); // every shared ride sold out: the cards say so
    html += c.data.priv.map(p => '<section class="offer-group" aria-label="Private transfer"><div class="offer-group__list" role="radiogroup" aria-label="Private transfer">' +
      slideCard(c, p, !!o && o.id === p.id, cardHead('private', 'No other passengers in the van'), refundIn(c)) + '</div></section>').join('');
    // Private first, Shared after it (user 17.11.2026)
    const pIdx = html.indexOf('<section class="offer-group" aria-label="Private transfer">');
    return pIdx > 0 ? html.slice(pIdx) + html.slice(0, pIdx) : html;
  }
  // dragging the slider picks on the fly: the screen is redrawn around the live range input, which stays in place, so the drag goes on
  function morph(a, b, keep) {
    if (!a.contains(keep)) return a.replaceWith(b);
    [...a.attributes].forEach(x => b.hasAttribute(x.name) || a.removeAttribute(x.name));
    [...b.attributes].forEach(x => a.setAttribute(x.name, x.value));
    if (a === keep) return;
    const kb = [...b.children];
    [...a.children].forEach((n, k) => morph(n, kb[k], keep));
  }

  function group(c, kind, list, selId) {
    if (!list.length) return '';
    const shared = kind === 'shared';
    return '<section class="offer-group" aria-labelledby="g-' + kind + '">' +
      '<div class="offer-group__head">' +
        '<h2 id="g-' + kind + '" class="offer-group__title t-h3">' + ic(shared ? 'shuttle' : 'car', 20) + (shared ? 'Shared transfer' : 'Private transfer') + '</h2>' +
        '<button class="link t-label" data-act="about" data-kind="' + kind + '">' + (shared ? 'How it works' : 'What’s included') + '</button>' +
      '</div>' +
      '<div class="offer-group__list" role="radiogroup" aria-labelledby="g-' + kind + '">' + list.map(o => card(c, o, o.id === selId)).join('') + '</div>' +
    '</section>';
  }

  function checkItem(icon, text) {
    return '<li class="check-item">' + ic(icon, 20, 'icon--success') + '<span class="t-body-sm">' + text + '</span></li>';
  }

  // the same three lines as every variant of GoOpti-offers-variants-v2.html (28.10.2026); plain teal ticks without the circle (16.11.2026)
  function trust() {
    return '<section class="trust-card" aria-labelledby="trust-title"><h2 id="trust-title" class="t-label-lg">Every GoOpti ride</h2><ul class="check-list">' +
      checkItem('check', 'Exact pick-up time and details by SMS the day before') +
      checkItem('check', 'Free cancellation within 24h of booking') +
      checkItem('check', 'Door to door with trusted &amp; licensed drivers') +
    '</ul></section>';
  }

  function emptyState(c) {
    const q = c.q, e = c.data.empty;
    // too soon (user 22.10.2026): rides are planned at least 8 hours ahead
    const text = e.reason === 'soon'
      ? 'We plan every ride at least 8 hours ahead, so the earliest pick-up is ' + (e.firstPick < 1440 ? 'at ' + fromMin(e.firstPick) + ' on ' + fmtDay(q.date) : 'on ' + fmtDay(u.addDays(q.date, 1)) + ' at ' + fromMin(e.firstPick))
      : e.reason === 'early'
      ? 'To reach ' + esc(placeLabel(q.to)) + ' by ' + q.time + ', the ride would have to leave the day before'
      : 'All rides from ' + esc(placeLabel(q.from)) + ' that reach ' + esc(placeLabel(q.to)) + ' by ' + q.time + ' on ' + fmtDay(q.date) + ' are booked';
    return '<div class="empty-state">' +
        '<span class="empty-state__icon">' + ic('clock', 24, 'icon--muted') + '</span>' +
        '<h2 class="t-h3">No rides at this time</h2>' +
        '<p class="t-body c-secondary">' + text + '</p>' +
      '</div>' +
      '<section class="offer-group" aria-labelledby="g-alt">' +
        (e.alternatives.length ? '<div><h2 id="g-alt" class="t-h3">But you can get these rides on ' + fmtDay(q.date) + '</h2>' +
        '<p class="t-body-sm c-secondary">Check that it still works for your flight</p></div>' +
        '<div class="offer-group__list" role="radiogroup" aria-labelledby="g-alt">' + e.alternatives.map(o => card(c, o, o.id === c.sel.id)).join('') + '</div>' : '') +
      '</section>' +
      '<div class="empty-actions">' +
        '<p class="t-body c-secondary">Or try another time or date:</p>' +
        // one button for both (user 22.10.2026), opens the date and time full screen
        '<button class="btn btn--primary" data-act="change-when">Change time and date</button>' +
      '</div>';
  }

  // Bottom bar, one line as on GoOpti-offers-variants-v2.html (the client's GoOpti-Offers-2-products.html, 28.10.2026):
  // Total and the sum on the left, "incl. transaction fee" under them opens Price details, the button takes the right half.
  // One-way: Continue. Round trip, Departure: departure total + "Choose return ride"; Return: both rides + one fee, Continue.
  function ctaBar(c, o) {
    if (c.data.empty && !o) return '';
    if (!o) return '<div class="cta-bar"><button class="btn btn--primary" disabled>Choose a ride</button></div>';
    let sum = o.total, label = 'Continue', act = 'continue';
    if (c.round) {
      const other = pickedOf(c.leg === 'out' ? 'ret' : 'out');
      if (c.leg === 'out') { label = 'Choose return ride'; act = 'to-return'; }
      else if (other) sum += other.total;
      else { label = 'Choose departure ride'; act = 'to-departure'; }
    }
    return '<div class="cta-bar cta-bar--total cta-inline"><div class="cta-inline__total">' +
        '<div class="cta-inline__sum"><span class="t-label-lg total-info">Total<button type="button" class="total-info__btn" data-act="total" aria-label="Price details">' + GO.icon('info', 16) + '</button></span><span class="t-h2 nowrap" aria-live="polite">' + money2(sum + c.data.fee + refundSum(c.s)) + '</span></div>' +
        '<div class="cta-inline__note"><button class="link t-caption c-tertiary" data-act="total" aria-label="Price details, incl. transaction fee">incl. transaction fee</button></div>' +
      '</div><button class="btn btn--primary cta-inline__btn" data-act="' + act + '">' + label + '</button></div>';
  }

  function skeleton() {
    const card = '<div class="offer offer--skeleton" aria-hidden="true"><span class="sk sk--w60"></span><span class="sk sk--w40"></span><span class="sk sk--w70"></span></div>';
    return '<div class="offer-group" role="status"><span class="sr-only">Looking for rides…</span>' + card + card + card + '</div>';
  }

  // ---------- screens: offers (departure / one-way) and offers-return ----------
  function offersScreen(leg) {
    return {
      render() {
        // back on the offers from Edit search without "Update search": the old search returns
        if (GO.store.get().editSnap && !GO.router.path().startsWith('/edit')) GO.editRestore();
        const c = ctx(leg);
        if (!c.q.from || !c.q.to || !c.q.date || !c.q.time) {
          return header(c) + '<main class="stub"><p class="t-body c-secondary">Fill in the search first</p><button class="btn btn--primary" data-act="search">Go to search</button></main>';
        }
        if (!c.data) return header(c) + '<main class="offers-main">' + skeleton() + '</main>';
        syncSelection(c);
        const o = selected(c);
        const body = c.data.empty
          ? emptyState(c)
          : sliderList(c, o) + refundCard(c) + trust();
        return header(c) + '<main class="offers-main">' + body + '</main>' + ctaBar(c, o);
      },

      // Fetch this leg (and the other one of a round trip, for the total) when not cached yet
      mount(root) {
        slideLegs(root);
        const range = root.querySelector('input[data-gauge]');
        if (range) range.addEventListener('input', () => {
          const o = gaugeOpts(ctx(leg).data)[+range.value];
          if (!o) return;
          if (GO.offersRefund() === 2 && GO.store.get().refund) GO.store.set({ refund: false }); // a shared ride drops the Private card's refund
          setSel(leg, { id: o.id, mem: o.id });
          const tmp = document.createElement('div');
          tmp.innerHTML = this.render();
          const kb = [...tmp.children];
          [...root.children].forEach((n, k) => kb[k] && morph(n, kb[k], range));
          // a new flexibility: "How it works" pulses once, the rules changed with it (user 17.11.2026)
          if (range.value !== range.dataset.last) {
            range.dataset.last = range.value;
            const how = root.querySelector('[data-act=about][data-kind=shared]');
            if (how && how.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
              how.getAnimations().forEach(x => x.cancel());
              // a soft blink: the link fades and comes back with a thicker underline, nothing behind it (user 17.11.2026; was a grey wash)
              how.animate([
                { opacity: 1, textDecorationThickness: '1px' },
                { opacity: .35, textDecorationThickness: '2px', offset: .4 },
                { opacity: 1, textDecorationThickness: '1px' },
              ], { duration: 520, easing: 'ease-in-out' });
            }
          }
        });
        if (range) range.dataset.last = range.value;
        const s = GO.store.get();
        const legs = isRound(s) ? ['out', 'ret'] : ['out'];
        const missing = legs.map(l => api.legSearch(s, l)).filter(q => q.from && q.to && q.date && q.time && !api.offersCached(q));
        if (!missing.length) return;
        const keys = missing.map(api.searchKey);
        Promise.all(missing.map(q => api.offers(q))).then(() => {
          const now = GO.store.get();
          const still = keys.every(k => legs.some(l => api.searchKey(api.legSearch(now, l)) === k));
          if (GO.router.path().startsWith('/offers') && still) GO.router.refresh();
        });
      },

      actions: {
        back: () => GO.router.back(),
        search: () => GO.router.go('/'),
        // pencil: the whole search in Edit search (2303:5283); Change time / date in the empty state: date and time sheet (1719:13909)
        edit: () => GO.editSearch(leg === 'ret' ? 'offers-return' : 'offers'),
        'change-when': () => GO.router.go(leg === 'ret' ? '/offers/return/when' : '/offers/when'),
        leg(el) {
          if (el.dataset.leg === leg) return;
          legFrom = leg === 'ret' ? 1 : 0;
          GO.router.go(el.dataset.leg === 'ret' ? '/offers/return' : '/offers', { replace: true });
        },
        'to-return': () => askHouse(leg, 'to-return') || (legFrom = 0, GO.router.go('/offers/return')),
        'to-departure': () => { legFrom = 1; GO.router.go('/offers', { replace: true }); },
        // a street without a house number: the first pick asks for it, the ride stays selected underneath
        pick(el) {
          // variant 2: the refund sits in the Private card, so a shared ride drops it
          if (GO.offersRefund() === 2 && !/^priv/.test(el.dataset.id) && GO.store.get().refund) GO.store.set({ refund: false });
          setSel(leg, /^(flex|fixed)/.test(el.dataset.id) ? { id: el.dataset.id, mem: el.dataset.id } : { id: el.dataset.id });
          const p = houseSide(api.legSearch(GO.store.get(), leg));
          if (p && GO.store.get().houseAsked !== p.place.id) {
            GO.store.set({ houseAsked: p.place.id });
            askHouse(leg, 'close');
          } else GO.router.refresh();
        },
        info(el) {
          GO.store.set({ infoOfferId: el.dataset.id, sheetLeg: leg });
          GO.router.go('/offers/offer');
        },
        about(el) {
          GO.store.set({ sheetLeg: leg });
          GO.router.go(el.dataset.kind === 'shared' ? '/offers/shared' : '/offers/private');
        },
        // the switch toggles the refund; in variant 2 it also picks the private ride it sits in
        refund() {
          const on = !GO.store.get().refund;
          GO.store.set({ refund: on });
          const c = ctx(leg), p = c.data && c.data.priv[0];
          if (on && GO.offersRefund() === 2 && p && !p.soldOut) setSel(leg, { id: p.id });
          GO.router.refresh();
          const b = document.querySelector('[data-act=refund]'); if (b) b.focus({ preventScroll: true });
        },
        total() {
          GO.store.set({ sheetLeg: leg });
          GO.router.go('/offers/total');
        },
        continue: () => askHouse(leg, 'continue') || GO.router.go('/extras'),
      },
    };
  }

  // The address of the leg that still lacks a house number, and its role (pick-up or drop-off)
  function houseSide(q) {
    if (q.from && q.from.noNumber) return { place: q.from, pickup: true };
    if (q.to && q.to.noNumber) return { place: q.to, pickup: false };
    return null;
  }
  // Opens the house number sheet when it is needed; next is what Save does after saving
  function askHouse(leg, next) {
    if (!houseSide(api.legSearch(GO.store.get(), leg))) return false;
    GO.store.set({ sheetLeg: leg, houseNext: next });
    GO.router.go('/offers/house');
    return true;
  }

  GO.screens.offers = offersScreen('out');
  GO.screens['offers-return'] = offersScreen('ret');

  // ---------- sheets ----------
  function sheetHead(title, subtitle) {
