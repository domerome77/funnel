:root {
  /* Primitives */
  --primary-50: #fef4f6;  --primary-100: #ffe3e8; --primary-200: #f9d2db; --primary-300: #ee87a9; --primary-400: #e85289;
  --primary-500: #ee2b74; --primary-600: #da0364; --primary-700: #a8024c; --primary-800: #820039; --primary-900: #5e0027;
  --secondary-50: #edfaf8; --secondary-100: #d8f0ee; --secondary-200: #9cd9d3; --secondary-300: #61c3b9; --secondary-400: #3dbab1;
  --secondary-500: #00b4aa; --secondary-600: #088079; --secondary-700: #056963; --secondary-800: #04504b; --secondary-900: #003935;
  --neutral-0: #ffffff; --neutral-50: #f5f5f5; --neutral-100: #ededed; --neutral-200: #dedede; --neutral-300: #c4c4c4;
  --neutral-400: #a8a8a8; --neutral-500: #858585; --neutral-600: #6b6b6b; --neutral-700: #575757; --neutral-800: #3e3e3e;
  --neutral-900: #1f1f1f; --neutral-1000: #000000;
  --error-50: #fff4f2; --error-100: #ffe5df; --error-600: #d1320f; --error-700: #a61f00;
  --warning-50: #fff7ef; --warning-100: #ffedda; --warning-600: #a26402; --warning-700: #804e00;
  --neutral-alpha-50: #00000080;
  --sand-50: #fcfaf3; --sand-100: #f9f5e6; --sand-200: #eae7d8;

  /* Semantic colors */
  --color-text-primary: var(--neutral-1000);
  --color-text-secondary: var(--neutral-800);
  --color-text-tertiary: var(--neutral-600);
  --color-text-disabled: var(--neutral-400);
  --color-text-inverse: var(--neutral-0);
  --color-text-brand: #ed3180;
  --color-text-brand-link: var(--primary-600); /* pink text links (v5 Add-ons): #ed3180 is 3.9 : 1 on white, below AA */
  --color-text-success: var(--secondary-700);
  --color-text-error: var(--error-700);
  --color-text-warning: var(--warning-700);
  --color-bg-page: var(--neutral-0);
  --color-bg-subtle: var(--neutral-50);
  --color-bg-muted: var(--neutral-100);
  --color-bg-inverse: var(--neutral-900);
  --color-bg-selected: #0f1b2d; /* midnight: the picked day in the calendar (v5, Presentations New 05.11) */
  --color-bg-overlay: var(--neutral-alpha-50);
  --color-bg-brand-subtle: var(--primary-50);
  --color-bg-success-subtle: var(--secondary-100);
  --color-bg-error-subtle: var(--error-100);
  --color-bg-warning-subtle: var(--warning-100);
  --color-bg-sand: var(--sand-50);
  --color-bg-sand-muted: var(--sand-100);
  --color-bg-sand-strong: var(--sand-200);
  /* gold perk badge (Latest pick-up), as in Anya's desktop 22.10.2026; not in the Figma kit yet */
  --color-bg-gold-subtle: #f6ebc8;
  --color-text-gold: #7a5a00;
  --color-action-primary: #ed3180;
  --color-action-primary-hover: var(--primary-600);
  --color-action-primary-pressed: var(--primary-700);
  --color-action-disabled: var(--neutral-200);
  --color-action-success: var(--secondary-600);
  --color-border-subtle: var(--neutral-200);
  --color-border-input: var(--neutral-500);
  --color-border-strong: var(--neutral-1000);
  --color-border-selected: #ed3180;
  --color-border-error: var(--error-600);
  --color-border-success: var(--secondary-600);
  --color-focus-ring: var(--neutral-1000);
  --color-icon-default: var(--neutral-1000);
  --color-icon-muted: var(--neutral-600);
  --color-icon-inverse: var(--neutral-0);
  --color-icon-brand: #ed3180;
  --color-icon-success: var(--secondary-600);
  --color-icon-warning: var(--warning-600);
  --color-icon-error: var(--error-600);
  --color-icon-disabled: var(--neutral-400);
  --color-control-off: var(--neutral-500);

  /* Type */
  --font-family: 'Rethink Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* Responsive collection, mode "mobile" */
  --font-size-display: 32px;  --line-height-display: 40px;
  --font-size-h1: 28px;       --line-height-h1: 36px;
  --font-size-h2: 22px;       --line-height-h2: 28px;
  --font-size-h3: 18px;       --line-height-h3: 24px;
  --font-size-label-lg: 16px; --line-height-label-lg: 24px;
  --font-size-body: 16px;     --line-height-body: 24px;
  --font-size-body-sm: 14px;  --line-height-body-sm: 20px;
  --font-size-label: 14px;    --line-height-label: 20px;
  --font-size-label-sm: 12px; --line-height-label-sm: 16px;
  --font-size-caption: 12px;  --line-height-caption: 16px;

  /* Space, radius */
  --space-0: 0; --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-20: 20px;
  --space-24: 24px; --space-32: 32px; --space-40: 40px; --space-48: 48px; --space-64: 64px;
  /* radii (system 10.11.2026, as Anya's prototype): 4 the checkbox and the flag, 8 small things inside, 12 every control, 16 every card and plate */
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
  /* control heights: a field and the main button 56, a secondary button 48, a small control 36 */
  --control-h-lg: 56px; --control-h-md: 48px; --control-h-sm: 36px;

  --layout-page-margin: var(--space-16);
  --layout-section-gap: var(--space-32);
  --layout-block-gap: var(--space-24);
  --layout-card-padding: var(--space-16);

  /* Effect styles */
  --shadow-raised: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.08);
  --shadow-overlay: 0 4px 12px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.16);
  --shadow-sticky-top: 0 -1px 2px rgba(0,0,0,.06), 0 -2px 8px rgba(0,0,0,.08);

  /* Prototype only: width of the app column on wide screens */
  --app-max-width: 480px;
}

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

/* Device insets. Inside the desktop phone frame (js/frame.js) they are faked: status bar on top, home indicator below. */
:root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
/* no home indicator in the frame: the bottom inset only brings the bar's bottom padding to 22, as in the client prototype (user, 20.10.2026) */
html.is-framed { --safe-top: 47px; --safe-bottom: 6px; scrollbar-width: none; }
html.is-framed ::-webkit-scrollbar { display: none; }
html.is-framed * { scrollbar-width: none; }

body {
  font-family: var(--font-family);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  color: var(--color-text-primary);
  background: var(--color-bg-muted);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
body.is-locked { overflow: hidden; }

button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; text-align: inherit; }
img, svg { display: block; }

[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* The app column: full width on phones, centred column on wide screens (no device frame). */
#app {
  max-width: var(--app-max-width);
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--color-bg-page);
  position: relative;
  /* a column: the screen's main takes the free height, so a short screen keeps its sticky bar at the bottom (user 21.10.2026) */
  display: flex; flex-direction: column;
}
#app > main { flex: 1 0 auto; }
@media (min-width: 481px) {
  #app { box-shadow: 0 0 0 1px var(--color-border-subtle); }
}

/* Desktop phone frame: the page shows a 390×844 phone like the client prototype, the prototype runs inside it in an iframe */
.stage {
  height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: var(--color-bg-muted);
}
.stage__phone {
  width: 390px; height: 844px; flex-shrink: 0;
  border-radius: 54px; overflow: hidden; /* as in the client prototype: iPhone 12–14, 390×844 */
  background: var(--color-bg-page);
  box-shadow: 0 0 0 1px var(--neutral-300);
  transform-origin: center;
}
.stage__phone iframe { display: block; width: 100%; height: 100%; border: 0; }

/* Drawn inside the iframe, over the app */
.device-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 47px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 30px 0 34px;
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--color-text-primary); pointer-events: none;
}
.device-bar__time { pointer-events: auto; padding: 8px; margin: -8px; } /* system menu on click (22.10.2026) */
.device-bar.is-light { color: var(--color-text-inverse); }
.device-bar__icons { display: flex; align-items: center; gap: 6px; }
.device-bar svg { fill: currentColor; }
.device-bar__island {
  position: absolute; top: 11px; left: 50%; width: 122px; height: 35px; margin-left: -61px;
  border-radius: 18px; background: var(--neutral-1000);
}

/* Text styles */
.t-display  { font-size: var(--font-size-display); line-height: var(--line-height-display); font-weight: 700; letter-spacing: -0.01em; }
.t-h1       { font-size: var(--font-size-h1); line-height: var(--line-height-h1); font-weight: 700; letter-spacing: -0.01em; }
.t-h2       { font-size: var(--font-size-h2); line-height: var(--line-height-h2); font-weight: 700; }
.t-h3       { font-size: var(--font-size-h3); line-height: var(--line-height-h3); font-weight: 600; }
.t-label-lg { font-size: var(--font-size-label-lg); line-height: var(--line-height-label-lg); font-weight: 600; }
.t-body     { font-size: var(--font-size-body); line-height: var(--line-height-body); font-weight: 400; }
.t-body-sm  { font-size: var(--font-size-body-sm); line-height: var(--line-height-body-sm); font-weight: 400; }

/* passengers: two steppers side by side (Flow 01 - Home - return filled) */
.booking__cell--pax { height: auto; min-height: 0; padding: var(--space-4) var(--space-8); gap: 0; }
@media (hover: hover) { .booking__cell--pax:hover { background: var(--color-bg-page); } }
.pax-stepper { flex: 1; min-width: 0; min-height: 56px; padding: var(--space-8) 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
.booking__pax { background: var(--color-bg-page); }
/* date and time sheet, tighter top (user, 20.10.2026): tabs close to the title, the month row close to the tabs */
.sheet__body.when-body { padding-top: 0; }
/* the calendar on a grey card of its own, as the time under it (user 03.11.2026; on the page before, 8 closer to the tabs):

.when-body > .calendar { padding: 2px var(--space-8) var(--space-16); border-radius: var(--radius-lg); background: var(--color-bg-subtle); }
@media (hover: hover) { .when-body .calendar__day:hover:not([disabled]):not([aria-pressed="true"]) > span { background: var(--color-bg-page); } }
/* the added flight as the second section of the note on the date and time screen from Finish booking (21.10.2026) */
/* the plane stands in the emoji column (20 px + gap 12) and the flight lines up with the text above (user 21.10.2026) */
.hint__flight { display: flex; align-items: flex-start; gap: var(--space-12); margin: var(--space-8) 0 0 calc(-20px - var(--space-12)); padding-top: var(--space-8); border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
.hint__flight > .icon { margin-top: 0; }
.hint__flight-text { display: flex; flex-direction: column; min-width: 0; }
.hint__night { margin-top: var(--space-4); color: var(--color-text-warning); } /* night landing under the flight in the time sheet (12.11.2026) */
/* child seats line inside the passengers cell, under the steppers (Anya's desktop, 20.10.2026) */
.pax-note { padding: 0 var(--space-16) var(--space-12); text-align: center; color: var(--color-text-secondary); }
/* the swap button sits on the seam of the rows and crosses only the From value */
.booking__cell--from { padding-right: 60px; }
/* date and return share the row; the date never gets cut if it needs more than half */
/* date and return are two equal halves, the divider in the middle (user 10.11.2026; the date took max-content and pushed it right).
   12 on the sides, as the return cell, so "Wed 11 Nov, 12:00" fits a half at 375 */
.booking__cell--date { flex: 1 1 0; min-width: 0; }
/* flex 1 1 0 still left the date wider by its padding (the return wrapper has none): a grid of two equal columns */
.booking__row:has(> .booking__cell--date) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
/* the halves grow together when the time wraps under the day (320); the return cell's value is the same .booking__value */
.hero .booking__row:has(> .booking__cell--date) .booking__cell { height: auto; align-items: flex-start; } /* top-aligned: the labels sit on one line when a half wraps */
.hero .booking__row:has(> .booking__cell--date) .booking__value { white-space: normal; overflow: visible; text-overflow: clip; }
/* user 10.11.2026 (GoOpti Presentations 857:10, 858:10): 16 on the left as the other cells, 12 on the right;
   labels 12/20 regular, so the filled row is 60 (8 + 20 + 24 + 8) */
.hero .booking__row:has(> .booking__cell--date) > * { padding: var(--space-8) var(--space-12) var(--space-8) var(--space-16); }
.hero .booking__row:has(> .booking__cell--date) .booking__label { font-weight: 400; line-height: var(--line-height-body-sm); }
/* "+ Add return trip" on the line of the departure date, below the label height (user 10.11.2026; it sat on the label line) */
.hero .booking__cell--add-ret .booking__text { padding-top: var(--line-height-body-sm); }
/* with a return date the halves go by content: the return hugs its date and cross (8 to the cross, 12 after it),
   the departure takes the rest, so the spare space never lands around the cross (user 10.11.2026) */
.hero .booking__row--ret { display: flex; }
.hero .booking__row--ret > .booking__cell--date { flex: 1 1 auto; }
.home-ret { position: relative; flex: 0 1 auto; align-items: flex-end; gap: var(--space-4); }
.hero .booking__row:has(> .booking__cell--date) > .home-ret { align-items: flex-end; }
.home-ret__main { flex: 0 1 auto; min-width: 0; display: flex; text-align: left; }
.home-ret__main::before { content: ''; position: absolute; inset: 0; } /* the whole cell opens the return */
.home-ret__main:focus-visible { outline: none; }
.home-ret__main:focus-visible::before { outline: 2px solid var(--color-focus-ring); outline-offset: -2px; }
/* 16 icon right after the date (8 to the text: 4 gap + 4 inside the 24 target) */
/* pinned to the cell's right edge (12 to the icon, as in Figma), not to the end of the text: the text width is fractional,
   and a cross on a fractional x got a light notch in the middle from antialiasing (user 10.11.2026). The return cell
   hugs its content, so the cross still sits right after the date */
.home-ret__clear { position: relative; z-index: 1; flex-shrink: 0; margin-left: auto; margin-right: calc(-1 * var(--space-4)); width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.home-ret__clear .icon { color: var(--color-text-tertiary); }
@media (hover: hover) { .home-ret__clear:hover .icon { color: var(--color-text-primary); } }
.booking__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.booking__label { font-size: var(--font-size-label-sm); line-height: var(--line-height-label-sm); font-weight: 600; color: var(--color-text-secondary); }

}

.booking__swap .icon { width: 17px; height: 16px; }

/* the form on midnight (Anya's prototype, Figma UI Kit 3119:49777, user 10.11.2026): grey cells 56, radius 12, a 1 px light grey seam,
   no shadow; From/To as one line "From: any location" 18/24. Only on the home page: Edit search keeps its form */
.hero .booking { background: var(--neutral-200); box-shadow: none; color: var(--color-text-primary); border-radius: var(--radius-md); gap: 1px; }
.hero .booking__row { gap: 1px; }

.hero .booking__cell { height: 56px; min-height: 56px; padding: var(--space-8) var(--space-16); background: var(--color-bg-page); }
.hero .booking__pax { background: var(--color-bg-page); }
.hero .ret-cell > .ret-cell__main { padding-left: var(--space-12); padding-right: var(--space-12); } /* keeps 12, so the return date and time fit at 375 */
/* the swap sits on the seam and reaches into both rows: neither line runs under it (Anya's To ran under it at 320) */
.hero .booking__cell--to { padding-right: 60px; }
.hero .booking__cell--pax { height: auto; min-height: 0; padding: var(--space-4) var(--space-8); }
@media (hover: hover) { .hero .booking__cell:hover { background: var(--color-bg-subtle); } .hero .booking__cell--pax:hover { background: var(--color-bg-page); } }
.hero .booking__swap { top: 38px; background: var(--color-bg-subtle); border-color: var(--neutral-200); } /* on the seam under the 56 row */
@media (hover: hover) { .hero .booking__swap:hover { background: var(--color-bg-muted); } }
/* the placeholder in our tertiary, not Anya's neutral-400: 4.9:1 on the grey cell (neutral-400 is 2.2) */

.booking__line .is-empty { color: var(--color-text-tertiary); }
/* trust figures white on midnight, the captions white 60% (Anya's trust strip), our four in two columns */
.hero .trust__sub { color: rgba(255, 255, 255, .6); }
.btn--hero { min-height: var(--control-h-lg); border-radius: var(--radius-md); font-size: var(--font-size-h3); line-height: var(--line-height-h3); }

/* two equal columns of the page; the star sits on the axis of the form icons: card padding + (24 - 20) / 2,
   the shield stays at the start of the second column (user, 20.10.2026) */
.trust { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-16); }
.trust__item { min-width: 0; display: flex; align-items: center; gap: var(--space-8); }

/* Why passengers pick GoOpti (Anya's prototype, Figma UI Kit 3119:49837): four reasons in two columns, illustrations 52, grey band */
/* user 10.11.2026 (GoOpti Presentations 857:10): title to list 20 (was 32), names 16/24 semibold (was h3 18) */
.why { display: flex; flex-direction: column; gap: var(--space-20); padding: var(--space-32) var(--layout-page-margin); background: var(--color-bg-subtle); }
.why__name { font-size: var(--font-size-body); line-height: var(--line-height-body); font-weight: 600; }
.why__list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-24) var(--space-16); }

/* ---------- Full-screen sheets (Layout/Bottom sheet, full height) ---------- */
.sheet-layer {
  position: fixed; left: 0; right: 0; z-index: 50;
  top: var(--vvt, 0); height: var(--vvh, 100%);
  display: flex; justify-content: center;
  background: var(--color-bg-overlay);
  animation: fade-in .2s ease-out;
}
.sheet {
  width: 100%; max-width: var(--app-max-width); height: 100%;
  display: flex; flex-direction: column;
  background: var(--color-bg-page);
  box-shadow: var(--shadow-overlay);
  padding-top: var(--safe-top);
  animation: sheet-up .28s cubic-bezier(.2,.8,.2,1);
}
.sheet--no-anim { animation: none; }
/* full-screen editing (Edit search, Where from / to, date and time) is a page, not a sheet:
   no slide-up, no dimmed backdrop, no shadow (user, 20.10.2026). Bottom sheets keep their animation */
.sheet-layer:has(> .sheet:not(.sheet--bottom):not(.sheet--dialog)) { animation: none; background: var(--color-bg-page); }
.sheet:not(.sheet--bottom):not(.sheet--dialog) { animation: none; box-shadow: none; }
.sheet__body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: var(--space-8) var(--space-16) var(--space-16);
  display: flex; flex-direction: column; gap: var(--space-8);
}
.sheet__body--gap16 { gap: var(--space-16); }
/* the newsletter opt-in in the centred login dialog reads from the left, as every checkbox */
/* the opt-in belongs to the email: 12 under the field (16 gap + 8 padding - 12), 24 over Continue (user 12.11.2026) */
.auth .news-opt.checkbox { text-align: left; margin-top: -12px; }
/* a sheet without a button at the end (No Worries once added, user 12.11.2026): the body keeps room above the home indicator */
.sheet--bottom .sheet__body:last-child { padding-bottom: calc(var(--space-32) + var(--safe-bottom)); }
/* the CTA bar sits under the scrolling body of a sheet; in a sheet the button stands on the sheet itself, no shadow or top line (15.10.2026) */
.sheet .cta-bar { position: static; border-top: 0; box-shadow: none; }
@keyframes sheet-up { from { transform: translateY(32px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } }

/* "From" sits above the title (Where to) or keeps an empty slot of the same height (Where from), so the field doesn't jump between the steps */
.chip {
  min-width: 0; max-width: 100%; padding: var(--space-4) var(--space-12); border-radius: var(--radius-sm);
  background: var(--color-bg-sand-muted);
}
.chip--btn { min-height: 32px; text-align: left; }
@media (hover: hover) { .chip--btn:hover { background: var(--color-bg-sand-strong); } }
.chip--btn:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.place-list { display: flex; flex-direction: column; padding-top: var(--space-4); }
.place-list__status { display: flex; align-items: center; gap: var(--space-12); padding: var(--space-12) var(--space-8); color: var(--color-text-tertiary); }

/* ---------- Date & time ---------- */
/* The calendar bigger, the time smaller (client sketch 02.11.2026): days 52 high with a 44 square,
   the time one compact row under a thin line, selects 40 high */
/* v5 (Presentations New 05.11 679:698): days back to 44 rows with a 40 square, a thin line under the month row,
   the days before the booking window at half opacity, the picked day midnight */
.when-body .calendar__day { height: 44px; min-width: 0; }
.when-body .calendar__day > span { width: min(40px, 100%); height: 40px; }
.when-body .calendar__header { padding: var(--space-4) 0 var(--space-4); border-bottom: 1px solid var(--color-border-subtle); margin: 0 calc(-1 * var(--space-8)) 0; padding-left: var(--space-8); padding-right: var(--space-8); }
.when-body .calendar__day[disabled] { color: var(--color-text-primary); opacity: .5; }
.when-body .calendar__day[aria-pressed="true"] > span { background: var(--color-bg-selected); }
/* label on the left, hour : minutes on the right; a long label wraps in its column */
/* on a grey card as the sections on Add-ons and payment (user 02.11.2026; under a thin line before), the selects white on it */
.time-field { display: flex; align-items: center; gap: var(--space-4); padding: var(--layout-card-padding); border-radius: var(--radius-lg); background: var(--color-bg-subtle); }
.time-field__label { flex: 1 1 auto; min-width: 0; margin-right: var(--space-4); display: flex; flex-direction: column; } /* label, helper text under it */
/* v5 (Presentations New 05.11 679:822): white, no border, 36 high, the digits h3 semibold 18, 16 left, the up-and-down chevron 20 at 8 from the edge.
   36 high, the tap area 36 × 72 (WCAG 2.2 AA asks 24) */
.select--time { flex: 0 0 auto; width: 72px; }
.select--time select { min-height: 36px; padding: 6px 32px 6px var(--space-16); border-color: transparent; font-size: var(--font-size-h3); line-height: var(--line-height-h3); font-weight: 600; }
.select--time select:focus-visible { padding: 5px 31px 5px 15px; }
.select--time .icon { right: var(--space-8); }
.time-field__colon { flex-shrink: 0; padding: 0 var(--space-4); }
.time-help { margin-top: calc(-1 * var(--space-4)); } /* the advice under the card, 12 from it (body gap 16) */

/* Flight-time gauge zones (Anya, 20.10.2026): track and thumb, the message under the slider at 15 % of the same colour,
   the label of the chosen stop darker for contrast. Not in the kit yet: tokens come with the move to the kit */
:root {
  --gauge-green: #3E9B4F;  --gauge-green-text: #2D7339;
  --gauge-yellow: #E8A317; --gauge-yellow-text: #946400;
  --gauge-red: #E4572E;    --gauge-red-text: #B8401C;
  --gauge-green-bg: color-mix(in srgb, var(--gauge-green) 15%, var(--color-bg-page));
  --gauge-yellow-bg: color-mix(in srgb, var(--gauge-yellow) 15%, var(--color-bg-page));
  --gauge-red-bg: color-mix(in srgb, var(--gauge-red) 15%, var(--color-bg-page));
  /* the plate for messages that need an action (decision 19.10.2026): sand as the baggage terms, one colour for every warning
     (Anya 16.11.2026; was yellow #FFFEDA) */
  --gauge-warn-bg: var(--color-bg-sand-muted);
}

/* Grey hint under the time selects and the slider (14.10.2026, no pointer since 20.10.2026); under the slider it takes the zone colour */
.hint {
  position: relative; margin-top: var(--space-8);
  display: flex; align-items: flex-start; gap: var(--space-12);
  padding: var(--space-16);
  border-radius: var(--radius-lg); background: var(--hint-bg, var(--color-bg-subtle));
}
/* 24 px, as in Anya's informers (user 23.10.2026; was 18 in a 20 px column) */
.hint__emoji .icon { color: var(--hint-icon, currentColor); }
.hint__emoji { width: 24px; flex-shrink: 0; font-size: 24px; line-height: 24px; text-align: center; }
.hint__body { flex: 1; min-width: 0; display: flex; flex-direction: column; } /* title 16/24 and text 14/20 without a gap, as in Anya's desktop (21.10.2026) */
.hint__text { color: var(--color-text-secondary); }
/* advice and promise: grey text under the time, no plate, emoji or title (client sketch, user 02.11.2026);
   zone colours and the yellow plate keep all three */
.hint--plain { margin-top: 0; padding: 0; background: none; }
/* drop-off zone notes look like the flight verdicts on Finish booking (user 17.11.2026): sand plate, text 16/24 and icon in the zone colour */
.hint--zone { gap: var(--space-8); background: none; padding: 0; margin-top: 0; }
.hint--zone[data-zone="green"] { --zone-c: var(--color-text-success); } /* the green of the promo "10% off" (user 17.11.2026) */
.hint--zone[data-zone="yellow"] { --zone-c: #a87000; }
.hint--zone[data-zone="red"] { --zone-c: #d1220a; }
.hint--zone .hint__emoji { width: 22px; height: 24px; display: flex; align-items: center; }
.hint--zone .hint__emoji .icon { color: var(--zone-c); }
.hint--zone .hint__text { color: var(--zone-c); font-size: var(--font-size-body); line-height: var(--line-height-body); }
.hint--zone .hint__flight { margin-left: calc(-22px - var(--space-8)); border-top-color: var(--color-border-subtle); }
.hint--plain .hint__flight { margin-left: 0; }

/* Buffer slider: native range input, styled */


/* ---------- Edit search (2303:5617): the home form outlined, no shadows ---------- */
.edit-body { padding-top: var(--space-16); }
.edit-form { display: flex; flex-direction: column; gap: var(--space-12); }
.edit-box { position: relative; display: flex; flex-direction: column; border: 1px solid var(--color-border-input); border-radius: var(--radius-md); background: var(--color-bg-page); }
.edit-dates { flex-direction: row; }
.edit-cell { flex: 1; min-width: 0; height: 56px; min-height: 56px; display: flex; align-items: center; gap: var(--space-8); padding: var(--space-8) var(--space-16); text-align: left; border-radius: var(--radius-md); } /* 56 as the form on Home (system 10.11.2026; was 64) */
@media (hover: hover) { .edit-cell:hover { background: var(--color-bg-subtle); } }
.edit-cell--from { padding-right: 64px; }
.edit-cell--date { flex: 1 1 0; min-width: max-content; }
.edit-divider { height: 1px; background: var(--color-border-input); flex-shrink: 0; }
.edit-divider--v { width: 1px; height: auto; align-self: stretch; }
.edit-swap { top: 38px; } /* on the seam under the 56 row (was 46 under 64) */
.edit-pax__row { display: flex; align-items: center; padding: var(--space-4) var(--space-8); }

/* ---------- Bottom sheets (Layout/Bottom sheet, hug height) ---------- */
.sheet--bottom {
  height: auto; max-height: calc(100% - 24px); align-self: flex-end;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding-top: 0;
}
/* content taller than the screen: the bottom sheet opens full screen, like Where from (user, 20.10.2026; js/router.js fitSheet) */
.sheet--bottom.sheet--full { height: 100%; max-height: none; border-radius: 0; padding-top: var(--safe-top); }
.sheet--full > .sheet-handle { display: none; }
.sheet-handle { width: 36px; height: 4px; margin: 8px auto 0; border-radius: var(--radius-full); background: var(--color-border-subtle); flex-shrink: 0; }

/* ---------- Offers ---------- */
.offers-top { position: sticky; top: 0; z-index: 10; padding-top: var(--safe-top); background: var(--color-bg-page); }
/* the status bar area takes the grey of the summary under it (user 23.10.2026); with the Departure / Return tabs on top it stays white */
.offers-top:not(:has(.leg-tabs)) { background: var(--color-bg-subtle); }
.offers-header { display: flex; align-items: center; padding-left: var(--space-4); background: var(--color-bg-subtle); }
/* Navigation/Tabs style=underline: Departure / Return */
.leg-tabs { display: flex; padding-top: var(--space-4); background: var(--color-bg-page); }
.leg-tab {
  flex: 1; min-width: 0; min-height: 48px; padding-top: var(--space-8);
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  font-size: var(--font-size-label-lg); line-height: var(--line-height-label-lg); font-weight: 600;
  color: var(--color-text-secondary);
}
.leg-tab::after { content: ''; height: 1px; background: var(--color-border-subtle); }
.leg-tab[aria-selected="true"] { color: var(--color-text-brand); gap: 4px; }
.leg-tab[aria-selected="true"]::after { height: 3px; background: var(--color-icon-brand); }
.leg-tab__title { display: flex; align-items: center; justify-content: center; gap: var(--space-8); }
.leg-tab:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: -2px; }
.search-summary { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-12); padding: var(--space-12) var(--space-8) var(--space-12) var(--space-4); }
.search-summary__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.search-summary__meta { display: flex; flex-wrap: wrap; gap: 2px var(--space-8); }

.offers-main { display: flex; flex-direction: column; gap: var(--layout-block-gap); padding: var(--space-16) var(--layout-page-margin) var(--space-32); }

.filter-tabs { display: flex; gap: var(--space-4); }
.filter-tab {
  flex: 1; min-width: 0; min-height: 44px;
  display: flex; flex-direction: column; align-items: center;
  padding: var(--space-4) var(--space-12); border-radius: var(--radius-md);
  text-align: center;
}
.filter-tab > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .filter-tab:hover { background: var(--color-bg-subtle); } }
.filter-tab[aria-pressed="true"] { background: var(--color-bg-success-subtle); }
/* variant B: plain tabs on a light fill, no price line (28 px, above the 24 px target minimum) */

.offer-group { display: flex; flex-direction: column; gap: var(--space-12); }
.offer-group__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4) var(--space-8); }
.offer-group__title { display: flex; align-items: center; gap: var(--space-8); }
.offer-group__list { display: flex; flex-direction: column; gap: var(--space-12); }

/* Offer card: the whole card is one radio button; (i) sits above it */
.offer {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-12);
  padding: var(--layout-card-padding);
  background: var(--color-bg-page);
  border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg);
}
.offer.is-selected { background: var(--color-bg-success-subtle); border: 2px solid var(--color-border-success); padding: calc(var(--layout-card-padding) - 1px); }
.offer__hit { position: absolute; inset: -1px; border-radius: var(--radius-lg); z-index: 0; }
.offer__hit:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
@media (hover: hover) { .offer:not(.is-selected):not(.is-off):hover { border-color: var(--color-border-input); } }
.offer > :not(.offer__hit) { position: relative; pointer-events: none; }
.offer__info { pointer-events: auto; z-index: 1; margin: -10px; }
.offer__body { display: flex; align-items: last baseline; /* per person on the line of the last stop (user 12.11.2026; was flex-start) */ gap: var(--space-12); width: 100%; }
.offer__route { flex: 1; min-width: 0; display: flex; gap: var(--space-12); }
.rail { display: flex; flex-direction: column; align-items: center; padding: 7px 0; flex-shrink: 0; }
.rail__dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--color-icon-default); flex-shrink: 0; }
.rail__line {
  flex: 1; width: 2px; margin-top: 3px;
  background: radial-gradient(circle, var(--color-icon-muted) 0.9px, transparent 1px) top / 2px 5px repeat-y;
}
.offer__stops { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.offer__stop { display: flex; align-items: flex-start; gap: var(--space-8); }
.offer__stop > .t-body { flex: 1; min-width: 0; }
.offer__dur { height: 24px; display: flex; align-items: center; }
.offer__price { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
.offer__amount { display: flex; align-items: baseline; white-space: nowrap; }
.offer__cur { margin-left: 2px; font-size: var(--font-size-label-lg); line-height: var(--line-height-label-lg); font-weight: 600; color: var(--color-text-secondary); }
.offer__num { font-size: var(--font-size-h2); line-height: var(--line-height-h2); font-weight: 700; }
.offer__content { display: flex; flex-direction: column; gap: var(--space-8); width: 100%; }
.offer__foot { display: flex; align-items: flex-start; gap: var(--space-8); width: 100%; }
/* v2, variant 1 Cards, tags (28.10.2026): no ride time between the stops, a gap keeps the dotted line visible;
   the tag line under the route: a tag, then the text, wraps under the tag on narrow screens */
.offer__stops--short { gap: var(--space-8); }
.offer__tags { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4) var(--space-8); padding-top: 2px; }
/* on the picked card the tags keep their shape: the translucent green of the segmented track in offers-variants-v2 (6, 1+2),
   it mixes with the card's green (user 28.10.2026) */
.offer.is-selected .offer__tags .badge { background: color-mix(in srgb, var(--color-border-success) 12%, transparent); }
.offer__type { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-top: 2px; }
/* sold out: kept in the list, greyed, not selectable */
.offer.is-off { background: var(--color-bg-subtle); }
.offer.is-off .offer__body, .offer.is-off .offer__cur { color: var(--color-text-tertiary); }
.offer.is-off .rail__dot { border-color: var(--color-icon-disabled); }
.offer__hit[disabled] { cursor: default; }

/* v4, variant 9 Slider of GoOpti-offers-variants-v2.html (04.11.2026): the group heading inside the card, a slider picks the shared ride */
/* controls inside a card that is one big radio (.offer__hit) sit above the hit layer */
.offer .is-live { pointer-events: auto; position: relative; z-index: 1; }
.offer__content.vgap { gap: var(--space-12); }
.vc-head { display: flex; align-items: center; gap: var(--space-12); width: 100%; }
.vc-head > h2 { flex: 1; min-width: 0; }
.vc-title { display: flex; flex-direction: column; }
/* the slider: Fixed on the left, the window grows to the right; the track bright from the left end to the thumb */
.buffer { display: flex; flex-direction: column; gap: var(--space-4); width: 100%; }
.buffer__slider { position: relative; height: 28px; }
.buffer__track { position: absolute; left: 4px; right: 4px; top: 50%; height: 8px; transform: translateY(-50%); border-radius: var(--radius-full); background: color-mix(in srgb, var(--tone) 25%, transparent); }
.vgauge__win { position: absolute; left: 4px; top: 50%; height: 8px; transform: translateY(-50%); border-radius: var(--radius-full) 0 0 var(--radius-full); background: var(--tone); pointer-events: none; }
.buffer input[type=range] { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; }
.buffer input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--color-bg-page); border: 3px solid var(--tone); box-shadow: var(--shadow-raised); }
.buffer input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--color-bg-page); border: 3px solid var(--tone); box-shadow: var(--shadow-raised); }
.buffer input[type=range]:focus-visible { outline: 0; }
.buffer input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
/* the stop names above the slider, 10px over the track; only the text takes a click, the rest of the box would keep the thumb from dragging */
.buffer__ticks { position: relative; height: 20px; order: -1; margin-bottom: -5px; z-index: 1; pointer-events: none; }
.buffer__tick { position: absolute; top: 0; display: flex; flex-direction: column; align-items: center; transform: translateX(-50%); padding: 0; background: none; border: 0; pointer-events: none; }
.buffer__tick:first-child { align-items: flex-start; transform: none; }
.buffer__tick:last-child { align-items: flex-end; transform: translateX(-100%); }
.buffer__tick > span { pointer-events: auto; cursor: pointer; white-space: nowrap; font-size: var(--font-size-label); line-height: var(--line-height-label); font-weight: 600; color: var(--color-text-secondary); }
.buffer__tick.is-on > span { color: var(--tick-color); }

.trust-card {
  display: flex; flex-direction: column; gap: var(--space-12);
  padding: var(--layout-card-padding);
  background: var(--color-bg-subtle); border-radius: var(--radius-lg); /* grey: sand reads as a warning (16.11.2026, back from a sand try the same day) */
}

/* Add your house number (2320:29071): street with a live chip, small number field, map placeholder */
.house-row { display: flex; align-items: flex-start; gap: var(--space-12); }
.house-row__street { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-8); }
.house-row__chip { display: flex; min-width: 0; }
.house-row__number { width: 94px; flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-8); }
.house-row__number label { white-space: nowrap; }
.house-err:empty { display: none; }
.house-err { margin-top: calc(-1 * var(--space-8)); }
.house-map {
  position: relative; height: 160px; overflow: hidden; flex-shrink: 0;
  border-radius: var(--radius-lg); background: var(--color-bg-muted); /* a plate, 16 (system 10.11.2026; was 12) */
}
.house-map__park, .house-map__street { position: absolute; transform-origin: 0 0; }
.house-map__park { border-radius: 6px; background: var(--color-bg-success-subtle); }
.house-map__street { background: var(--color-bg-page); }
.house-map__pin { position: absolute; left: 152px; top: 40px; display: flex; }

.cta-bar--total { display: flex; flex-direction: column; gap: var(--space-12); }
.total-row { display: flex; align-items: center; gap: var(--space-16); }
.total-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.total-row__label { display: flex; align-items: baseline; gap: var(--space-8); }
/* Offers: the bar in one line, as on GoOpti-offers-variants-v2.html (28.10.2026) */
.cta-inline { flex-direction: row; align-items: center; gap: var(--space-16); }
.cta-inline__total { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.cta-inline__sum { display: flex; align-items: baseline; gap: var(--space-8); }
.cta-inline__sum .t-h2 { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.cta-inline__note { display: flex; flex-wrap: wrap; column-gap: var(--space-8); }
.cta-inline__note .link { white-space: nowrap; }
.cta-inline .cta-inline__btn { flex: 1 1 0; min-width: 0; width: auto; border-radius: var(--radius-md); box-shadow: none; transition: transform .12s ease-out, filter .2s ease; }
.cta-inline__btn:active, .cta-inline__btn.is-pressed { transform: scale(.98); }
/* the whole bar is two tap zones, left half — price details, right half — the button (client 02.11.2026) */
.cta-inline { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cta-inline__note .link.is-pressed { opacity: .6; }
@media (hover: hover) { .cta-inline__btn:hover { filter: brightness(1.05); } }
@media (prefers-reduced-motion: reduce) { .cta-inline__btn { transition: none; } }

/* empty result */
.empty-state { display: flex; flex-direction: column; align-items: center; gap: var(--space-8); padding: var(--space-16) var(--space-8) 0; text-align: center; }
.empty-state__icon { width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--color-bg-subtle); display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-4); }
.empty-actions { display: flex; flex-direction: column; gap: var(--space-12); }

/* loading */
.sk { display: block; height: 16px; border-radius: var(--radius-sm); background: var(--color-bg-muted); animation: pulse 1.2s ease-in-out infinite; }
.sk--w60 { width: 60%; } .sk--w40 { width: 40%; } .sk--w70 { width: 70%; height: 24px; }
.sk--tab { flex: 1; height: 44px; border-radius: var(--radius-md); }
.offer--skeleton { min-height: 140px; }
@keyframes pulse { 50% { opacity: .5; } }

/* sheet: pick-up windows on a time axis */
.window-chart { display: flex; flex-direction: column; gap: var(--space-8); padding: var(--space-16); border-radius: var(--radius-lg); background: var(--color-bg-subtle); }
.window-chart__title { display: flex; align-items: center; gap: var(--space-8); }
.window-chart__ticks { display: flex; justify-content: space-between; padding: 0 var(--space-12); }
.window-chart__rows { list-style: none; display: flex; flex-direction: column; gap: var(--space-8); }
.window-row { display: flex; flex-direction: column; gap: var(--space-8); padding: var(--space-12); border-radius: var(--radius-md); background: var(--color-bg-page); border: 1px solid var(--color-border-subtle); }
.window-row__label { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 var(--space-8); }
.window-row__price { margin-left: auto; }
.window-row__track { position: relative; height: 8px; border-radius: var(--radius-full); background: var(--color-bg-muted); }
.window-row__bar { position: absolute; top: 0; height: 8px; border-radius: var(--radius-full); background: var(--color-icon-success); }
.window-row__bar--dot { width: 8px; transform: translateX(-50%); }
.points { list-style: none; display: flex; flex-direction: column; gap: var(--space-16); }
.point { display: flex; align-items: flex-start; gap: var(--space-16); }
.point__icon { width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--color-bg-subtle); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.point__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
.note-box { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-12) var(--space-16); border-radius: var(--radius-lg); background: var(--color-bg-subtle); }

/* sheet: this offer */
.times-block { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-16); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); }
.times-block__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }
.times-block__row--times .t-caption { flex: 1; text-align: center; }
.times-block__row--price { margin-top: var(--space-8); }
/* the ride sheet (30.10.2026): the car or van and the ride time between the two times; bold lead-ins in the list */
.times-block__dur { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ride-strong { font-weight: var(--font-weight-bold); }

/* sheet: price details */
.price-lines { display: flex; flex-direction: column; gap: var(--space-12); }
.price-line { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-16); }
.price-line dt { display: flex; flex-direction: column; }
.price-line dd { white-space: nowrap; }
.price-line--total { padding-top: var(--space-12); border-top: 1px solid var(--color-border-subtle); align-items: baseline; }


/* ---------- Extras ---------- */
.page-header {
  position: sticky; top: 0; z-index: 10;
  /* the title centred, not next to Back, or it reads as the back link's name (user 02.11.2026):
     Back, the title, an empty column as wide as Back so the title sits in the screen's middle */
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: var(--space-4);
  /* 52 with the line, as the Departure / Return tabs on Offers, so the divider sits at one level on every screen (user 03.11.2026; was 57) */
  min-height: calc(52px + var(--safe-top)); padding: calc(4px + var(--safe-top)) var(--space-4) 3px;
  background: var(--color-bg-page); border-bottom: 1px solid var(--color-border-subtle);
}
.page-header > h1 { text-align: center; min-width: 0; }
.extras { display: flex; flex-direction: column; gap: var(--space-16); padding-top: var(--space-16); padding-bottom: var(--safe-bottom); }
.extras > :not(.ex-total) { margin: 0 var(--layout-page-margin); }
/* Booking details (2967:406 / 2967:596): white bar with the title, grey block 16 / 24 that folds the rides and passengers */
/* the same box as the grey summary on Offers (user 03.11.2026; was 16 / 24): 12 above and below, so one line of details makes 70 as there;
   on both sides in line with the content of the cards under it (page margin + card padding, user 03.11.2026) */
.booking-b { display: flex; flex-direction: column; padding: var(--space-12) calc(var(--layout-page-margin) + var(--layout-card-padding)) var(--space-12) calc(var(--layout-page-margin) + var(--layout-card-padding)); background: var(--color-bg-subtle); }
.booking-b__arrow { display: inline-flex; vertical-align: -1px; }
.booking-b__lines { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
/* header 2 (2964:16490): the rides one under another, 16 / 32, 4 between rides, 2 between the lines of a ride */
.booking-l { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-16) var(--layout-section-gap); background: var(--color-bg-subtle); }
.booking-l__ride { display: flex; flex-direction: column; gap: 2px; }
/* the whole grey block is the toggle (user 02.11.2026): "Booking details" 14 semibold, the route and date 14 under it, chevron on the right */
.booking-b__toggle { display: flex; align-items: flex-start; gap: var(--space-12); width: 100%; min-height: 44px; padding: 0; text-align: left; background: none; border: 0; cursor: pointer; }
/* variants page: the route is the title, no spare line under it */
.booking-b--route .booking-b__toggle { min-height: 0; }
div.booking-b__toggle { cursor: default; } /* always open (variants page, 3): not a button, no hand */
.booking-b__sum { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; } /* 2 between the lines, as a ride in header 2 */


/* cards on Extras: grey fill, no border */
.ex-card { display: flex; flex-direction: column; gap: var(--space-8); padding: var(--layout-card-padding); border-radius: var(--radius-lg); background: var(--color-bg-subtle); }

/* luggage: half open on the page (Phil 03.11.2026), all four in the sheet */
.lug__head { display: flex; flex-direction: column; gap: var(--space-4); }
.lug__more { align-self: flex-start; }
/* the terms in the sheet: 8 / 12, radius 8, on the sand of the flight card (user 03.11.2026: the yellow plate was too bright) */
.lug__terms { padding: var(--space-12) var(--space-16); border-radius: var(--radius-lg); /* a plate as the notes, 12 / 16, 16 (system 10.11.2026; was 8 / 12, 8) */ background: var(--color-bg-sand-muted); }
.lug__list { display: flex; flex-direction: column; gap: var(--space-8); }
.lug-row { display: flex; align-items: center; gap: var(--space-12); }
.lug-row > .icon { flex-shrink: 0; }
.lug-row__stepper { flex: 1; min-width: 0; min-height: 56px; display: flex; align-items: center; gap: var(--space-16); }
.lug-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lug-row__price { flex-shrink: 0; min-width: 40px; text-align: right; margin-right: calc(-1 * var(--space-4)); color: var(--neutral-500); font-weight: 400; white-space: nowrap; } /* one column, centred on the stepper (user 17.11.2026) */
.stepper--tight { gap: var(--space-4); }
.lug__divider { border: 0; border-top: 1px dashed var(--color-border-subtle); margin: 0; }


/* child seat sheet (2287:17189); on the page a row like luggage since 03.11.2026 */
.seat-list { display: flex; flex-direction: column; gap: var(--space-8); }
.seat-row { display: flex; align-items: center; gap: var(--space-8); min-height: 56px; padding: var(--space-8) 0; }
.seat-row__icon { flex-shrink: 0; width: 40px; height: 40px; }
.seat-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.seat-row .stepper { gap: var(--space-8); }
.seats-footer { display: flex; flex-direction: column; gap: var(--space-12); }
.seats-footer b { font-weight: 600; }
/* the plate sits 8 px under the consent text: cancels the checkbox padding and the footer gap (user 22.10.2026) */
/* the plate over the consent since 12.11.2026 (Map 48): the usual gap 12, no pull towards the checkbox */

/* flights: sand card (Flight verdicts - C 2567:10496). Verdict colours have no kit tokens yet, values as in Figma; the divider as the card border (user 12.11.2026, was sand #bdb9a6) */
.flights {
  --verdict-ok: var(--color-text-success); --verdict-warn: #a87000; --verdict-error: #d1220a; /* more vivid (user 17.11.2026; was #2d7339 / #946400 / #b8401c) */ --flights-divider: var(--color-border-subtle);
  gap: var(--space-12); background: var(--color-bg-sand-muted);
}
.flight-row { display: flex; flex-direction: column; gap: var(--space-12); }
.flight-add { display: flex; align-items: center; gap: var(--space-12); width: 100%; min-height: 44px; text-align: left; }
.flight-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.flight-row__title { display: flex; align-items: center; gap: 6px; }
.flight-row__title > span { min-width: 0; }
/* the divider edge to edge, as the top border of the lower part in Figma (user 12.11.2026; was inside the card padding) */
.flights .divider { width: auto; border: 0; border-top: 1px solid var(--flights-divider); margin: 0 calc(-1 * var(--layout-card-padding)); height: 0; background: none; }
.verdict { display: flex; align-items: flex-start; gap: var(--space-8); }
.verdict__icon { flex-shrink: 0; display: flex; margin-top: 1px; }
.verdict__icon .icon { color: inherit; }
.verdict__text { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-4); }
.verdict b { font-weight: 700; }
.verdict__action { min-height: 24px; font-weight: 400; margin-top: calc(-1 * var(--space-4)); } /* tight under the text (user 17.11.2026) */
/* text 16/24 and the links in the verdict's own colour (user 17.11.2026) */
.verdict { font-size: var(--font-size-body); line-height: var(--line-height-body); }
.verdict .link, .verdict .link:hover, .verdict .link:active { color: inherit; font-size: inherit; line-height: inherit; text-decoration-color: currentColor; }
.verdict--ok { color: var(--verdict-ok); }
.verdict--warn { color: var(--verdict-warn); }
.verdict--error { color: var(--verdict-error); }
.verdict--early { color: var(--color-text-primary); } /* over 3h before the flight: black, as in Anya's desktop (21.10.2026) */

.flight-field { display: flex; flex-direction: column; gap: var(--space-8); }
.flight-field .field .icon { flex-shrink: 0; }
.flight-manual { align-self: flex-start; }
.sheet--tall { min-height: min(560px, calc(100% - 24px)); }

/* No Worries */
/* No Worries details sheet (2264:126988) */
.nw-cover { list-style: none; display: flex; flex-direction: column; gap: var(--space-16); }
.nw-cover__item { display: flex; align-items: flex-start; gap: var(--space-8); }
.nw-cover__item > .icon { flex-shrink: 0; }
.nw-cover__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
.nw-terms { align-self: flex-start; }
/* No Worries as one white card (client sketch, user 03.11.2026): title and "Find out more" on top, the promise and the switch under them */
.nw { display: flex; flex-direction: column; gap: var(--space-4); padding: calc(var(--layout-card-padding) - 1px); /* minus the border: the text in line with the other cards */ border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-bg-page); }
/* with the package on the whole card turns mint with a green border, as the picked offer cards (user 03.11.2026) */
.nw:has(input:checked) { border: 2px solid var(--color-border-success); background: var(--color-bg-success-subtle); padding: calc(var(--layout-card-padding) - 2px); }
/* as an offer card (user 03.11.2026): the whole card toggles the package — the switch's checkbox covers it, "Find out more" sits above;
   hover darkens the border, picked — 2 px green border and mint (padding minus the border, the text doesn't move), focus rings the card */
.nw { position: relative; }
@media (hover: hover) { .nw:not(:has(input:checked)):hover { border-color: var(--color-border-input); } }
.nw:has(input:focus-visible) { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
.nw__more { position: relative; z-index: 1; }
.nw__more { align-self: flex-start; padding: var(--space-4) 0; margin: calc(-1 * var(--space-4)) 0; } /* under the promise, 4 above (the column gap); 28 px to tap (AA 24), not over the promise: the rest of the card toggles */
.nw__row { display: flex; align-items: stretch; gap: var(--space-12); }
.nw__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
.nw__switch { flex-shrink: 0; position: static; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: var(--space-8); cursor: pointer; } /* the price as on the offer cards over the switch (user 03.11.2026) */
.nw__switch input { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); margin: 0; opacity: 0; cursor: pointer; border-radius: var(--radius-lg); }
/* switch 44 × 24, the knob 20; off — control-off, on — the success green of No Worries */

.pay-btn { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 150px; max-width: 45%; min-height: 44px; padding: 0 var(--space-12); border-radius: var(--radius-md); transition: filter .15s; }
.pay-sec > .pay-btn, .pay-wallets > .pay-btn { width: 100%; max-width: none; min-height: var(--control-h-lg); } /* every way to pay 56, one column of equal buttons (system 10.11.2026; Revolut and Apple were 48) */

.pay-btn--light { background: var(--color-bg-page); color: var(--color-text-primary); border: 1px solid var(--color-border-strong); font-size: var(--font-size-label-lg); font-weight: var(--font-weight-semibold); }

.card-fields { display: flex; flex-direction: column; gap: var(--space-12); }

/* the bar is followed by the small print, so its own bottom padding is the plain gap */

/* small print 11 / 16, below the kit's smallest size (user 02.11.2026), icon 14 in the first line */

.route-top .offers-header { min-height: 56px; padding-right: var(--space-4); }
.search-summary--center { padding: var(--space-8) var(--space-4); justify-content: center; text-align: center; }

.route-top__route { font-size: var(--font-size-label-lg); line-height: 20px; font-weight: 600; text-wrap: balance; }

.page-title { padding: var(--space-16) var(--layout-page-margin) var(--space-4); }
.details__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); padding-right: var(--layout-page-margin); }

.details__head .account__login { height: auto; min-height: 44px; padding: 0; border: 0; background: none; border-radius: 0; gap: 4px; color: var(--neutral-500); font-weight: 400; font-size: var(--font-size-body); line-height: var(--line-height-body); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--neutral-300); }
.details__head .account__login::after { inset: 0 -4px; }
.details__head .account__login svg, .details__head .account__login .icon { width: 16px; height: 16px; }
.details__head .account__login .icon { color: currentColor; }
@media (hover: hover) { .details__head .account__login:hover { background: none; color: var(--color-text-primary); text-decoration-color: currentColor; } }
.details__head .account__login:active { background: none; }
/* Departure / Return: Anya's segmented switch without the inset around the active segment (3253:25): a grey track 40 high,
   radius 12, the leg's date 12 next to its name; 8 above and below. Dynamic as variant 6 of GoOpti-offers-variants-v2.html
   (user 09.11.2026): the black thumb slides under the labels (--i: 0 Departure, 1 Return); the other leg's hover fill
   runs under the thumb by its radius, square on that side, so the track never shows between the fill and the thumb */
.leg-tabs { position: relative; display: flex; margin: var(--space-8) var(--layout-page-margin); padding: 0; border-radius: var(--radius-md); background: var(--color-bg-subtle); --n: 2; }
.leg-tabs__thumb { position: absolute; top: 0; bottom: 0; z-index: 1; width: calc(100% / var(--n)); left: calc(var(--i) * 100% / var(--n));
  border-radius: var(--radius-md); background: var(--color-bg-inverse); pointer-events: none; transition: left 200ms cubic-bezier(0.2, 0, 0, 1); }
.leg-tab { position: relative; flex: 1; min-width: 0; min-height: 40px; padding: 0 var(--space-8); flex-direction: row; align-items: center; justify-content: center; gap: var(--space-12);
  border-radius: var(--radius-md); color: var(--color-text-primary); font-size: var(--font-size-body-sm); line-height: 20px; transition: color 200ms; }
.leg-tab::after, .leg-tab[aria-selected="true"]::after { content: none; }
.leg-tab > span { position: relative; z-index: 2; }
.leg-tab[aria-selected="true"] { gap: var(--space-12); color: var(--color-text-inverse); }
.leg-tab__date { font-size: var(--font-size-body-sm); line-height: 20px; font-weight: 400; /* the size of Departure / Return, regular (user 09.11.2026; was 12 semibold) */ color: var(--color-text-secondary); white-space: nowrap; transition: color 200ms; }
.leg-tab[aria-selected="true"] .leg-tab__date { color: inherit; }
.leg-tab:focus-visible { outline-offset: 2px; z-index: 3; }
@media (hover: hover) {
  .leg-tab:not([aria-selected="true"]):hover::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 0; border-radius: var(--radius-md); background: var(--neutral-200); }
  .leg-tab.is-after:not([aria-selected="true"]):hover::before { left: -12px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .leg-tab.is-before:not([aria-selected="true"]):hover::before { right: -12px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
}

/* the cards 8 under the switch (or 12 under the title); 16 between the Offers sections (user 09.11.2026 in Figma 3249:10362; was the block gap 24) */
.offers-main { gap: var(--space-16); }
.offers-main, .extras { padding-top: var(--space-8); } /* Details keeps 16 under its own header (no route header since 10.11.2026) */

.refund { flex-direction: column; align-items: stretch; gap: var(--space-4); }
.refund__top, .refund__bottom { display: flex; gap: var(--space-12); }
.refund__top { align-items: flex-end; justify-content: space-between; }
.refund__bottom { align-items: center; }

@media (hover: hover) { .flight-add:hover .add-circle { background: var(--color-bg-muted); } }
/* Details: the login buttons white with a thin border, radius 12, the icon left of the name */
.details .account__row .btn--social { background: var(--color-bg-page); border-color: var(--color-border-strong); /* the outline of the payment buttons (user 10.11.2026; was border-subtle) */ border-radius: var(--radius-md); min-height: var(--control-h-md); }

.pax-card > .account .account__title { padding: var(--space-8) 0; }

.details .pay-btn { border-radius: var(--radius-md); }

.vc-head .link { font-weight: 400; }

/* Details, approved Mobile 11.11.2026 (3323:24597): "+ Add more passengers" on the left between the names and the email,
   16 to both (12 contact gap + 4: the 44 target pulled in to a 28 box); "Already have an account? Log in here" centred,
   24 under the phone, the link semibold underlined; its target grows to 44 into the empty space around */
.details .contact > .others--start { justify-content: flex-start; }
/* other passengers and invoice as two checkboxes under the phone, 12 apart (user 17.11.2026) */
.details-checks { display: flex; flex-direction: column; gap: 0; padding-top: var(--space-4); } /* the 44 tap rows touch, no extra gap (user 17.11.2026; was 12) */
.details-checks .checkbox { min-height: 36px; padding: var(--space-4) 0; }
/* black boxes: outline unticked, filled ticked (user 17.11.2026) */

.details-checks .checkbox:has([data-invoice]:not(:checked)) .t-body, .details-checks .checkbox:has([data-others]:not(:checked)) .t-body { color: var(--neutral-500); }

.login-line { text-align: center; color: var(--color-text-primary); }

/* Home form, approved Mobile 11.11.2026 (3323:20723 one way, 3323:20857 return, 3323:20995 steppers open): every row 56,
   label 12/16 regular grey (text-tertiary) over the value 16/24, 8 / 16 inside; the date halves equal without a return date;
   "+ Add return trip" centred in its half; passengers as a row with a chevron */
.hero .booking__cell .booking__label { font-weight: 400; font-size: var(--font-size-label-sm); line-height: 16px; color: var(--color-text-tertiary); }

.hero .booking__row.booking__row--ret > .booking__cell.home-ret { padding-right: var(--space-12); align-items: flex-end; }

/* the login dialog's small print in the font of the payment notes on Details, no icon, centred (user 11.11.2026) */
.auth__legal { font-size: var(--font-size-caption); line-height: var(--line-height-caption); text-align: left; }
/* the cross: 40 × 40 to tap (user 11.11.2026), the 16 icon stays where it was — 8 after the date, 12 to the cell edge:

.hero .home-ret__clear { width: 40px; height: 40px; border-radius: 20px; margin: -8px -12px -8px -8px; }
/* the unit after a slash as a muted user icon (offers variants page 26.10.2026; No Worries, client 11.11.2026) */

.vper { display: inline-flex; align-items: baseline; align-self: baseline; gap: 1px; margin-left: 2px; font-size: var(--font-size-label-lg); line-height: var(--line-height-label-lg); font-weight: 400; color: var(--neutral-400); }

<body>
<div id="app"></div>
<div id="layer"></div>
<noscript>This prototype needs JavaScript.</noscript>
<script>
// Phone frame for desktop viewing. On a computer the page draws a 390×844 phone (the size of the client prototype) and loads itself inside it
// in an iframe, so the app keeps its own scroll, fixed bars, sheets and history. Phones get the bare page.
// ?frame=0 opens the bare page on a computer too.
window.GO = window.GO || {};
(function () {
  const NAME = 'go-phone';
  const params = new URLSearchParams(location.search);

  // Outer page: the phone on a plain background
  const wantsFrame = window.top === window && params.get('frame') !== '0' &&
    matchMedia('(hover: hover) and (pointer: fine) and (min-width: 600px)').matches;
  if (wantsFrame) {
    GO.frame = 'outer';
    document.body.innerHTML = '<div class="stage"><div class="stage__phone"><iframe name="' + NAME + '" title="GoOpti booking prototype"></iframe></div></div>';
    const phone = document.querySelector('.stage__phone');
    const iframe = phone.querySelector('iframe');
    iframe.src = location.href;
    // Shrink the phone on short windows instead of cropping it
    const fit = () => {
      const s = Math.min(1, (innerHeight - 48) / 844, (innerWidth - 32) / 390);
      phone.style.transform = s < 1 ? 'scale(' + s + ')' : '';
    };
    addEventListener('resize', fit); fit();
    // The address bar follows the screen inside, so a reload or a copied link opens the same step
    addEventListener('message', ev => {
      if (ev.source === iframe.contentWindow && ev.data && typeof ev.data.goHash === 'string') {
        history.replaceState(null, '', location.pathname + location.search + ev.data.goHash);
      }
    });
    return;
  }

  // the scenarios menu (on the logo) works framed and unframed; the status bar, keyboard and the rest only inside the frame
  const framed = !(window.name !== NAME || window.top === window);
  let bar = null;
  if (framed) {

  // Inside the frame: fake status bar (no home indicator, as in the client prototype)
  GO.frame = 'inner';
  document.documentElement.classList.add('is-framed');
  bar = document.createElement('div');
  bar.className = 'device-bar';
  bar.setAttribute('aria-hidden', 'true');
  bar.innerHTML =
    '<span class="device-bar__time">9:41</span><span class="device-bar__island"></span>' +
    '<span class="device-bar__icons">' +
      '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>' +
      '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.2 0 4.2.8 5.7 2.2l1.2-1.3A10.1 10.1 0 0 0 8 .8C5.3.8 2.9 1.8 1.1 3.5l1.2 1.3A8.3 8.3 0 0 1 8 2.6Zm0 3.6c1.2 0 2.3.4 3.2 1.2l1.2-1.3A6.6 6.6 0 0 0 8 4.4c-1.7 0-3.2.6-4.4 1.7l1.2 1.3c.9-.8 2-1.2 3.2-1.2Zm0 3.5c-.5 0-1 .2-1.3.5L8 11.6l1.3-1.4c-.3-.3-.8-.5-1.3-.5Z"/></svg>' +
      '<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4"/></svg>' +
    '</span>';
  document.body.append(bar);
  }
  // System menu on the time (user 22.10.2026, was a secret reset 21.10): a TEST DATA–style list with Back, Reset and ready rides.
  // A ride wipes the booking, fills the search and opens the offers.
  // frame.js loads before data.js, so the places are looked up on click
  const place = id => GO.DATA.places.find(p => p.id === id);
  const home = () => ({ from: place('lj-slovenska'), to: place('VCE') });
  const RIDES = [
    // city to city (user 23.10.2026, was an evening flight to Venice): Ljubljana → Maribor railway station, drop-off by 10:00
    { label: 'Ride 1', note: 'Fri 27 Nov, Ljubljana → Maribor station by 10:00, 1 adult', patch: () => ({
      from: place('lj-slovenska'), to: place('mb-rail'), date: '2026-11-27', time: '10:00', timeMode: 'dropoff' }) },
    // family holiday for two weeks, morning flight; back on Sun 13 Dec (a month later than at first: on 30.10.2026 the rides of 30 Oct fell into the no-rides window). v2 has no flight time (28.10.2026):
    // drop-off 06:15 (flight 08:15), pick-up 16:15 (landing 15:30 + 45m)
    { label: 'Ride 2', note: '27 Nov – 13 Dec, 2 adults, 3 children, drop-off 06:15', patch: () => Object.assign(home(), {
      date: '2026-11-27', time: '06:15', timeMode: 'dropoff',
      adults: 2, children: 3,
      retDate: '2026-12-13', retTime: '16:15', retTimeMode: 'dropoff', retLanding: false }) },
    // no rides: today, drop-off in 4 hours, so the pick-up falls inside the 8 hours we need to plan a ride (user 22.10.2026)
    { label: 'Ride 3', note: 'no rides: today, drop-off in 4h, 1 adult', patch: () => {
      const now = new Date(), at = Math.ceil((now.getHours() * 60 + now.getMinutes() + 240) / 15) * 15;
      const date = at >= 1440 ? GO.u.addDays(GO.u.today(), 1) : GO.u.today(), time = GO.u.fromMin(at);
      return Object.assign(home(), { date, time, timeMode: 'dropoff' });
    } },
    // sold out (user 10.11.2026): the cheapest window, 3 hours, is gone, the slider ends at 2h flex. Random sold out is off,
    // the scenario stays on the searches of this ride until Reset or another ride
    { label: 'Ride 4', note: 'sold out 3h: Fri 27 Nov, Ljubljana → Venice by 10:15, 1 adult', patch: () => Object.assign(home(), {
      date: '2026-11-27', time: '10:15', timeMode: 'dropoff', offersScenario: 'soldout' }) },
    // all booked (user 10.11.2026; was random on 1 search in 13): "No rides at this time" with an earlier and a later ride
    { label: 'Ride 5', note: 'all booked: Fri 27 Nov, Ljubljana → Venice by 10:15, 1 adult', patch: () => Object.assign(home(), {
      date: '2026-11-27', time: '10:15', timeMode: 'dropoff', offersScenario: 'empty' }) },
  ];
  // the Extras / Baggage variants left the menu in v5 (user 05.11.2026): Add-ons follows the approved design only
  // 100% money refund on Offers (user 06.11.2026): 1 - its own card after Private, 2 - at the bottom of the Private card
  const REFUNDS = [[1, 'own card after Private'], [2, 'inside the Private card']];
  const refundItems = () => REFUNDS.map(([n, note]) => ({ label: (GO.offersRefund() === n ? '✓ ' : '') + 'Refund ' + n, note, run() {
    try { localStorage.setItem('go.refundVariant', n); } catch (e) { /* private mode: the session keeps the default */ }
    GO.router.refresh();
  } }));
  const ITEMS = () => [
    { label: 'Back', run: () => GO.router.back() },
    { label: 'Reset', note: 'empty booking, home', run: () => { GO.store.reset(); location.replace(location.pathname + location.search); } },
  ].concat(refundItems(), RIDES.map(r => ({ label: r.label, note: r.note, run() {
    GO.store.reset();
    GO.store.set(r.patch());
    history.replaceState({ depth: 0 }, '', location.pathname + location.search + '#/offers');
    location.reload();
  } })));

  let menu = null;
  function closeMenu() { if (menu) { menu.remove(); menu = null; } }
  function openMenu(e, anchor) {
    e.stopPropagation();
    if (menu) return closeMenu();
    menu = document.createElement('div');
    menu.className = 'td td--menu';
    if (anchor) { const r = anchor.getBoundingClientRect(); menu.style.top = (r.bottom + 4) + 'px'; menu.style.left = Math.max(8, r.left) + 'px'; }
    const items = ITEMS();
    menu.innerHTML = '<div class="td__head">SYSTEM</div>' + items.map((o, i) =>
      '<button type="button" class="td__opt" data-sys="' + i + '">' + GO.u.esc(o.label) + (o.note ? ' <span class="td__note">— ' + GO.u.esc(o.note) + '</span>' : '') + '</button>').join('');
    menu.addEventListener('click', ev => { const b = ev.target.closest('[data-sys]'); if (b) { closeMenu(); items[+b.dataset.sys].run(); } });
    document.body.append(menu);
  }
  if (bar) bar.querySelector('.device-bar__time').addEventListener('click', e => openMenu(e));
  // the same scenarios drop down from the GoOpti logo on every screen (user 17.11.2026); the logo no longer goes home, Reset does
  document.addEventListener('click', e => {
    const logo = e.target.closest('.topbar__logo');
    if (!logo) return;
    e.preventDefault();
    openMenu(e, logo);
  }, true);
  document.addEventListener('click', e => { if (menu && !menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  addEventListener('hashchange', closeMenu);
  if (!framed) return;

  // Phone keyboard (user 22.10.2026): the prototype is shown on a computer only, so a picture of the keyboard (Figma 1995:19284)
  // slides up while a text field has the focus, and the screen above it gets shorter, as on a phone. Letters still come from
  // the computer keyboard; a tap on return works as Enter, the rest of the picture keeps the focus in the field.
  const KB_W = 375, KB_H = 280, KB_RETURN = { x0: 285, x1: 372, y0: 163, y1: 205 }; // picture px, as in the frame
  const typing = el => el && ((el.tagName === 'INPUT' && /^(text|email|tel|search|number|password|url)$/.test(el.type)) || el.tagName === 'TEXTAREA') &&
    !el.disabled && !el.readOnly;
  const kb = document.createElement('div');
  kb.className = 'device-kb';
  kb.setAttribute('aria-hidden', 'true');
  kb.hidden = true;
  document.body.append(kb);
  function kbShow(el) {
    if (!kb.firstChild) kb.innerHTML = '<img src="' + GO.IMG_KEYBOARD + '" alt="">'; // assets.js loads after this file
    const h = Math.round(innerWidth * KB_H / KB_W);
    document.documentElement.style.setProperty('--kb', h + 'px');
    document.documentElement.classList.add('has-kb');
    kb.hidden = false;
    // the field stays in view above the keys
    requestAnimationFrame(() => { const r = el.getBoundingClientRect(); if (r.bottom > innerHeight - h - 8) el.scrollIntoView({ block: 'center' }); });
  }
  function kbHide() { kb.hidden = true; document.documentElement.classList.remove('has-kb'); }
  document.addEventListener('focusin', e => { if (typing(e.target)) kbShow(e.target); });
  // A tap on a list item takes the focus on press: hiding the keys right then would stretch the screen under the pointer,
  // and the release would land elsewhere with no click (Vienna on Where to, user 22.10.2026). So while the pointer is down
  // the keys stay, and go after the click.
  let pressed = false;
  const kbCheck = () => { if (!typing(document.activeElement)) kbHide(); };
  document.addEventListener('pointerdown', () => { pressed = true; }, true);

<script>
window.GO = window.GO || {};

GO.u = (function () {
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Dates are kept as 'YYYY-MM-DD' strings in state, times as 'HH:MM'.
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function addDays(isoStr, n) { const d = parseIso(isoStr); d.setDate(d.getDate() + n); return iso(d); }

  // "Thu 15 Oct" — no comma inside the date (copy rule)
  function fmtDay(isoStr) { const d = parseIso(isoStr); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function monthTitle(y, m) { return MONTH[m] + ' ' + y; }

  function toMin(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
  // Times on the service side go in quarters: a driver comes at 09:15, not at 09:05 (Phil 23.10.2026)
  function up15(min) { return Math.ceil(min / 15) * 15; }
  function down15(min) { return Math.floor(min / 15) * 15; }
  function fromMin(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }

  // "2h 45m", "3h", "45m" (copy rule: no space after the number)
  function fmtDur(min) {
    const h = Math.floor(min / 60), m = min % 60;
    return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m ? m + 'm' : '') || '0m';
  }

  // "Today" for the prototype: ?today=2026-10-14 pins the date for screenshots; kept for the session.
  function today() {
    if (window.GO_SEED && GO_SEED.today) return GO_SEED.today;
    const p = new URLSearchParams(location.search).get('today');
    if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) { try { sessionStorage.setItem('go.today', p); } catch (e) {} return p; }
    try { const s = sessionStorage.getItem('go.today'); if (s) return s; } catch (e) {}
    return iso(new Date());
  }

  let toastTimer = null;
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast'; el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('is-on'), 2200);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // Bold the matched part of a string (search suggestions)
  function highlight(text, q) {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + q.length)) + '</b>' + esc(text.slice(i + q.length));
  }

  // Night rides (client 12.11.2026, "crazy hours around midnight"): 00:00–04:59 belongs to the night before the date,
  // the easy mistake is a ride on Fri 00:30 booked for the night from Friday to Saturday. Only the yellow plate on the date and time screen
  // says so: no moon after the time anywhere (Anya 16.11.2026)
  function night(hhmm) { return !!hhmm && toMin(hhmm) < 300; }

  return { night, esc, iso, parseIso, pad, addDays, fmtDay, monthTitle, toMin, fromMin, up15, down15, fmtDur, today, toast, sleep, highlight, MONTH };
})();


// The address of the screen: the real hash, or in a phone of a variants page (variants-host.js) the iframe's own history, which has no address
GO.hash = function () { return window.GO_VH ? GO_VH.hash : location.hash; };

// v6 (Mobile 09.11.2026, section new 3249:10332, user 09.11.2026): the grey route header on top of Offers, Add-ons and Details,
// as Anya's, without her step progress bar: Back, the route label-lg, the meta line (dates, passengers) in secondary, the pencil.

GO.routeHead = function (route, meta, editLabel) {
