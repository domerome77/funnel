            '<button class="btn btn--primary" data-act="send-code"><span class="btn__label">Send me a code</span></button>' +
          '</div>' +
          legal +
        '</form>';
    },
    mount(root) {
      const form = root.querySelector('[data-login-form]');
      const input = form.querySelector('#login-email');
      const box = input.closest('.field');
      form.addEventListener('submit', ev => { ev.preventDefault(); emailScreen.actions['send-code'](); });
      
      // the error shows on leaving the field or on Continue, goes away as soon as the email is fine
      input.addEventListener('input', () => { if (loginErr && !emailError(input.value.trim())) { loginErr = ''; setFieldError(box, input, ''); } });
      input.addEventListener('focusout', () => { const v = input.value.trim(); if (v) { loginErr = emailError(v); setFieldError(box, input, loginErr); } });
      // no autofocus: the TEST DATA panel under the field would cover Continue
    },
    actions: {
      close: () => GO.router.back(),
      terms: () => u.toast('Terms open in a new tab on the real site'),
      async 'send-code'() {
        const input = document.getElementById('login-email');
        const btn = document.querySelector('[data-act=send-code]');
        if (!input || btn.disabled) return;
        const v = input.value.trim();
        loginErr = emailError(v);
        setFieldError(input.closest('.field'), input, loginErr);
        if (loginErr) { input.focus(); return; }
        busy(btn, 'Sending the code…');
        await u.sleep(700);
        loginEmail = v; codeErr = ''; codeScreen.sent = false; resendLeft = 0;
        GO.router.go(route('code'), { replace: true });
      },
    },
  };

  // Code step: OTP_LEN cells, one digit each; typing moves on, Backspace goes back, a pasted code (or TEST DATA) fills all cells.
  // The last digit checks the code right away.
  const code = () => [...document.querySelectorAll('.otp__cell')].map(c => c.value).join('');
  function setCodeErr(msg) {
    codeErr = msg;
    const box = document.querySelector('.otp');
    if (box) setFieldError(box, document.getElementById('login-code'), msg);
  }
  const codeScreen = {
    overlay: true, base: area, sheetClass: 'sheet--dialog',
    render() {
      const cells = [...Array(OTP_LEN).keys()].map(i => '<input class="otp__cell" id="' + (i ? 'login-code-' + i : 'login-code') + '" inputmode="numeric" maxlength="' + OTP_LEN + '" aria-label="Digit ' + (i + 1) + '"' +
        (i ? ' autocomplete="off"' : ' autocomplete="one-time-code"') + '>').join('');
      return closeBtn +
        '<form class="auth" data-code-form novalidate>' +
          '<h2 id="sheet-title" class="t-h1">Check your inbox</h2>' +
          '<p class="t-body c-secondary">We sent a ' + OTP_LEN + '-digit code to <span class="nowrap">' + esc(loginEmail) + '</span>. ' +
            '<button type="button" class="link link--inline" data-act="change-email">Change</button></p>' +
          '<div class="auth__form">' +
            '<div class="otp-wrap"><div class="otp" role="group" aria-label="' + OTP_LEN + '-digit code">' + cells + '</div></div>' +
            '<button class="btn btn--primary" data-act="verify"><span class="btn__label">Log in</span></button>' +
            // a new code only after 30 s (Passenger Step 8, user 17.11.2026)
            '<p class="t-body-sm c-secondary auth__resend" aria-live="polite"><span data-resend>' + resendLabel() + '</span> <button type="button" class="link link--inline" data-act="resend"' + (resendLeft > 0 ? ' hidden' : '') + '>Resend code</button></p>' +
          '</div>' +
        '</form>';
    },
    mount(root) {
      // opened by a link or after a reload: the email step was not passed in this tab
      if (!loginEmail) { GO.router.go(route('signin'), { replace: true }); return; }
      const form = root.querySelector('[data-code-form]');
      const cells = [...form.querySelectorAll('.otp__cell')];
      form.addEventListener('submit', ev => { ev.preventDefault(); codeScreen.actions.verify(); });
      cells.forEach((c, i) => {
        c.addEventListener('input', () => {
          const d = c.value.replace(/\D/g, '');
          if (codeErr) setCodeErr('');
          if (d.length > 1) d.slice(0, OTP_LEN - i).split('').forEach((x, j) => { cells[i + j].value = x; });
          else c.value = d;
          const next = cells.find((x, j) => j > i && !x.value) || (d ? cells[Math.min(i + d.length, OTP_LEN - 1)] : c);
          next.focus();
          if (code().length === OTP_LEN) codeScreen.actions.verify();
        });
        c.addEventListener('keydown', e => {
          if (e.key === 'Backspace' && !c.value && i > 0) { cells[i - 1].value = ''; cells[i - 1].focus(); e.preventDefault(); }
          else if (e.key === 'ArrowLeft' && i > 0) cells[i - 1].focus();
          else if (e.key === 'ArrowRight' && i < OTP_LEN - 1) cells[i + 1].focus();
        });
        c.addEventListener('focus', () => c.select());
      });
      setTimeout(() => cells[0].focus({ preventScroll: true }), 50);
      if (resendLeft === 0 && !codeScreen.sent) startResend();
      codeScreen.sent = true;
    },
    actions: {
      close: () => GO.router.back(),
      'change-email': () => GO.router.go(route('signin'), { replace: true }),
      resend() {
        document.querySelectorAll('.otp__cell').forEach(c => { c.value = ''; });
        setCodeErr('');
        document.getElementById('login-code').focus();
        startResend();
        u.toast('We sent a new code to ' + loginEmail);
      },
      async verify() {
        const btn = document.querySelector('[data-act=verify]');
        if (!btn || btn.disabled) return;
        const d = code();
        setCodeErr(d.length < OTP_LEN ? 'Enter the ' + OTP_LEN + '-digit code' : d === '0'.repeat(OTP_LEN) ? 'Wrong code. Check it or get a new one.' : '');
        if (codeErr) { const cells = [...document.querySelectorAll('.otp__cell')]; (cells.find(c => !c.value) || cells[OTP_LEN - 1]).focus(); return; }
        busy(btn, 'Checking the code…');
        await u.sleep(700);
        const email = loginEmail, a = known(email);
        loginEmail = ''; stopResend();
        // linked to a company: who is this booking for (Anya's desktop)
        if (a && a.company) { pending = a; return GO.router.go(route('choose'), { replace: true }); }
        // Passenger Step 8 (user 17.11.2026): a full account logs in, a new one or one without a phone finishes in the profile step
        if (a && a.phone) return finish(a, a.email);
        prof = makeProf(a, email, false);
        GO.router.go(route('profile'), { replace: true });
      },
    },
  };

  let resendLeft = 0, resendId = 0;
  const resendLabel = () => resendLeft > 0 ? 'Didn’t get it? Resend in ' + resendLeft + 's' : 'Didn’t get it?';
  function stopResend() { clearInterval(resendId); resendLeft = 0; }
  function startResend() {
    clearInterval(resendId); resendLeft = 30;
    const paint = () => {
      const l = document.querySelector('[data-resend]'), b = document.querySelector('[data-act=resend]');
      if (!l) { clearInterval(resendId); return; }
      l.textContent = resendLabel(); if (b) b.hidden = resendLeft > 0;
    };
    paint();
    resendId = setInterval(() => { resendLeft = Math.max(0, resendLeft - 1); paint(); if (!resendLeft) clearInterval(resendId); }, 1000);
  }

  // ---------- profile step (GoOpti Passenger Step 8, user 17.11.2026) ----------
  // after the code or Google: a new account adds name, surname and phone once ("Finish your account" → Create account);
  // an account missing a phone checks its details ("Check your details" → Save and continue). The email is confirmed on top.
  let prof = null, profErr = '';
  function makeProf(a, email, google) {
    const c = contact();
    return { a, email, google, isNew: !a || google,
      first: (a && a.first) || c.first || '', last: (a && a.last) || c.last || '', cc: (a && a.cc) || c.cc,
      phone: a ? (a.phone || '') : '' }; // the phone always typed in the profile, never carried over (user 17.11.2026)
  }
  GO.openProfile = (a, email, google) => { prof = makeProf(a, email, google); profErr = ''; GO.router.go(route('profile')); };
  const profileScreen = {
    overlay: true, base: area, sheetClass: 'sheet--dialog',
    render() {
      if (!prof) return closeBtn;
      const p = prof, cur = country(p.cc);
      const title = p.isNew ? 'Finish your account' : 'Check your details';
      const sub = !p.isNew ? 'We’re missing some details on your account. Fill them in and check the rest.'
        : p.google ? 'We got your name from Google. Add your phone and check the rest.' : 'Add your details once – we’ll fill them in for every booking.';
      const inp = (key, label, ac) => '<label class="sr-only" for="p-' + key + '">' + label + '</label><input id="p-' + key + '" name="' + key + '" placeholder="' + label + '" value="' + esc(p[key]) + '" autocomplete="' + ac + '" autocapitalize="words" enterkeyhint="next">';
      return closeBtn +
        '<form class="auth" data-profile-form novalidate>' +
          '<h2 id="sheet-title" class="t-h1">' + title + '</h2>' +
          '<p class="t-body c-secondary">' + sub + '</p>' +
          '<div class="auth__form">' +
            '<p class="auth__confirmed t-body-sm">' + ic('check', 16) + '<span><b>' + esc(p.email) + '</b> confirmed</span></p>' +
            '<div class="form-field"><div class="field field--names">' + inp('first', 'First name', 'given-name') + '<span class="field__divider" aria-hidden="true"></span>' + inp('last', 'Last name', 'family-name') + '</div></div>' +
            '<div class="form-field"><div class="field field--phone">' +
              '<span class="phone-cc"><span class="phone-cc__flag" data-pflag>' + GO.FLAGS[cur[0]] + '</span>' + ic('chevron-down', 16) +
                '<select id="p-cc" name="cc" aria-label="Country code">' + COUNTRIES.map(k => '<option value="' + k[0] + '"' + (k[0] === cur[0] ? ' selected' : '') + '>' + esc(k[1]) + ' +' + k[2] + '</option>').join('') + '</select></span>' +
              '<span class="phone-cc__code t-body" aria-hidden="true" data-pcode>+' + cur[2] + '</span>' +
              '<label class="sr-only" for="p-phone">Mobile number</label><input id="p-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" enterkeyhint="done" placeholder="41 234 567" value="' + esc(p.phone) + '">' +
            '</div></div>' +
            
            '<button class="btn btn--primary" data-act="save-profile"><span class="btn__label">' + (p.isNew ? 'Create account' : 'Save and continue') + '</span></button>' +
          '</div>' +
        '</form>';
    },
    mount(root) {
      if (!prof) { GO.router.go(route('signin'), { replace: true }); return; }
      const form = root.querySelector('[data-profile-form]');
      form.addEventListener('submit', ev => { ev.preventDefault(); profileScreen.actions['save-profile'](); });
      form.addEventListener('input', ev => { if (ev.target.name) prof[ev.target.name] = ev.target.value; });
      form.addEventListener('change', ev => {
        if (ev.target.name !== 'cc') return;
        prof.cc = ev.target.value;
        form.querySelector('[data-pflag]').innerHTML = GO.FLAGS[prof.cc];
        form.querySelector('[data-pcode]').textContent = '+' + country(prof.cc)[2];
      });
      const first = ['first', 'last', 'phone'].find(k => !(prof[k] || '').trim());
      if (first) setTimeout(() => { const el = document.getElementById('p-' + first); if (el) el.focus({ preventScroll: true }); }, 50);
    },
    actions: {
      close() { prof = null; GO.router.back(); },
      'save-profile'() {
        const p = prof;
        if (!p) return;
        const missing = ['first', 'last', 'phone'].filter(k => !(p[k] || '').trim());
        const form = document.querySelector('[data-profile-form]');
        let p0 = form && form.querySelector('[data-prof-err]');
        if (missing.length) {
          profErr = 'Please fill in all required fields.';
          if (form && !p0) { p0 = document.createElement('p'); p0.className = 't-body-sm field-error'; p0.setAttribute('role', 'alert'); p0.dataset.profErr = ''; form.querySelector('[data-act=save-profile]').before(p0); }
          if (p0) p0.textContent = profErr;
          ['first', 'last', 'phone'].forEach(k => { const el = document.getElementById('p-' + k); if (el) el.closest('.field').classList.toggle('field--error', missing.some(m => (k === 'phone') === (m === 'phone'))); });
          const el = document.getElementById('p-' + missing[0]); if (el) el.focus();
          return;
        }
        const name = p.first.trim() + ' ' + p.last.trim();
        setContact({ account: { name, email: p.email, created: p.isNew, cards: (p.a && p.a.cards) || [] },
          first: p.first.trim(), last: p.last.trim(), email: p.email, cc: p.cc, phone: p.phone.trim() });
        ['first', 'last', 'email', 'phone'].forEach(k => delete errors[k]);
        prof = null; profErr = '';
        GO.router.back();
        if (fromHome()) u.toast(p.isNew ? 'Your account is ready' : 'Logged in as ' + name);
      },
    },
  };

  function finish(a, email, asCompany) {
    signIn(a, email, asCompany);
    GO.router.back();
    if (fromHome()) return u.toast(a ? 'Logged in as ' + a.name : 'Your account is ready');
    if (!a) focusEmpty();
  }

  // Log in as (Anya's desktop 22.10.2026): an account linked to a company picks who the booking is for.
  // After the code it replaces the code step; on Details "Switch account" opens it again.
  const chooseScreen = {
    overlay: true, base: area, sheetClass: 'sheet--dialog',
    render() {
      const a = pending || COMPANY_ACCOUNT;
      const opt = (act, icon, name, detail) => '<li><button class="place-option auth__acc" data-act="as" data-as="' + act + '">' +
        '<span class="place-option__icon" aria-hidden="true">' + ic(icon, 20) + '</span>' +
        '<span class="place-option__text"><span class="place-option__name">' + esc(name) + '</span><span class="place-option__detail">' + detail + '</span></span>' +
        ic('chevron-right', 20) + '</button></li>';
      return closeBtn +
        '<div class="auth">' +
          '<h2 id="sheet-title" class="t-h1">Log in as</h2>' +
          '<p class="t-body c-secondary">Your account is linked to a company.<br>Who is this booking for?</p>' +
          '<ul class="place-list auth__form" aria-label="Accounts">' +
            opt('private', 'user', a.name, 'Private person') + opt('company', 'company', a.company, 'Company account') +
          '</ul>' +
        '</div>';
    },
    actions: {
      close() { pending = null; GO.router.back(); },
      as(el) {
        const a = pending || COMPANY_ACCOUNT;
        pending = null;
        finish(a, a.email, el.dataset.as === 'company');
        if (!fromHome()) GO.router.refresh();
      },
    },
  };

  GO.screens['details-signin'] = GO.screens['login-signin'] = GO.screens['booked-signin'] = emailScreen;
  GO.screens['details-choose'] = GO.screens['login-choose'] = GO.screens['booked-choose'] = chooseScreen;
  GO.screens['details-code'] = GO.screens['login-code'] = GO.screens['booked-code'] = codeScreen;
  GO.screens['details-profile'] = GO.screens['login-profile'] = GO.screens['booked-profile'] = profileScreen;

  // ---------- sheet: other passengers (Flow 13 - Details - 3 adults - sheet - Other passengers, 2308:18992 / 2308:128602) ----------
  // Numbered by type, the contact person is Adult 1: "Adult 2", "Child 1". Adults: name, email, phone; children: name only (our call,
  // the layout shows adults only). Save is active once every name is filled; email and phone are optional, a typed email must be valid.
  function others(s) {
    const list = [];
    for (let i = 2; i <= s.adults; i++) list.push({ id: 'a' + i, label: 'Adult ' + i, child: false });
    for (let i = 1; i <= s.children; i++) list.push({ id: 'c' + i, label: 'Child ' + i, child: true });
    return list;
  }
  const PAX_EMPTY = { first: '', last: '', email: '', cc: 'si', phone: '' };
  const named = p => !!(p && p.first.trim() && p.last.trim());
  function othersDone(s) { const saved = s.passengers || {}; return others(s).every(o => named(saved[o.id])); }

  let draft = {};
  let paxErr = {};
  function paxForm(o) {
    const p = draft[o.id], id = k => 'p-' + o.id + '-' + k;
    const err = k => paxErr[o.id + k] ? '<p id="' + id(k) + '-err" class="t-body-sm field-error">' + esc(paxErr[o.id + k]) + '</p>' : '';
    const inp = (k, label, attrs, ph) => '<label class="sr-only" for="' + id(k) + '">' + o.label + ', ' + label.toLowerCase() + '</label>' +
      '<input id="' + id(k) + '" data-pax="' + o.id + '" name="' + k + '" placeholder="' + (ph || label) + '" value="' + esc(p[k]) + '" ' + attrs +
      (paxErr[o.id + k] ? ' aria-invalid="true" aria-describedby="' + id(k) + '-err"' : '') + '>';
    const cur = country(p.cc);
    // "Clear" right of the title empties this passenger's fields (user 17.11.2026)
    return '<fieldset class="pax-form"><div class="pax-form__head"><legend class="t-label-lg">' + o.label + '</legend>' +
      '<button type="button" class="link t-label pax-form__clear" data-act="pax-clear" data-id="' + o.id + '">Clear</button></div>' +
      '<div class="field field--names">' +
        inp('first', 'First name', 'autocomplete="off" autocapitalize="words" enterkeyhint="next"') + '<span class="field__divider" aria-hidden="true"></span>' +
        inp('last', 'Last name', 'autocomplete="off" autocapitalize="words" enterkeyhint="next"') +
      '</div>' +
      (o.child ? '' :
        '<div class="form-field"><div class="field' + (paxErr[o.id + 'email'] ? ' field--error' : '') + '">' +
          inp('email', 'Your email', 'type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"') + '</div>' + err('email') + '</div>' +
        '<div class="field field--phone"><span class="phone-cc">' +
          '<span class="phone-cc__flag" data-flag="' + o.id + '">' + GO.FLAGS[cur[0]] + '</span>' + ic('chevron-down', 16) +
          '<select data-pax="' + o.id + '" name="cc" aria-label="' + o.label + ', country code">' +
            COUNTRIES.map(k => '<option value="' + k[0] + '"' + (k[0] === cur[0] ? ' selected' : '') + '>' + esc(k[1]) + ' +' + k[2] + '</option>').join('') +
          '</select></span>' + codeText(cur, o.id) +
          inp('phone', 'Mobile number', 'type="tel" inputmode="tel" autocomplete="off" enterkeyhint="next"', '41 234 567') +
        '</div>') +
    '</fieldset>';
  }
  const draftReady = s => others(s).every(o => named(draft[o.id]));

  GO.screens['details-passengers'] = {
    overlay: true, base: 'details', sheetClass: 'sheet--bottom',
    render(s) {
      const saved = s.passengers || {};
      draft = {}; paxErr = {};
      others(s).forEach(o => { draft[o.id] = Object.assign({}, PAX_EMPTY, saved[o.id]); });
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Add other passengers</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<form class="sheet__body pax-sheet" data-pax-form novalidate>' +
          '<p class="t-body-sm c-secondary">Enter the details of everyone travelling with you</p>' +
          others(s).map(paxForm).join('') +
        '</form>' +
        '<div class="cta-bar"><button class="btn btn--primary" data-act="pax-save">Save passengers</button></div>'; // always active, nothing required (user 17.11.2026)
    },
    mount(root) {
      const form = root.querySelector('[data-pax-form]');
      const save = root.querySelector('[data-act=pax-save]');
      form.addEventListener('input', ev => {
        const t = ev.target;
        if (!t.dataset.pax) return;
        if (t.name === 'phone') {
          const k = t.dataset.pax, q = sel => root.querySelector(sel + '="' + k + '"]');
          const cc = takeCode(t, root.querySelector('select[data-pax="' + k + '"]'), q('[data-flag'), q('[data-code'));
          if (cc) draft[k].cc = cc;
        }
        draft[t.dataset.pax][t.name] = t.value;
        if (t.name === 'email' && paxErr[t.dataset.pax + 'email'] && EMAIL.test(t.value.trim())) paxEmailError(t, '');
      });
      form.addEventListener('change', ev => {
        const t = ev.target;
        if (t.name !== 'cc') return;
        draft[t.dataset.pax].cc = t.value;
        root.querySelector('[data-flag="' + t.dataset.pax + '"]').innerHTML = GO.FLAGS[t.value];
        root.querySelector('[data-code="' + t.dataset.pax + '"]').textContent = '+' + country(t.value)[2];
      });
      form.addEventListener('focusout', ev => {
        const t = ev.target;
        if (t.name === 'email' && t.value.trim() && !EMAIL.test(t.value.trim())) paxEmailError(t, 'Check the email, it should look like name@example.com');
      });
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
        ev.preventDefault();
        const list = Array.from(form.querySelectorAll('input'));
        const next = list[list.indexOf(ev.target) + 1];
        if (next) next.focus(); else if (!save.disabled) save.click();
      });
    },
    actions: {
      close: () => GO.router.back(),
      'pax-clear'(el) {
        const id = el.dataset.id, fs = el.closest('.pax-form');
        draft[id] = Object.assign({}, PAX_EMPTY);
        fs.querySelectorAll('input').forEach(i => { i.value = ''; if (i.name === 'email') paxEmailError(i, ''); });
        const sel = fs.querySelector('select'); if (sel) { sel.value = 'si'; fs.querySelector('[data-flag="' + id + '"]').innerHTML = GO.FLAGS.si; fs.querySelector('[data-code="' + id + '"]').textContent = '+' + country('si')[2]; }
        const f = fs.querySelector('input'); if (f) f.focus({ preventScroll: true });
      },
      'pax-save'() {
        const bad = Array.from(document.querySelectorAll('.pax-sheet input[name=email]')).filter(i => i.value.trim() && !EMAIL.test(i.value.trim()));
        bad.forEach(i => paxEmailError(i, 'Check the email, it should look like name@example.com'));
        if (bad.length) { bad[0].focus(); return; }
        const s = GO.store.get();
        const passengers = {};
        others(s).forEach(o => { const p = draft[o.id]; passengers[o.id] = o.child ? { first: p.first.trim(), last: p.last.trim() } : Object.assign({}, p, { first: p.first.trim(), last: p.last.trim(), email: p.email.trim() }); });
        GO.store.set({ passengers: Object.assign({}, s.passengers, passengers), othersOff: false });
        GO.router.back();
        setTimeout(() => { const l = document.querySelector('[data-others]') || document.querySelector('[data-act=others]'); if (l) l.focus({ preventScroll: true }); }, 50);
      },
    },
  };
  function paxEmailError(t, msg) {
    const key = t.dataset.pax + 'email';
    if (msg) paxErr[key] = msg; else delete paxErr[key];
    const f = t.closest('.form-field');
    f.querySelector('.field').classList.toggle('field--error', !!msg);
    let p = f.querySelector('.field-error');
    if (!msg) { if (p) p.remove(); t.removeAttribute('aria-invalid'); t.removeAttribute('aria-describedby'); return; }
    if (!p) { p = document.createElement('p'); p.id = t.id + '-err'; p.className = 't-body-sm field-error'; f.querySelector('.field').after(p); }
    p.innerHTML = esc(msg);
    t.setAttribute('aria-invalid', 'true'); t.setAttribute('aria-describedby', p.id);
  }

  // ---------- sheet: price details (the Extras breakdown) ----------
  GO.screens['details-total'] = {
    overlay: true, base: 'details', sheetClass: 'sheet--bottom',
    render(s) {
      const L = B.legs(s);
      const T = L.length && !L.some(l => !l.o) ? B.totals(s, B.ex(), L) : { lines: [], total: 0 };
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Price details</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body">' +
          '<dl class="price-lines">' + T.lines.map(l =>
            '<div class="price-line"><dt class="t-body">' + esc(l.label) + '</dt><dd class="t-body">' + (l.value < 0 ? '−' : '') + B.money2(Math.abs(l.value)) + '</dd></div>').join('') +
            '<div class="price-line price-line--total"><dt class="t-label-lg">Total</dt><dd class="t-h3">' + B.money2(T.total) + '</dd></div>' +
          '</dl>' +
        '</div>' +
        '<div class="cta-bar"><button class="btn btn--secondary" data-act="close">Got it</button></div>';
    },
    actions: { close: () => GO.router.back() },
  };
})();
</script>
<script>
// Payment — a block on Details since 29.10.2026 (Phil: payment and login on one page, the payment under "Or continue with",
// the bottom block with the total and Pay not sticky, at the page end). The methods as in the real Revolut checkout
// (Figma 3027:1863, the list 2799:9): two sections — Revolut Pay; card, Apple Pay, Google Pay. Every method is a full-width
// button only, the card marks inside Bank card. Revolut Pay, Apple Pay and Google Pay pay at once; Bank card opens the card fields in the section,
// Pay at the page end pays by card. No Pay by bank (user 29.10.2026).
// Before: a separate step, Streamline Flow 14 (1496:79619). In production the card fields are the Revolut Checkout widget;
// here they check the format and the Luhn sum.
(function () {
  const u = GO.u;
  const { esc } = u;
  const ic = GO.icon;
  const B = GO.booking;

  const LABEL = { card: 'Credit or debit card', revolut: 'Revolut Pay', apple: 'Apple Pay', google: 'Google Pay' };
  const PETROL_DAYS = 2; // pay at Petrol's points of sale within 2 days (goopti.com checkout, client 03.11.2026)
  const DECLINED = '4000000000000002'; // test card that the fake bank turns down

  // v5 (Presentations New 05.11 679:918 / 679:1161): choice - the radio picked in the open card block: 'saved-<i>' or 'new';
  // petrol - the Pay at Petrol radio is on. No cardholder name in the design
  let pay = { open: false, number: '', exp: '', cvc: '', choice: null, petrol: false };
  let errors = {};
  let failed = false, busy = null; // busy: the method being paid with

  // ---------- card format ----------
  function digits(s) { return (s || '').replace(/\D/g, ''); }
  function brand(n) {
    if (/^4/.test(n)) return 'Visa';
    if (/^(5[1-5]|2[2-7])/.test(n)) return 'Mastercard';
    if (/^3[47]/.test(n)) return 'American Express';
    return null;
  }
  function fmtNumber(n) {
    n = n.slice(0, brand(n) === 'American Express' ? 15 : 19);
    if (brand(n) === 'American Express') return [n.slice(0, 4), n.slice(4, 10), n.slice(10)].filter(Boolean).join(' ');
    return n.replace(/(\d{4})(?=\d)/g, '$1 ');
  }
  function fmtExp(d, deleting) {
    d = d.slice(0, 4);
    if (d.length === 1 && d > '1') d = '0' + d; // "4" -> "04 / "
    if (d.length < 2) return d;
    return d.slice(0, 2) + (d.length > 2 || !deleting ? ' / ' : '') + d.slice(2);
  }
  function luhn(n) {
    let sum = 0;
    for (let i = 0; i < n.length; i++) {
      let x = +n[n.length - 1 - i];
      if (i % 2) { x *= 2; if (x > 9) x -= 9; }
      sum += x;
    }
    return sum % 10 === 0;
  }
  function check(key) {
    const n = digits(pay.number);
    if (key === 'number') {
      if (!n) return 'Enter the card number';
      if (n.length >= 4 && !brand(n)) return 'We take Visa, Mastercard and American Express';
      return n.length < 13 || !luhn(n) ? 'Check the card number, it isn’t complete or has a typo' : '';
    }
    if (key === 'exp') {
      const d = digits(pay.exp);
      if (!d) return 'Enter the expiry date';
      const m = +d.slice(0, 2), y = 2000 + +d.slice(2, 4);
      if (d.length < 4 || m < 1 || m > 12) return 'Enter the date as on the card, MM / YY';
      const t = u.today().split('-').map(Number);
      return y < t[0] || (y === t[0] && m < t[1]) ? 'This card has expired' : '';
    }
    if (key === 'name') return pay.name.trim() ? '' : 'Enter the name as on the card';
    if (key === 'cvc') {
      const need = brand(n) === 'American Express' ? 4 : 3;
      const d = digits(pay.cvc);
      return !d ? 'Enter the security code' : d.length !== need ? 'Enter the ' + need + ' digits on the ' + (need === 4 ? 'front' : 'back') + ' of the card' : '';
    }
    return '';
  }

  const CARD_KEYS = ['number', 'exp', 'cvc'];

  // ---------- pieces ----------
  function field(key, label, attrs, helper) {
    const err = errors[key];
    const ids = [err ? key + '-err' : '', helper ? key + '-help' : ''].filter(Boolean).join(' ');
    return '<div class="form-field">' +
      '<label class="t-label" for="p-' + key + '">' + label + '</label>' +
      '<div class="field' + (err ? ' field--error' : '') + '"><input id="p-' + key + '" name="' + key + '" value="' + esc(pay[key]) + '" ' + attrs +
        (err ? ' aria-invalid="true"' : '') + (ids ? ' aria-describedby="' + ids + '"' : '') + '></div>' +
      (err ? '<p id="' + key + '-err" class="t-body-sm field-error">' + esc(err) + '</p>' : '') +
      (helper ? '<p id="' + key + '-help" class="t-body-sm c-tertiary"' + (err ? ' hidden' : '') + '>' + helper + '</p>' : '') +
    '</div>';
  }

  // the email is the one in the contact form above, so only the card and the name on it (Revolut asks for both)
  function cardFields() {
    const amex = brand(digits(pay.number)) === 'American Express';
    return '<div class="card-fields">' +
      field('number', 'Card number', 'inputmode="numeric" autocomplete="cc-number" enterkeyhint="next" placeholder="1234 5678 9012 3456"') +
      '<div class="card-fields__row">' +
        field('exp', 'Expiry date', 'inputmode="numeric" autocomplete="cc-exp" enterkeyhint="next" placeholder="MM / YY"') +
        field('cvc', 'Security code', 'type="password" inputmode="numeric" autocomplete="cc-csc" enterkeyhint="done" placeholder="' + (amex ? '4 digits' : '3 digits') + '"') +
      '</div>' +
    '</div>';
  }

  const marks = () => '<span class="pay-marks">' + GO.PAY.visa + GO.PAY.mastercard + GO.PAY.amex + '</span>';
  // the wallets' logos without the "Pay" word: the apple cut out of the Apple Pay mark, the Google G of the login row
  const APPLE = '<svg aria-hidden="true" focusable="false" viewBox="0 0 12.92 16.16" width="16" height="20">' +
    GO.PAY.applePay.match(/<path[^>]*\/>/g).slice(0, 2).join('').replace(/fill="white"/g, 'fill="currentColor"') + '</svg>';
  const WALLET = { apple: [APPLE, 'Apple Pay'], google: [GO.LOGO_GOOGLE, 'Google Pay'] };
  // Revolut Pay keeps its own black button; Apple Pay and Google Pay are white with the logo and the name (user 30.10.2026, were black marks)
  function payBtn(id, inner, label) {
    const on = busy === id, w = WALLET[id];
    return '<button type="button" class="pay-btn ' + (w ? 'pay-btn--light' : 'pay-btn--dark') + '" data-act="pay" data-method="' + id + '"' + (w ? '' : ' aria-label="' + label + '"') +
      (busy ? ' disabled' : '') + (on ? ' aria-busy="true"' : '') + '><span class="pay-btn__in">' + (w ? w[0] + '<span>' + w[1] + '</span>' : inner) + '</span></button>';
  }
  // the card button is outlined as the login buttons above (user 29.10.2026), reads "Bank card" (user 30.10.2026); it only opens the fields, so it never spins.
  // Always "Bank card": the saved cards are inside it now (Phil 05.11.2026; was "New bank card" under the saved cards)
  const cardBtn = () => '<button type="button" class="btn btn--secondary btn--social pay-card-btn" data-act="pay" data-method="card"' + (busy ? ' disabled' : '') + '>' +
    marks() + 'Bank card</button>';
  // Saved cards (client 03.11.2026, as goopti.com's checkout): the cards of the signed-in account, from its earlier bookings.
  // Each is a white button like Apple Pay with the card's mark and "Mastercard •••• 3024", it pays at once.
  // Not on the list of ways to pay but in the open Bank card block, over the new card's fields (Phil 05.11.2026)
  function savedCards() { const a = (GO.store.get().contact || {}).account; return (a && a.cards) || []; }
  function savedBtn(c, i) {
    const id = 'saved-' + i, on = busy === id;
    return '<button type="button" class="pay-btn pay-btn--light pay-saved" data-act="pay" data-method="' + id + '"' + (busy ? ' disabled' : '') + (on ? ' aria-busy="true"' : '') + '>' +
      '<span class="pay-btn__in">' + GO.PAY[c.brand.toLowerCase()] + '<span>' + esc(c.brand) + ' •••• ' + esc(c.last4) + '</span></span></button>';
  }
  // Petrol (client 03.11.2026, as goopti.com: "Plačilo opravite na Petrolovih prodajnih mestih v roku 2 dni"): the booking is made now,
  // paid at a Petrol station within 2 days. Petrol's own logo (GO.PAY.petrol) — the button just "Pay at Petrol" (user 05.11.2026; was "… within 2 days"), the deadline stays on the confirmation
  function petrolBtn() {
    const on = busy === 'petrol';
    return '<button type="button" class="pay-btn pay-btn--light" data-act="pay" data-method="petrol"' + (busy ? ' disabled' : '') + (on ? ' aria-busy="true"' : '') + '>' +
      '<span class="pay-btn__in">' + GO.PAY.petrol + '<span>Pay at Petrol</span></span></button>';
  }
  // every method is its button only, full width: the name is on the button, the card marks inside Bank card (user 29.10.2026)
  // Total with the price details link, as on the bar of the offers (user 02.11.2026: in place of "Choose a payment method")
  function totalLine(T) {
    return '<div class="cta-inline__total pay-total">' +
        '<div class="cta-inline__sum"><span class="t-label-lg total-info">Total<button type="button" class="total-info__btn" data-act="total" aria-label="Price details">' + GO.icon('info', 16) + '</button></span><span class="t-h2 nowrap">' + B.money2(T.total) + '</span></div>' +
        '<div class="cta-inline__note"><button class="link t-caption c-tertiary" data-act="total" aria-label="Price details, incl. transaction fee">incl. transaction fee</button></div>' +
      '</div>';
  }
  // ---------- v5 ----------
  // a radio row: the round mark, the name and the marks; a native radio under it, the whole row is the tap target
  function radioRow(name, value, on, label, marksHtml, extra) {
    return '<label class="pay-radio"><input type="radio" name="' + name + '" value="' + value + '"' + (on ? ' checked' : '') + (busy ? ' disabled' : '') + '>' +
      '<span class="pay-radio__dot" aria-hidden="true"></span><span class="pay-radio__label">' + label + '</span>' + (marksHtml || '') + '</label>' + (extra || '');
  }
  function payNow(method) {
    return '<button type="button" class="btn btn--primary" data-act="pay" data-method="' + method + '"' + (busy ? ' disabled' : '') + (busy === method ? ' aria-busy="true"' : '') + '>' +
      (busy === method ? '<span class="sr-only">Paying…</span>' : '') + '<span class="btn__label">Pay now</span></button>';
  }
  const choice = () => pay.choice || (savedCards().length ? 'saved-0' : 'new');
  function methodsV5(T) {
    const total = GO.totalLine(T);
    // the card block: the saved cards and "New credit card" as radios, the new card's fields only with it picked, Pay now at the block's end
    if (pay.open) {
      const cards = savedCards(), ch = choice();
      return '<div class="pay-methods">' + total +
        '<section class="pay-card" aria-label="Bank card">' +
          '<button type="button" class="icon-btn pay-card__close" data-act="pay-other" aria-label="Close bank card, other ways to pay">' + ic('close', 24) + '</button>' +
          (cards.length ? '<div class="pay-radios pay-radios--card" role="radiogroup" aria-label="Card">' +
            // a bin right after the number removes the card from the account, as on goopti.com (Damian 05.11.2026)
            cards.map((c, i) => '<div class="pay-radio-line">' +
              radioRow('pay-card', 'saved-' + i, ch === 'saved-' + i, esc(c.brand === 'Visa' ? 'VISA' : c.brand) + ' *' + esc(c.last4), '', '').replace('<span class="pay-radio__label">', '<span class="pay-radio__mark">' + GO.PAY[c.brand.toLowerCase()] + '</span><span class="pay-radio__label">') +
              '<button type="button" class="icon-btn pay-radio__remove" data-act="card-remove" data-i="' + i + '" aria-label="Remove ' + esc(c.brand) + ' card ending ' + esc(c.last4) + '"' + (busy ? ' disabled' : '') + '>' + ic('trash', 20) + '</button></div>').join('') +
            radioRow('pay-card', 'new', ch === 'new', 'New credit card') + '</div>' : '') +
          (ch === 'new' ? cardFields() : '') +
          payNow(ch === 'new' ? 'card' : ch) +
        '</section></div>';
    }
    return '<div class="pay-methods">' + total +
      // v6 (Mobile 09.11.2026 3249:10605, user 09.11.2026): no visible "Choose a payment method:"; Bank card and Pay at Petrol are
      // white buttons 56 with a black outline, the logo first (v5: radio rows). Bank card opens the card block, Petrol books at once
      '<section class="pay-sec" aria-labelledby="pay-title"><h2 id="pay-title" class="sr-only">Choose a payment method</h2>' +
        '<div class="pay-wallets">' + payBtn('revolut', GO.PAY.revolutPay, 'Pay with Revolut Pay') + payBtn('apple', GO.PAY.applePay, 'Pay with Apple Pay') + payBtn('google', GO.PAY.googlePay, 'Pay with Google Pay') + '</div>' +
        // no "or" divider after Apple Pay (user 10.11.2026): one column of buttons
        '<div class="pay-wallets pay-other">' +
          '<button type="button" class="pay-btn pay-btn--light pay-btn--outline pay-card-btn" data-act="pay" data-method="card"' + (busy ? ' disabled' : '') + '>' +
            '<span class="pay-btn__in"><span class="pay-marks pay-marks--bare">' + GO.PAY.visaMark + GO.PAY.mastercardMark + '</span><span>Bank card</span></span></button>' +
        '</div>' +
      '</section></div>';
  }
  function petrolGo() {
    const on = busy === 'petrol';
    return '<button type="button" class="btn btn--primary" data-act="pay" data-method="petrol"' + (busy ? ' disabled' : '') + (on ? ' aria-busy="true"' : '') + '>' +
      (on ? '<span class="sr-only">Booking…</span>' : '') + '<span class="btn__label">Continue</span></button>';
  }

  function methods(T) {
    if (GO.extrasBaggage() === 3) return methodsV5(T);
    // paying by card hides the other methods, so the total and Pay at the page end come right under the fields (user 30.10.2026);
    // the cross in the card block's corner brings them back (Phil 30.10.2026; was an "Other ways to pay" link under the block)
    if (pay.open) return '<div class="pay-methods"><h2 class="t-label-lg">Pay by bank card</h2>' +
      '<section class="ex-card pay-sec pay-sec--card" aria-label="Bank card">' +
        '<button type="button" class="icon-btn pay-sec__close" data-act="pay-other" aria-label="Close bank card, other ways to pay">' + ic('close', 24) + '</button>' +
        // the saved cards first under a "Saved cards" line (the cross sits on it, as on "Card number"), "or", then a new card
        (savedCards().length ? '<p class="t-label pay-saved-title">Saved cards</p><div class="pay-wallets">' + savedCards().map(savedBtn).join('') + '</div>' +
          '<p class="pay-or t-body-sm c-tertiary" aria-hidden="true">or</p>' : '') +
        cardFields() + '</section></div>';
    // the total stands over the ways to pay, the bar at the page end comes only with the card fields and Pay (user 02.11.2026)
    return '<div class="pay-methods">' + totalLine(T) +
      // one section, Revolut Pay first (user 30.10.2026; was a section of its own above the others)
      // right on the page, no grey plate (user 02.11.2026)
      '<section class="pay-sec" aria-label="Ways to pay">' +
        // Revolut Pay, Bank card (the saved cards are inside it, Phil 05.11.2026), the wallets; Petrol last (client 03.11.2026)
        '<div class="pay-wallets">' + payBtn('revolut', GO.PAY.revolutPay, 'Pay with Revolut Pay') + cardBtn() +
          payBtn('apple', GO.PAY.applePay, 'Pay with Apple Pay') + payBtn('google', GO.PAY.googlePay, 'Pay with Google Pay') + '</div>' + // no Pay at Petrol (user 17.11.2026)
      '</section></div>';
  }

  function failAlert() {
    if (!failed) return '';
    return '<div class="alert alert--error" role="alert" tabindex="-1" id="pay-failed"><span class="alert__icon">' + ic('error-circle', 24, 'icon--error') + '</span>' +
      '<span class="alert__body"><span class="alert__title">Payment didn’t go through</span>' +
      '<span class="alert__text">Your card wasn’t charged. Check the card details or choose another way to pay.</span></span></div>';
  }

  // ---------- the block on Details ----------
  GO.payBlock = {
    // the methods with the card fields, under the login section
    html(T) {
      return '<section class="payment" aria-label="Payment">' + failAlert() +
        '<form class="payment__form" data-pay-form novalidate>' + methods(T) + '</form></section>';
    },
    // the page end, not sticky (Phil 29.10.2026): 'bar' — Total with the price details link and Pay, 'notes' — the small print under it,
    // at the very bottom, 11 / 16, smaller than the caption (user 02.11.2026; caption since 30.10.2026, body-sm before)
    foot(T, part) {
      // v5: the notes 12 / 16 with 16 icons, the Revolut line wraps by itself; no bar - Pay now is in the card block
      if (part === 'notes' && GO.extrasBaggage() === 3) return '<div class="pay-foot pay-foot--v5">' +
          '<p class="pay-note c-secondary">' + ic('lock', 16) + '<span>Payment is processed by Revolut. We don’t see or store your card details.</span></p>' +
          '<p class="pay-note c-secondary">' + ic('shield-lock', 16) + '<span>By paying, you accept the GoOpti <button class="link link--inline" data-act="terms">Terms and Conditions</button> <span class="nowrap">and <button class="link link--inline" data-act="terms">Privacy Policy</button></span></span></p>' +
        '</div>';
      if (part === 'bar' && GO.extrasBaggage() === 3) return '';
      if (part === 'notes') return '<div class="pay-foot">' +
          '<p class="pay-note c-secondary">' + ic('lock', 14) + '<span>Payment is processed by Revolut.<br>We don’t see or store your card details.</span></p>' +
          '<p class="pay-note c-secondary">' + ic('shield-lock', 14) + '<span>By paying, you accept the GoOpti <button class="link link--inline" data-act="terms">Terms and Conditions</button> <span class="nowrap">and <button class="link link--inline" data-act="terms">Privacy Policy</button></span></span></p>' +
        '</div>';
      // Pay only with the card fields open: before that every method's button pays by itself (user 30.10.2026),
      // and the total sits over the methods (02.11.2026), so there is no bar
      if (!pay.open) return '';
      return '<div class="cta-bar cta-bar--total cta-inline cta-bar--flow">' + totalLine(T).replace(' pay-total', '') +
        (pay.open ? '<button class="btn btn--primary cta-inline__btn" data-act="pay" data-method="card"' + (busy ? ' disabled' : '') + (busy === 'card' ? ' aria-busy="true"' : '') + '>' +
          (busy === 'card' ? '<span class="sr-only">Paying…</span>' : '') + '<span class="btn__label">Pay</span></button>' : '') + '</div>';
    },
    mount(root) {
      const form = root.querySelector('[data-pay-form]');
      if (!form) return;
      // v5 radios: Bank card opens the card block, Petrol shows its button; in the card block a saved card or a new one
      form.addEventListener('change', ev => {
        const t = ev.target;
        if (t.name === 'pay-way') {
          if (t.value === 'card') { pay.petrol = false; GO.screens.details.actions.pay({ dataset: { method: 'card' } }); if (!pay.open) t.checked = false; return; }
          pay.petrol = true; GO.router.refresh();
          const b = document.querySelector('[data-method=petrol]'); if (b) b.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          const r = document.querySelector('input[name=pay-way][value=petrol]'); if (r) r.focus({ preventScroll: true });
        }
        if (t.name === 'pay-card') {
          pay.choice = t.value; errors = {}; GO.router.refresh();
          const r = document.querySelector('input[name=pay-card][value="' + t.value + '"]'); if (r) r.focus({ preventScroll: true });
        }
      });
      form.addEventListener('input', ev => {
        const t = ev.target, key = t.name;
        if (key === 'name') { pay.name = t.value; if (errors.name && !check('name')) showError('name', ''); return; }
        if (!['number', 'exp', 'cvc'].includes(key)) return;
        const deleting = ev.inputType && ev.inputType.startsWith('delete');
        // reformat and keep the caret after the same number of digits
        let before = digits(t.value.slice(0, t.selectionStart)).length;
        if (key === 'exp' && digits(t.value).length === 1 && digits(t.value) > '1') before = 2; // "8" became "08 / "
        let v = key === 'number' ? fmtNumber(digits(t.value)) : key === 'exp' ? fmtExp(digits(t.value), deleting) : digits(t.value).slice(0, 4);
        t.value = v;
        let pos = 0, seen = 0;
        while (pos < v.length && seen < before) { if (/\d/.test(v[pos])) seen++; pos++; }
        if (key === 'exp' && !deleting && pos === 2 && v.length > 2) pos = v.length;
        try { t.setSelectionRange(pos, pos); } catch (e) {}
        pay[key] = v;
        if (key === 'number') failed = false;
        if (errors[key] && !check(key)) showError(key, '');
        // a full card number moves on to the expiry date
        const n = digits(pay.number);
        if (key === 'number' && !deleting && n.length === (brand(n) === 'American Express' ? 15 : 16) && luhn(n)) document.getElementById('p-exp').focus();
        if (key === 'exp' && !deleting && digits(v).length === 4) document.getElementById('p-cvc').focus();
      });
      form.addEventListener('focusout', ev => {
        const key = ev.target.name;
        if (!CARD_KEYS.includes(key) || !pay[key]) return;
        showError(key, check(key));
      });
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT' || ev.target.type === 'radio') return;
        ev.preventDefault();
        const next = { number: 'p-exp', exp: 'p-cvc' }[ev.target.name];
        if (next) document.getElementById(next).focus(); else GO.screens.details.actions.pay();
      });
      if (failed) { const a = root.querySelector('#pay-failed'); if (a) a.focus({ preventScroll: true }); }
    },
    terms: () => u.toast('Terms open in a new tab on the real site'),
    // remove a saved card: off the account, the pick goes back to the first card left (or to a new card), the focus to that radio
    removeCard(i) {
      if (busy) return;
      const c = GO.store.get().contact || {}, a = c.account;
      if (!a || !a.cards || !a.cards[i]) return;
      const gone = a.cards[i];
      GO.store.set({ contact: Object.assign({}, c, { account: Object.assign({}, a, { cards: a.cards.filter((_, k) => k !== i) }) }) });
      pay.choice = null; errors = {};
      GO.router.refresh();
      u.toast(gone.brand + ' •••• ' + gone.last4 + ' removed');
      const r = document.querySelector('input[name=pay-card]:checked') || document.getElementById('p-number');
      if (r) r.focus({ preventScroll: true });
    },
    // back to all the methods from the card fields; what was typed stays
    other() {
      if (busy) return;
      pay.open = false; failed = false; errors = {}; GO.router.refresh();
      const b = document.querySelector('[data-method="card"].pay-card-btn') || document.querySelector('input[name=pay-way][value=card]');
      if (b) { b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    },
    // called by Details once the contact fields are fine; method: the button's data-method
    async submit(method) {
      if (busy) return;
      method = method || 'card';
      if (method === 'card') {
        // Bank card: open the card fields first (Pay at the page end shows only then)
        if (!pay.open) {
          pay.open = true; GO.router.refresh();
          // with saved cards the focus goes to the first of them, no keyboard over them; otherwise to the card number
          const saved = document.querySelector('.pay-sec--card .pay-saved') || document.querySelector('input[name=pay-card]:checked');
          (saved || document.getElementById('p-number')).focus({ preventScroll: true });
          // the contacts are fine here, so the card block goes right under the header: all its fields over the keyboard (user 30.10.2026; was the number centred)
          // one frame later, once the keyboard has made the screen shorter
          requestAnimationFrame(() => {
            const sec = document.querySelector('.pay-card') || document.querySelector('.card-fields').closest('.pay-sec'), head = document.querySelector('.page-header, .route-top');
            window.scrollBy({ top: sec.getBoundingClientRect().top - (head ? head.getBoundingClientRect().bottom : 0) - 8, behavior: 'smooth' });
          });
          return;
        }
        CARD_KEYS.forEach(k => showError(k, check(k)));
        const first = CARD_KEYS.find(k => errors[k]);
        if (first) { const el = document.getElementById('p-' + first); el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
      }
      busy = method; failed = false; GO.router.refresh();
      await u.sleep(method === 'card' ? 1400 : 1800);
      busy = null;
      if (method === 'card' && digits(pay.number) === DECLINED) {
        failed = true; GO.router.refresh();
        const a = document.getElementById('pay-failed');
        if (a) { a.scrollIntoView({ block: 'center' }); a.focus({ preventScroll: true }); }
        return;
      }
      book(method);
    },
  };

  function showError(key, msg) {
    if (msg) errors[key] = msg; else delete errors[key];
    const t = document.getElementById('p-' + key);
    if (!t) return;
    const f = t.closest('.form-field');
    f.querySelector('.field').classList.toggle('field--error', !!msg);
    let p = f.querySelector('.field-error');
    const help = f.querySelector('#' + key + '-help');
    if (!msg) { if (p) p.remove(); t.removeAttribute('aria-invalid'); }
    else {
      if (!p) { p = document.createElement('p'); p.id = key + '-err'; p.className = 't-body-sm field-error'; f.querySelector('.field').after(p); }
      p.innerHTML = esc(msg);
      t.setAttribute('aria-invalid', 'true');
    }
    if (help) help.hidden = !!msg; // the error replaces the helper (Form/Input)
    const ids = [msg ? key + '-err' : '', help && !msg ? help.id : ''].filter(Boolean).join(' ');
    if (ids) t.setAttribute('aria-describedby', ids); else t.removeAttribute('aria-describedby');
  }

  // ---------- booked: a snapshot for Confirmation, then the trip is cleared ----------
  function book(method) {
    const s = GO.store.get();
    const e = B.ex();
    const L = B.legs(s);
    const T = B.totals(s, e, L);
    const c = Object.assign({ cc: 'si', phone: '', email: '' }, s.contact);
    const cc = GO.COUNTRY_CODES ? GO.COUNTRY_CODES[c.cc] : '386';
    const n = digits(pay.number);
    const items = [L.length + (L.length > 1 ? ' transfers' : ' transfer')];
    if (e.nw) items.push('No Worries package');
    if (s.refund) items.push('100% money refund');
    const LUG_SHORT = { trolley: 'trolley', s20: '20 kg suitcase', s32: '32 kg suitcase', special: 'special item' };
    GO.api.LUGGAGE.forEach(i => { const k = e.lug[i.id]; if (k) items.push(k + ' ' + LUG_SHORT[i.id] + (k > 1 ? 's' : '')); });
    if (e.voucher) items.push('promo code ' + e.voucher.code);
    const booked = {
      ref: 'GO-' + String(400000 + Math.floor(Math.random() * 99999)),
      email: c.email.trim(),
      phone: '+' + cc + ' ' + digits(c.phone).replace(/^0+/, '').replace(/(\d{2})(\d{3})(\d+)/, '$1 $2 $3'),
      pax: B.paxLabel(s),
      paidWith: method === 'card' ? brand(n) + ' •••• ' + n.slice(-4)
        : method.startsWith('saved-') ? (c => c.brand + ' •••• ' + c.last4)(savedCards()[+method.slice(6)])
        : method === 'petrol' ? 'Petrol' : LABEL[method],
      // Petrol: not paid yet, the last day to pay at a station
      payBy: method === 'petrol' ? u.addDays(u.today(), PETROL_DAYS) : null,
      items: items.join(', '),
      lines: T.lines.map(l => ({ label: l.label, value: l.value })),
      total: T.total,
      legs: L.map(l => ({
        leg: l.leg, date: l.q.date, from: l.q.from, to: l.q.to,
        kind: l.o.kind, window: l.o.window || 0, pickFrom: l.o.pickFrom, pickTo: l.o.pickTo, arrival: l.o.arrival, dur: l.o.dur, total: l.o.total,
      })),
    };
    pay = { open: false, number: '', exp: '', cvc: '', choice: null, petrol: false }; errors = {};
    // the trip is done: the next search starts clean, contact details stay for the next booking
    const contact = s.contact;
    GO.store.reset();
    GO.store.set({ booked, contact, bookedFresh: true });
    GO.router.go('/booked', { replace: true });
  }
})();
</script>
<script>
// Confirmation — Streamline, New flow 06.10.2026: Flow 15 (1493:40822). Rendered from the snapshot saved at payment
// (state.booked), so it survives a reload and a new search. No back button and no "Done": the logo leads home.
(function () {
  const u = GO.u;
  const { esc, fmtDay, fromMin, fmtDur, addDays } = u;
  const ic = GO.icon;
  const api = GO.api;

  // "Paid with Visa •••• 9223"; a Petrol booking isn't paid yet: "Pay at a Petrol station by Thu 5 Nov" (client 03.11.2026)
  function payLine(b) { return b.payBy ? 'Pay at a Petrol station by ' + fmtDay(b.payBy) : 'Paid with ' + b.paidWith; }
  function money(n) { return (Number.isInteger(n) ? n : n.toFixed(2)) + ' €'; } // the sign after the price (user 17.11.2026)
  function rideTitle(l) {
    if (l.kind === 'private') return 'Private transfer, no other passengers';
    // no "window" (Phil 27.10.2026): the length in words, as in Price details ("Shared, flexible 2 hours")
    const h = l.window / 60;
    return l.kind === 'flex' ? 'Shared transfer, flexible ' + h + (h === 1 ? ' hour' : ' hours') : 'Shared transfer, exact pick-up time';
  }
  const pick = l => l.kind === 'flex' ? fromMin(l.pickFrom) + '–' + fromMin(l.pickTo) : fromMin(l.pickFrom);
  // pick-up and drop-off can fall on the next day after midnight
  const dayOf = (l, min) => min >= 1440 ? addDays(l.date, 1) : min < 0 ? addDays(l.date, -1) : l.date;
  // to the airport and back home the time is the latest drop-off (Flow 15 round trip 1504:4675)
  const toLabel = l => l.to.type === 'airport' ? 'At the airport by' : 'Latest drop-off';

  function tripCard(b, l, round) {
    return '<article class="trip-card" aria-label="' + (round ? (l.leg === 'out' ? 'Departure' : 'Return') : 'Your ride') + '">' +
      '<div class="trip-card__head">' +
        // round trip: "Departure, Thu 15 Oct" in one line, as in 1504:4675
        '<h3 class="t-label-lg">' + (round ? (l.leg === 'out' ? 'Departure, ' : 'Return, ') : '') + fmtDay(dayOf(l, l.pickFrom)) + '</h3>' +
        '<p class="t-body-sm c-secondary">' + esc(rideTitle(l)) + '</p>' +
      '</div>' +
      '<ol class="trip-route">' +
        '<li class="trip-route__stop">' +
          '<span class="trip-route__rail">' + ic('map-pin', 20, 'icon--brand') + '<span class="trip-route__line"></span></span>' +
          '<div class="trip-route__text"><span class="t-caption c-tertiary">' + (l.kind === 'flex' ? 'Flexible pick-up time' : 'Pick-up') + '</span>' +
            '<span class="t-h2">' + pick(l) + '</span><span class="t-body-sm c-secondary">' + esc(l.from.name) + '</span></div></li>' +
        '<li class="trip-route__stop">' +
          '<span class="trip-route__rail"><span class="trip-route__line"></span></span>' +
          '<div class="trip-route__text"><span class="t-caption c-tertiary">On the way</span>' +
            '<span class="t-body-sm c-secondary">' + fmtDur(l.dur) + (l.kind === 'private' ? ', straight there' : ', a few short stops') + '</span></div></li>' +
        '<li class="trip-route__stop">' +
          '<span class="trip-route__rail">' + ic('check-circle', 20, 'icon--brand') + '</span>' +
          '<div class="trip-route__text"><span class="t-caption c-tertiary">' + toLabel(l) + '</span>' +
            '<span class="t-h2">' + fromMin(l.arrival) + '</span><span class="t-body-sm c-secondary">' + esc(l.to.name) + '</span></div></li>' +
      '</ol>' +
      '<div class="trip-card__foot">' + ic('user', 16, 'icon--muted') + '<span class="t-body-sm c-secondary">' + esc(b.pax) + '</span>' +
        '<span class="t-label">' + money(l.total) + '</span></div>' +
    '</article>';
  }

  // What happens next — for the first ride; a round trip repeats the same steps before the return
  function timeline(b) {
    const l = b.legs[0];
    const day = fmtDay(dayOf(l, l.pickFrom));
    const steps = [
      { icon: 'check-circle', cls: 'icon--success', when: 'Now', title: 'Ticket and receipt sent', text: 'To ' + b.email + '. Not there? Check your spam folder.' },
    ];
    if (l.kind === 'flex') {
      steps.push({ icon: 'clock', when: fmtDay(addDays(dayOf(l, l.pickFrom), -1)) + ', the day before', title: 'Your exact pick-up time',
        text: 'By SMS to ' + b.phone + ' and by email. It will be between ' + fromMin(l.pickFrom) + ' and ' + fromMin(l.pickTo) + '.' });
    }
    steps.push({ icon: 'user', when: day + ', 1h before pick-up', title: 'Your driver’s phone number', text: 'By SMS and email, with an emergency contact' });
    steps.push({ icon: 'map-pin', when: day + ', ' + pick(l), title: 'Pick-up at ' + l.from.name,
      text: l.kind === 'private' ? 'Your driver waits for you at the pick-up point' : 'Be ready outside at your exact time. The ride may stop briefly for other travellers.' });
    steps.push({ icon: l.kind === 'private' ? 'car' : 'shuttle', when: fmtDur(l.dur) + ' ride time', title: 'Sit back and relax on the way' });
    steps.push({ icon: l.to.type === 'airport' ? 'plane' : 'map-pin', when: fmtDay(dayOf(l, l.arrival)) + ', by ' + fromMin(l.arrival), title: 'At ' + l.to.name });
    const r = b.legs[1];
    if (r) steps.push({ icon: r.from.type === 'airport' ? 'plane' : 'map-pin', when: fmtDay(dayOf(r, r.pickFrom)) + ', ' + pick(r), title: 'Return pick-up at ' + r.from.name });
    return '<ol class="timeline">' + steps.map((st, i) =>
      '<li class="timeline__step">' +
        '<span class="timeline__rail">' + ic(st.icon, 20, st.cls) + (i < steps.length - 1 ? '<span class="timeline__line"></span>' : '') + '</span>' +
        '<div class="timeline__text"><span class="t-caption c-tertiary">' + esc(st.when) + '</span><span class="t-label-lg">' + esc(st.title) + '</span>' +
        (st.text ? '<span class="t-body-sm c-secondary">' + esc(st.text) + '</span>' : '') + '</div>' +
      '</li>').join('') + '</ol>';
  }

  function linkRow(act, icon, title, text) {
    return '<li><button class="link-row" data-act="' + act + '">' +
      (icon ? '<span class="link-row__icon">' + ic(icon, 20) + '</span>' : '') +
      '<span class="link-row__text"><span class="t-body">' + title + '</span><span class="t-caption c-tertiary link-row__sub">' + text + '</span></span>' +
      ic('chevron-right', 20, 'icon--muted') + '</button></li>';
  }

  // Account offer under Manage your booking. Sign-up works now (email code, no password; user 21.10.2026):
  // a guest gets "Create an account" (the email of the booking is filled in), a logged-in person sees where the booking is kept
  function accountOffer(s) {
    const c = s.contact || {}, acc = c.account;
    if (acc) return '<section class="ex-card booked__account" aria-labelledby="acc-title">' +
      '<h2 id="acc-title" class="t-label-lg">This booking is in your account</h2>' +
      '<p class="t-body-sm c-secondary">Logged in as ' + esc(acc.name || [c.first, c.last].filter(Boolean).join(' ') || acc.email) + '. You can see your pick-up time and manage the booking in myOpti.</p>' +
    '</section>';
    return '<section class="ex-card booked__account" aria-labelledby="acc-title">' +
      '<h2 id="acc-title" class="t-label-lg">Keep this booking in your account<br>&amp; save time next ride</h2>' +
      '<p class="t-body-sm c-secondary">See your pick-up time and manage the booking in myOpti. No password needed: we send a code to ' + esc(c.email || 'your email') + '.</p>' +
      '<button class="btn btn--primary" data-act="create-account">Create an account</button>' +
    '</section>';
  }

  GO.screens.booked = {
    render(s) {
      const top = '<header class="topbar topbar--light"><a class="topbar__logo" href="#/" data-act="home" aria-label="GoOpti, book another ride">' + GO.LOGO + '</a>' +
        '<button class="icon-btn" data-act="account" aria-label="Your account">' + ic('user', 24) + '</button></header>';
      const b = s.booked;
      if (!b) return top + '<main class="stub"><p class="t-body c-secondary">No booking yet</p><button class="btn btn--primary" data-act="home">Find your ride</button></main>';
      const round = b.legs.length > 1;
      return top +
        '<main class="booked">' +
          '<section class="booked__hero" aria-labelledby="booked-title">' +
            // as in Anya's desktop (22.10.2026): a light green card, the van without a tick, the title in green
            '<span class="booked__art"><img src="' + GO.IMG_VAN + '" alt="" width="124" height="95"></span>' +
            '<h1 id="booked-title" class="t-h1" tabindex="-1">You’re booked</h1>' +
            '<p class="t-body c-secondary">Your ticket is on its way to <b class="c-primary">' + esc(b.email) + '</b></p>' +
            '<p class="booked__ref"><span class="t-body-sm c-secondary">Booking</span><span class="t-label-lg c-brand">' + esc(b.ref) + '</span></p>' +
          '</section>' +
          '<section class="booked__block" aria-labelledby="trip-title"><h2 id="trip-title" class="t-h3">Your trip</h2>' +
            b.legs.map(l => tripCard(b, l, round)).join('') + '</section>' +
          '<section class="booked__block" aria-labelledby="next-title"><h2 id="next-title" class="t-h3">What happens next</h2>' + timeline(b) + '</section>' +
          '<section class="booked__block" aria-labelledby="pay-title"><h2 id="pay-title" class="t-h3">Payment</h2>' +
            '<ul class="link-rows"><li><button class="link-row" data-act="receipt">' +
              '<span class="link-row__text"><span class="t-body">' + esc(payLine(b)) + '</span><span class="t-caption c-tertiary link-row__sub">' + esc(b.items) + '</span></span>' +
              '<span class="t-label nowrap">' + b.total.toFixed(2) + ' €</span>' + ic('chevron-right', 20, 'icon--muted') + '</button></li></ul></section>' +
          '<section class="booked__block" aria-labelledby="manage-title"><h2 id="manage-title" class="t-h3">Manage your booking</h2>' +
            '<ul class="link-rows">' +
              linkRow('manage', 'edit', 'Change or cancel', 'In myOpti. Cancelling gives you a discount code for a new booking.') +
              linkRow('manage', 'plus', 'Add baggage or a child seat', 'In myOpti, up to 2 days before travel') +
              linkRow('share', 'share', 'Share trip details', 'Send the pick-up time and address to whoever travels with you') +
              linkRow('calendar', 'calendar', 'Add to calendar', 'Pick-up time' + ' and ' + (b.legs[0].to.type === 'airport' ? 'airport time' : 'drop-off time')) +
            '</ul></section>' +
          accountOffer(s) +
          '<p class="t-body-sm c-secondary booked__help">Questions? <button class="link link--inline" data-act="chat">Chat with us</button> or call <a class="link link--inline" href="tel:+38618889371">+386 1 888 93 71</a>.</p>' +
        '</main>';
    },
    mount(root) {
      // announce the result: focus moves to the heading once, right after payment
      const h = root.querySelector('#booked-title');
      if (h && GO.store.get().bookedFresh) { h.focus({ preventScroll: true }); GO.store.set({ bookedFresh: false }); }
    },
    actions: {
      home: () => GO.router.go('/', { replace: true }),
      account: () => u.toast('myOpti comes in a later build'),
      manage: () => u.toast('myOpti comes in a later build'),
      'create-account': () => GO.router.go('/booked/signin'),
      chat: () => u.toast('Chat opens on the real site'),
      receipt: () => GO.router.go('/booked/receipt'),
      async share() {
        const b = GO.store.get().booked, l = b.legs[0];
        const text = 'GoOpti ' + b.ref + ': ' + fmtDay(dayOf(l, l.pickFrom)) + ', pick-up ' + pick(l) + ' at ' + l.from.name + ', to ' + l.to.name + ' by ' + fromMin(l.arrival) + '.';
        if (navigator.share) { try { await navigator.share({ title: 'GoOpti ' + b.ref, text }); } catch (e) {} return; }
        try { await navigator.clipboard.writeText(text); u.toast('Trip details copied'); } catch (e) { u.toast(text); }
      },
      calendar() { download(ics(GO.store.get().booked)); u.toast('Calendar file saved'); },
    },
  };

  // ---------- Add to calendar: a real .ics, one event per ride (from the start of the window to the drop-off) ----------
  function ics(b) {
    const stamp = (iso, min) => {
      const d = u.parseIso(iso); d.setMinutes(min);
      return d.getFullYear() + u.pad(d.getMonth() + 1) + u.pad(d.getDate()) + 'T' + u.pad(d.getHours()) + u.pad(d.getMinutes()) + '00';
    };
    const ev = b.legs.map((l, i) => [
      'BEGIN:VEVENT', 'UID:' + b.ref + '-' + i + '@goopti.com', 'DTSTAMP:' + stamp(u.today(), 0),
      'DTSTART;TZID=Europe/Ljubljana:' + stamp(l.date, l.pickFrom), 'DTEND;TZID=Europe/Ljubljana:' + stamp(l.date, l.arrival),
      'SUMMARY:GoOpti to ' + l.to.name, 'LOCATION:' + l.from.name.replace(/,/g, '\\,'),
      'DESCRIPTION:Booking ' + b.ref + '\\n' + (l.kind === 'flex' ? 'Pick-up between ' + fromMin(l.pickFrom) + ' and ' + fromMin(l.pickTo) + '. Exact time by SMS the day before.' : 'Pick-up at ' + fromMin(l.pickFrom) + '.'),
      'END:VEVENT'].join('\r\n'));
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GoOpti//Booking prototype//EN'].concat(ev, 'END:VCALENDAR').join('\r\n');
  }
  function download(text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar' }));
    a.download = 'goopti-booking.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- sheet: receipt ----------
  GO.screens['booked-receipt'] = {
    overlay: true, base: 'booked', sheetClass: 'sheet--bottom',
    render(s) {
      const b = s.booked;
      if (!b) return '<div class="sheet__body"><p class="t-body">No booking yet</p></div>';
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Receipt</h2><p class="t-body-sm c-secondary">Booking ' + esc(b.ref) + '</p></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<dl class="price-lines">' + b.lines.map(l =>
            '<div class="price-line"><dt class="t-body">' + esc(l.label) + '</dt><dd class="t-body">' + (l.value < 0 ? '−' : '') + Math.abs(l.value).toFixed(2) + ' €</dd></div>').join('') +
            '<div class="price-line price-line--total"><dt class="t-label-lg">' + (b.payBy ? 'Total to pay' : 'Total paid') + '</dt><dd class="t-h3">' + b.total.toFixed(2) + ' €</dd></div>' +
          '</dl>' +
          '<p class="t-caption c-tertiary">' + (b.payBy ? esc(payLine(b)) : 'Paid with ' + esc(b.paidWith) + '. The receipt and invoice are in your email.') + '</p>' +
        '</div>' +
        '<div class="cta-bar"><button class="btn btn--secondary" data-act="close">Got it</button></div>';
    },
    actions: { close: () => GO.router.back() },
  };
})();
</script>
<script>
// TEST DATA — prototype helper, not part of the UI (as in Anya's desktop, Phil 21.10.2026).
// Not for places and addresses: they have their own suggestions (user 21.10.2026).
// Click a text field → a grey panel under it offers ready values; a tap fills the field (or the whole group of fields).
(function () {
  if (GO.frame === 'outer') return; // the app runs inside the phone frame

  // Filling a select (country code, minutes) goes through 'change' too: the screens listen for it
  function set(id, v) {
    const el = document.getElementById(id);
    if (!el) return null;
    el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    if (el.tagName === 'SELECT') el.dispatchEvent(new Event('change', { bubbles: true }));
    return el;
  }
  const names = (f, l, list) => list.map(([a, b]) => ({ label: a + ' ' + b, fill: { [f]: a, [l]: b } }));
  const one = (id, list) => list.map(v => typeof v === 'string' ? { label: v, fill: { [id]: v } } : { label: v[0], note: v[1], fill: { [id]: v[0] } });

  const RULES = [
    { re: /^f-(first|last)$/, opts: () => names('f-first', 'f-last', [['Maja', 'Novak'], ['Luka', 'Kranjc'], ['John', 'Smith']]) },
    { re: /^f-email$/, opts: id => one(id, ['maja.novak@gmail.com', 'luka.kranjc@siol.net', 'john.smith@mail.com']) },
    { re: /^f-phone$/, opts: () => [['si', '+386', '41 555 218'], ['it', '+39', '333 123 4567'], ['gb', '+44', '7700 900123']].map(([cc, code, v]) =>
      ({ label: code + ' ' + v, fill: { 'f-cc': cc, 'f-phone': v } })) },
    // other passengers: p-a2-first, p-c1-last… (the payment fields p-number… don't match)
    { re: /^p-([ac]\d+)-(first|last)$/, opts: id => { const p = id.split('-')[1]; return names('p-' + p + '-first', 'p-' + p + '-last', [['Luka', 'Novak'], ['Ana', 'Novak'], ['John', 'Smith']]); } },
    { re: /^p-([ac]\d+)-email$/, opts: id => one(id, ['luka.novak@gmail.com', 'ana.novak@gmail.com']) },
    { re: /^p-([ac]\d+)-phone$/, opts: id => one(id, ['41 555 219', '41 555 220']) },
    { re: /^login-email$/, opts: id => one(id, [['maja.novak@gmail.com', 'has an account'], ['luka.kranjc@siol.net', 'linked to a company'], ['anna.smith@mail.com', 'new, signs up']]) },
    { re: /^login-code$/, opts: id => one(id, [['1234', 'works'], ['0000', 'wrong code']]) },
    { re: /^voucher-code$/, opts: id => one(id, [['HEY10', '10% off'], ['GOOPTI5', '€5 off'], ['SUMMER', 'error']]) },
    { re: /^flight-q$/, opts: id => one(id, [['EZY5832', 'out, fits the ride'], ['EZY5833', 'back'], 'Vienna', 'FR']) },
    { re: /^mf-(code|city)$/, opts: () => [
      { label: 'EZY1234, London, 10:30', fill: { 'mf-code': 'EZY1234', 'mf-city': 'London', 'mf-h': '10', 'mf-m': '30' } },
      { label: 'W64410, Budapest, 13:20', fill: { 'mf-code': 'W64410', 'mf-city': 'Budapest', 'mf-h': '13', 'mf-m': '20' } },
    ] },
    { re: /^inv-(company|address|vat)$/, opts: () => [
      { label: 'Novak Travel d.o.o.', fill: { 'inv-company': 'Novak Travel d.o.o.', 'inv-address': 'Dunajska cesta 1, 1000 Ljubljana', 'inv-vat': 'SI12345678' } },
    ] },
    { re: /^p-(number|exp|cvc)$/, opts: () => [
      { label: '4242 4242 4242 4242, 12/28, 123', note: 'pays', fill: { 'p-number': '4242 4242 4242 4242', 'p-exp': '12 / 28', 'p-cvc': '123' } },
      { label: '4000 0000 0000 0002, 12/28, 123', note: 'declined', fill: { 'p-number': '4000 0000 0000 0002', 'p-exp': '12 / 28', 'p-cvc': '123' } },
    ] },
  ];

  let panel = null, owner = null;
  function hide() { if (panel) { panel.remove(); panel = null; owner = null; } }
  function place() {
    if (!panel || !owner || !document.body.contains(owner)) return hide();
    const box = (owner.closest('.field') || owner).getBoundingClientRect();
    const w = Math.min(Math.max(box.width, 240), innerWidth - 16);
    panel.style.minWidth = w + 'px';
    panel.style.maxWidth = (innerWidth - 16) + 'px';
    panel.style.left = Math.max(8, Math.min(box.left, innerWidth - 8 - panel.offsetWidth)) + 'px';
    panel.style.top = (box.bottom + 4) + 'px';
  }
  // A pick from the list fills the fields and closes the keyboard, as the system autofill does: the focus leaves the field,
  // for every field (user 12.11.2026; the focus went back to the last filled field and the keyboard stayed)
  function fill(o) {
    Object.entries(o.fill).forEach(([id, v]) => set(id, v));
    hide();
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) a.blur();
  }

  // The panel under an anchor: a field (pick fills it) or a button with no field to fill, like Google / Facebook (pick → onPick)
  function show(anchor, opts, onPick, wrap) {
    hide();
    panel = document.createElement('div');
    panel.className = 'td' + (wrap ? ' td--wrap' : '');
    panel.innerHTML = '<div class="td__head">TEST DATA</div>' + opts.map((o, i) =>
      '<button type="button" class="td__opt" data-td="' + i + '">' + GO.u.esc(o.label) + (o.note ? ' <span class="td__note">— ' + GO.u.esc(o.note) + '</span>' : '') + '</button>').join('');
    panel.addEventListener('pointerdown', ev => ev.preventDefault()); // keep the focus (and the phone keyboard) in the field
    panel.addEventListener('click', ev => { const b = ev.target.closest('[data-td]'); if (b) onPick(+b.dataset.td); });
    owner = anchor;
    document.body.appendChild(panel);
    place();
  }
  // As tdOpen in Anya's desktop: a second click on the same button closes the list
  GO.td = { open(anchor, opts, onPick) { if (owner === anchor) return hide(); show(anchor, opts, i => { hide(); onPick(i); }, true); } };

  // only a click or tap in the field opens the panel; autofocus and focus moved by the screens don't (user 22.10.2026).
  // On the press, not on the click (user 12.11.2026): a field low on the screen (promo code) scrolls up under the keyboard
  // between press and release, the release lands off the field and no click comes, so the first tap showed only the keyboard
  document.addEventListener('pointerdown', e => {
    const el = e.target;
    if (!(el instanceof HTMLInputElement) || !el.id) return;
    const rule = RULES.find(r => r.re.test(el.id));
    if (!rule) return hide();
    if (owner === el) return;
    const opts = rule.opts(el.id);
    show(el, opts, i => fill(opts[i]));
  });
  // a tap outside closes it (buttons don't always take the focus, so focusout alone is not enough)
  document.addEventListener('pointerdown', e => { if (panel && !panel.contains(e.target) && !(owner && owner.contains(e.target))) hide(); }, true);
  // typing by hand hides the panel, so it doesn't cover the button under the field (Sign in popup, 22.10.2026)
  document.addEventListener('input', e => { if (e.target === owner && owner.value) hide(); });
  document.addEventListener('focusout', () => setTimeout(() => { if (owner && document.activeElement !== owner) hide(); }, 0));
  addEventListener('scroll', place, true);
  addEventListener('resize', place);
  if (window.visualViewport) visualViewport.addEventListener('resize', place);
})();
</script>
<script>
// Boot. ?debug shows a small panel for testers: reset, demo data, pinned "today".
(function () {
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) {
    GO.store.reset();
    params.delete('reset'); // a reload must not wipe the state again
    history.replaceState(history.state, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash);
  }

  if (GO.frame === 'outer') return; // the app runs inside the phone frame

  GO.router.start();

  let debug = params.has('debug');
  try { if (debug) sessionStorage.setItem('go.debug', '1'); debug = debug || sessionStorage.getItem('go.debug') === '1'; } catch (e) {}
  if (!debug) return;

  const fab = document.createElement('button');
  fab.className = 'debug-fab'; fab.setAttribute('aria-label', 'Prototype settings'); fab.textContent = '⚙';
  document.body.appendChild(fab);
  let panel = null;
  fab.addEventListener('click', () => {
    if (panel) { panel.remove(); panel = null; return; }
    panel = document.createElement('div');
    panel.className = 'debug-panel';
    panel.innerHTML =
      '<div class="t-label">Prototype</div>' +
      '<div class="t-caption c-tertiary">Today: ' + GO.u.today() + ' (pin with ?today=YYYY-MM-DD)</div>' +
      '<button class="btn btn--secondary" data-dbg="demo">Fill: Ljubljana → Venice, 1 adult</button>' +
      '<button class="btn btn--secondary" data-dbg="demo-rt">Fill: round trip, back on day 10, lands 14:05</button>' +
      '<button class="btn btn--secondary" data-dbg="reset">Start over</button>' +
      '<div class="t-caption c-tertiary">Test cards: 4242 4242 4242 4242 pays, 4000 0000 0000 0002 is declined</div>' +
      '<div class="t-caption c-tertiary">Email login: maja.novak@gmail.com has an account, any other email signs up; any 4-digit code works, 0000 is wrong</div>' +
      '<div class="t-label">Offers</div>' +
      '<div class="debug-panel__row">' +
        ['', 'normal', 'soldout', 'empty'].map(v => '<button class="btn btn--secondary" data-dbg="offers" data-v="' + v + '" aria-pressed="' + (GO.store.get().offersScenario === v) + '">' + (v || 'by date') + '</button>').join('') +
      '</div>';
    panel.addEventListener('click', ev => {
      const b = ev.target.closest('[data-dbg]');
      if (!b) return;
      if (b.dataset.dbg === 'offers') {
        GO.store.set({ offersScenario: b.dataset.v });
        panel.remove(); panel = null;
        return GO.router.refresh(); // the screen's mount fetches offers for the new scenario
      }
      if (b.dataset.dbg === 'reset') GO.store.reset();
      if (b.dataset.dbg === 'demo' || b.dataset.dbg === 'demo-rt') {
        const min = GO.api.bookingWindow().min;
        const date = GO.u.addDays(min, 7);
        const rt = b.dataset.dbg === 'demo-rt';
        GO.store.set({ from: GO.api.place('lj-slovenska'), to: GO.api.place('VCE'), date, time: '10:15', timeMode: 'dropoff', adults: 1, children: 0,
          retDate: rt ? GO.u.addDays(date, 10) : null, retTime: rt ? '15:00' : null, retLanding: false });
      }
      panel.remove(); panel = null;
      GO.router.go('/', { replace: true });
    });
    document.body.appendChild(panel);
  });
})();
</script>
