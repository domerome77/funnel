    return '<div class="sheet-handle" aria-hidden="true"></div>' +
      '<header class="sheet-header">' +
        '<div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">' + esc(title) + '</h2>' +
        (subtitle ? '<div class="t-body-sm c-secondary">' + esc(subtitle) + '</div>' : '') + '</div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button>' +
      '</header>';
  }
  function sheetFoot(label, act) {
    return '<div class="cta-bar"><button class="btn btn--primary" data-act="' + (act || 'close') + '">' + label + '</button></div>';
  }
  const closeAct = { close: () => GO.router.back() };
  // the offer sheets open over the leg they were opened from
  function sheetBase() { return GO.store.get().sheetLeg === 'ret' ? 'offers-return' : 'offers'; }
  function sheetCtx() { return ctx(GO.store.get().sheetLeg || 'out'); }

  // Pick-up windows on one time axis (Shared transfer sheet)
  function windowChart(c) {
    const list = ['flex3', 'flex2', 'flex1', 'fixed'].map(id => c.data.shared.find(o => o.id === id && !o.soldOut)).filter(Boolean)
      .filter((o, i, a) => !(o.id === 'flex1' && a.length > 3)); // the layout shows 3h, 2h and exact
    if (!list.length) return '';
    const lo = Math.floor(Math.min.apply(null, list.map(o => o.pickFrom)) / 120) * 120;
    let hi = lo + 240;
    while (hi < Math.max.apply(null, list.map(o => o.pickTo)) + 15) hi += 120;
    const pct = m => ((m - lo) / (hi - lo) * 100).toFixed(2) + '%';
    const n = ['', 'one', 'two', 'three', 'four'][list.length] || list.length;
    const rows = list.map(o =>
      '<li class="window-row">' +
        '<div class="window-row__label"><span class="t-label">' + (o.kind === 'flex' ? 'Flexible, ' + hours(o.window) : 'Exact time') + '</span>' +
        '<span class="t-caption c-tertiary">' + pickLabel(o) + '</span><span class="t-label window-row__price">' + money(o.unit) + '</span></div>' +
        '<div class="window-row__track"><span class="window-row__bar' + (o.kind === 'flex' ? '' : ' window-row__bar--dot') + '" style="left:' + pct(o.pickFrom) + ';' + (o.kind === 'flex' ? 'width:' + pct(lo + o.window) : '') + '"></span></div>' +
      '</li>').join('');
    const ticks = [lo, (lo + hi) / 2, hi].map(m => '<span>' + fromMin(m) + '</span>').join('');
    const cases = list.length === 1 ? 'In this case' : list.length === 2 ? 'In both cases' : 'In all ' + n + ' cases';
    const note = c.data.toAirport ? cases + ' arrival at the airport at ' + c.q.time + '. Prices per person.' : 'Prices per person';
    return '<div class="window-chart">' +
      '<div class="window-chart__title">' + ic('shuttle', 20) + '<span class="t-label">You will have ' + n + ' pick-up time option' + (list.length > 1 ? 's' : '') + ':</span></div>' +
      '<div class="window-chart__ticks t-caption c-secondary" aria-hidden="true">' + ticks + '</div>' +
      '<ul class="window-chart__rows">' + rows + '</ul>' +
      '<p class="t-caption c-secondary">' + note + '</p>' +
    '</div>';
  }

  function point(icon, title, text) {
    return '<li class="point"><span class="point__icon">' + ic(icon, 20, 'icon--brand') + '</span>' +
      '<span class="point__text"><span class="t-label">' + title + '</span><span class="t-body-sm c-secondary">' + text + '</span></span></li>';
  }

  // The old Shared transfer sheet stays only for the "How shared rides work" button on home (user 21.10.2026);
  // the window chart shows once offers are loaded. In the offers, How it works opens the ride sheet below (30.10.2026).
  GO.screens['home-shared'] = {
    overlay: true, base: 'home', sheetClass: 'sheet--bottom',
    render() {
      const c = sheetCtx();
      return sheetHead('Shared transfer') +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body c-secondary">You may share the ride with others going the same way, with a few short stops. A wider pick-up time costs less:</p>' +
          (c.data ? windowChart(c) : '') +
          '<ul class="points">' +
            point('clock', 'Exact time the day before', 'Comes by SMS, email and app the day before, always inside your pick-up time') +
            point('map-pin', 'Door to door, a few short stops', 'A tried and trusted driver picks you up at your address') +
            point('plane', 'At the airport on time', 'Your latest drop-off time is guaranteed. We plan every stop around it.') +
          '</ul>' +
        '</div>' + sheetFoot('Got it');
    },
    actions: closeAct,
  };

  // ---------- the ride sheet (30.10.2026) ----------
  // The sheet of GoOpti-offers-variants-v2.html (the client's ride sheet from GoOpti-Offers-2-products.html), one for all three:
  // How it works — the shared ride the list shows (the picked one, else the default), What's included — private, (i) — that card's ride.
  // Our rules on top: no "±15 min", the length in words, no refund row.
  function rideTitle(o) {
    if (o.kind === 'private') return 'Private transfer';
    // with "transfer", as "Private transfer" (16.11.2026)
    // as GoOpti-Offers-2-products (user 17.11.2026)
    return o.kind === 'flex' ? 'Shared, flexible pick-up time' : 'Shared, fixed pick-up time';
  }
  // the ride at a glance on top of the sheet (GoOpti-Offers-2-products, user 17.11.2026): pick-up, the vehicle and the length, latest drop-off, the price
  function durShort(m) { const h = Math.floor(m / 60), r = m % 60; return (h ? h + 'h' : '') + (h && r ? ' ' : '') + (r ? r + 'm' : ''); }
  function rideSum(q, o) {
    const flex = o.kind === 'flex', toAir = q.to.type === 'airport';
    const left = flex ? '<span class="t-body-sm c-secondary"><b class="ride-sum__flex">' + (o.window / 60) + 'h flexible</b> pick-up time</span>' : '<span class="t-body-sm c-secondary">Pick-up</span>';
    const pick = flex ? fromMin(o.pickFrom) + '–' + fromMin(o.pickTo) : fromMin(o.pickFrom);
    const price = cardPrice(o); // per person, as the offer cards (user 17.11.2026)
    return '<div class="ride-sum">' +
      '<div class="ride-sum__row">' +
        '<div class="ride-sum__col">' + left + '<span class="t-h2 nowrap">' + pick + '</span></div>' +
        '<div class="ride-sum__mid">' + ic(o.kind === 'private' ? 'car' : 'shuttle', 24) + '<span class="t-body-sm c-secondary">' + durShort(o.dur) + '</span></div>' +
        '<div class="ride-sum__col ride-sum__col--end"><span class="t-body-sm c-secondary">' + (toAir ? 'Latest drop-off' : 'Arrival by') + '</span><span class="t-h2 nowrap">' + fromMin(o.arrival) + '</span></div>' +
      '</div>' +
      '<div class="ride-sum__price offer__amount"><span class="offer__num">' + (Number.isInteger(price) ? price : price.toFixed(2)) + '</span><span class="offer__cur">€</span>' +
        '<span class="vper" aria-hidden="true">/' + GO.icon('user', 16) + '</span><span class="sr-only">per person</span></div>' +
    '</div>';
  }
  function rideItems(q, o) {
    const priv = o.kind === 'private', to = esc(placeLabel(q.to)), arr = fromMin(o.arrival);
    const b = s => '<strong class="ride-strong">' + s + '</strong>';
    const first = q.landing
      ? ['flight-land', o.kind === 'flex'
          ? 'Pick-up between ' + fromMin(o.pickFrom) + ' and ' + fromMin(o.pickTo) + ' after your flight lands. Flight late? We wait for you.'
          : 'Pick-up at ' + fromMin(o.pickFrom) + ' after your flight lands. Flight late? We wait for you.']
      : ['clock', o.kind === 'flex'
          ? b('We’ll set your exact pick-up time') + ' between ' + fromMin(o.pickFrom) + ' and ' + fromMin(o.pickTo) + ' and send it to you by SMS, email &amp; app the day before the transfer.'
          : b('Your driver picks you up at ' + fromMin(o.pickFrom)) + (priv ? '' : ' (±15 min)') + '. Exact pick-up time by SMS, email &amp; app the day before the transfer.'];
    const drive = ['driver', q.from.type === 'airport' ? 'A tried and trusted driver takes you to your address.' : 'A tried and trusted driver picks you up at your address.'];
    const arrive = q.to.type === 'airport'
      ? ['plane', 'Latest drop-off at ' + to + ' at ' + arr + (priv ? '.' : ', guaranteed.')]
      : ['map-pin', 'Arrival in ' + to + ' by ' + arr + '.'];
    const items = [first].concat(priv
      ? [['car', 'Direct, door to door, just for your group. No other passengers join, no stops on the way.'], arrive, ['waving', 'Meet and greet included'], drive]
      : [['shuttle', 'You may share the ride with other passengers, with a few short stops on the way.'], drive, arrive]);
    items.push(['check-circle', 'Free cancellation within 24h of booking']);
    // the refund switched on in the Private card shows in What's included (user 17.11.2026)
    if (priv && GO.store.get().refund) items.push(['check-circle', '<strong class="ride-strong">100% money refund</strong> if you cancel up to 48h before the transfer']);
    return '<ul class="check-list">' + items.map(i => checkItem(i[0], i[1])).join('') + '</ul>';
  }
  function rideOf(c, kind) {
    if (!c.data) return null;
    if (kind === 'private') return c.data.priv[0] || null;
    if (kind === 'offer') return api.findOffer(c.q, c.s.infoOfferId);
    const s = selected(c);
    if (s && c.data.shared.includes(s)) return s;
    const ok = c.data.shared.filter(o => !o.soldOut);
    return ok.find(o => o.id === defaultOffer(c.data)) || ok[0] || null;
  }
  function rideSheet(kind) {
    return {
      overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
      render() {
        const c = sheetCtx();
        const o = rideOf(c, kind);
        if (!o) return sheetHead('Ride details') + '<div class="sheet__body"><p class="t-body c-secondary">This ride is no longer available</p></div>' + sheetFoot('Close');
        const isSel = c.sel.id === o.id;
        return sheetHead(rideTitle(o), routeLabel(c.q) + ', ' + fmtDay(c.q.date)) +
          // the card with the times and the price back on top (user 17.11.2026, as GoOpti-Offers-2-products), then the list
          '<div class="sheet__body sheet__body--gap16 ride-sheet">' +
            rideSum(c.q, o) + rideItems(c.q, o) +
          '</div>' + sheetFoot(isSel ? 'Got it' : 'Choose this ride', isSel ? 'close' : 'choose" data-id="' + o.id);
      },
      actions: {
        close: () => GO.router.back(),
        choose(el) {
          setSel(sheetCtx().leg, { id: el.dataset.id });
          GO.router.back();
        },
      },
    };
  }
  GO.screens['about-shared'] = rideSheet('shared');
  GO.screens['about-private'] = rideSheet('private');
  GO.screens['about-offer'] = rideSheet('offer');

  // ---------- sheet: Add your house number (2320:29071) ----------
  // The street with the number shows live in the chip; the place keeps its id, so the offers stay as they are.
  function withNumber(p, num) {
    return p.street + ' ' + num + (p.city ? ', ' + p.city : '');
  }
  function mapPlaceholder() {
    // streets as in the layout: Figma x, y, w, h, rotation (Figma turns counter-clockwise)
    const rect = (cls, r) => '<span class="' + cls + '" style="left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px;transform:rotate(' + (-r[4]) + 'deg)"></span>';
    return '<div class="house-map" aria-hidden="true">' +
      rect('house-map__park', [200, 110, 120, 80, 8]) +
      [[-20, 84, 420, 14, -12], [60, -20, 12, 260, -18], [230, -20, 10, 260, 10], [-20, 30, 420, 8, 6], [-20, 160, 420, 8, -4], [150, -20, 8, 260, -30]]
        .map(r => rect('house-map__street', r)).join('') +
      '<span class="house-map__pin">' + ic('map-pin', 40, 'icon--brand') + '</span>' +
    '</div>';
  }
  function showHouseErr(root, msg) {
    const input = root.querySelector('#f-house');
    input.closest('.field').classList.toggle('field--error', !!msg);
    root.querySelector('#house-err-slot').innerHTML = msg ? '<p id="house-err" class="t-body-sm field-error">' + esc(msg) + '</p>' : '';
    if (msg) { input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', 'house-err'); }
    else { input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); }
  }

  GO.screens['offers-house'] = {
    overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
    render() {
      const side = houseSide(sheetCtx().q);
      if (!side) return sheetHead('Add your house number') + '<div class="sheet__body"><p class="t-body c-secondary">The address already has a house number</p></div>' + sheetFoot('Close');
      return sheetHead('Add your house number') +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body c-secondary">So we can ' + (side.pickup ? 'pick you up' : 'drop you off') + ' at the right address. Your ride stays selected.</p>' +
          '<div class="house-row">' +
            '<div class="house-row__street">' +
              '<span class="t-label">' + (side.pickup ? 'Pick-up address' : 'Drop-off address') + '</span>' +
              '<span class="chip house-row__chip"><span class="t-body ellipsis" id="house-addr">' + esc(side.place.name) + '</span></span>' +
            '</div>' +
            '<div class="house-row__number">' +
              '<label class="t-label" for="f-house">House number</label>' +
              '<div class="field"><input id="f-house" name="house" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" enterkeyhint="done"></div>' +
            '</div>' +
          '</div>' +
          '<div id="house-err-slot" class="house-err"></div>' +
          mapPlaceholder() +
        '</div>' + sheetFoot('Save and continue', 'save');
    },
    mount(root) {
      const input = root.querySelector('#f-house');
      if (!input) return;
      const side = houseSide(sheetCtx().q);
      input.focus();
      input.addEventListener('input', () => {
        const v = input.value.trim();
        root.querySelector('#house-addr').textContent = v ? withNumber(side.place, v) : side.place.name;
        if (v && input.hasAttribute('aria-invalid')) showHouseErr(root, '');
      });
      input.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); GO.screens['offers-house'].actions.save(); } });
    },
    actions: {
      close: () => GO.router.back(),
      save() {
        const input = document.getElementById('f-house');
        const side = houseSide(sheetCtx().q);
        if (!input || !side) return GO.router.back();
        const root = input.closest('.sheet__body');
        const v = input.value.trim();
        if (!v) { showHouseErr(root, 'Enter your house number'); input.focus(); return; }
        const p = Object.assign({}, side.place, { name: withNumber(side.place, v), noNumber: false });
        const s = GO.store.get();
        const patch = {};
        if (s.from && s.from.id === p.id) patch.from = p;
        if (s.to && s.to.id === p.id) patch.to = p;
        GO.store.set(patch);
        if (s.houseNext === 'continue') GO.router.go('/extras', { replace: true });
        else if (s.houseNext === 'to-return') GO.router.go('/offers/return', { replace: true });
        else GO.router.back();
      },
    },
  };

  GO.screens['offers-total'] = {
    overlay: true, base: sheetBase, sheetClass: 'sheet--bottom',
    render() {
      const c = sheetCtx();
      const legs = c.round ? ['out', 'ret'] : ['out'];
      const lines = legs.map(l => ({ l, q: api.legSearch(c.s, l), o: pickedOf(l) })).filter(x => x.o);
      if (!lines.length) return sheetHead('Price details') + '<div class="sheet__body"><p class="t-body c-secondary">Choose a ride first</p></div>' + sheetFoot('Close');
      const fee = c.data ? c.data.fee : 3.2;
      const refund = c.s.refund ? api.REFUND : 0;
      const sum = lines.reduce((a, x) => a + x.o.total, 0) + fee + refund;
      const line = x => {
        const qty = x.o.kind === 'private' ? '1 vehicle' : paxLabel(c.s) + (x.o.pax > 1 ? ' × ' + money(x.o.unit) : '');
        const head = c.round ? (x.l === 'out' ? 'Departure' : 'Return') + ', ' + fmtDay(x.q.date) : '';
        return '<div class="price-line"><dt>' + (head ? '<span class="t-label">' + head + '</span>' : '') + '<span class="t-body">' + shortTitle(x.o) + '</span><span class="t-caption c-tertiary">' + esc(qty) + '</span></dt><dd class="t-body">' + money2(x.o.total) + '</dd></div>';
      };
      return sheetHead('Price details', c.round ? routeLabel(api.legSearch(c.s, 'out')) + ' and back' : routeLabel(c.q) + ', ' + fmtDay(c.q.date)) +
        '<div class="sheet__body sheet__body--gap16">' +
          '<dl class="price-lines">' + lines.map(line).join('') +
            (refund ? '<div class="price-line"><dt class="t-body">100% money refund</dt><dd class="t-body">' + money2(refund) + '</dd></div>' : '') +
            '<div class="price-line"><dt class="t-body">Booking fee</dt><dd class="t-body">' + money2(fee) + '</dd></div>' +
            '<div class="price-line price-line--total"><dt class="t-label-lg">Total</dt><dd class="t-h3">' + money2(sum) + '</dd></div>' +
          '</dl>' +
          (c.round && lines.length < 2 ? '<p class="t-caption c-tertiary">The ' + (lines[0].l === 'out' ? 'return' : 'departure') + ' ride is added when you choose it</p>' : '') +
          '<p class="t-caption c-tertiary">Baggage, child seats and extras come on the next step</p>' +
        '</div>' + sheetFoot('Got it');
    },
    actions: closeAct,
  };
})();
</script>
<script>
// Extras — Streamline, New flow 06.10.2026: Flow 10 (1496:76165), Flow 12 filled (1496:77717), all luggage (1496:78050),
// voucher open / applied (1496:78726, 1496:79068); round trip 1504:3279. Flight sheet: Flow 11 (1496:76510, 1496:76878).
// One long page without a sticky button: the total with its breakdown sits at the end (decision 06.10.2026).
(function () {
  const u = GO.u;
  const { esc, fmtDay, fromMin } = u;
  const ic = GO.icon;
  const api = GO.api;

  const EMPTY_LUG = { trolley: 0, s20: 0, s32: 0, special: 0 };
  function ex() {
    const s = GO.store.get();
    return Object.assign({ lug: Object.assign({}, EMPTY_LUG), seats: null, nw: false, voucher: null, flights: { out: null, ret: null } }, s.ex);
  }
  function setEx(patch) { GO.store.set({ ex: Object.assign(ex(), patch) }); }

  function money2(n) { return n.toFixed(2) + ' €'; } // the sign after the price (user 17.11.2026)
  function money(n) { return (Number.isInteger(n) ? n : n.toFixed(2)) + ' €'; } // the sign after the price (user 17.11.2026)
  function paxLabel(s) {
    const a = s.adults + ' adult' + (s.adults > 1 ? 's' : '');
    return s.children ? a + ', ' + s.children + ' child' + (s.children > 1 ? 'ren' : '') : a;
  }
  function people(n) { return n + (n === 1 ? ' person' : ' people'); }
  function rides(n) { return n + (n === 1 ? ' ride' : ' rides'); }

  // ---------- booking: the picked offer of each leg ----------
  function legs(s) {
    const list = s.retDate && s.retTime ? ['out', 'ret'] : ['out'];
    return list.map(leg => {
      const q = api.legSearch(s, leg);
      if (!q.from || !q.to || !q.date || !q.time) return { leg, q, o: null };
      const data = api.offersNow(q);
      const sel = s.sel[leg];
      const all = data.shared.concat(data.priv, data.empty ? data.empty.alternatives : []);
      const o = sel.key === data.key ? all.find(x => x.id === sel.id && !x.soldOut) : null;
      return { leg, q, o: o || null };
    });
  }

  // ---------- price ----------
  function totals(s, e, L) {
    const pax = s.adults + s.children;
    const transfer = L.reduce((a, l) => a + l.o.total, 0);
    const lines = [{ label: (L.length > 1 ? 'Transfers, ' : 'Transfer, ') + rides(L.length) + ', ' + paxLabel(s), value: transfer }];
    if (e.nw) lines.push({ label: 'No Worries package, ' + people(pax), value: api.NO_WORRIES * pax });
    if (s.refund) lines.push({ label: '100% money refund', value: api.REFUND }); // chosen on Offers
    const charged = L.filter(l => l.o.kind !== 'private').length; // private rides carry luggage for free
    api.LUGGAGE.forEach(item => {
      const n = e.lug[item.id];
      if (n && charged) lines.push({ label: (n > 1 ? n + ' × ' : '') + item.total + ', ' + rides(charged), value: n * item.price * charged });
    });
    if (e.voucher) {
      const v = e.voucher;
      const off = v.kind === 'percent' ? Math.round(transfer * v.value) / 100 : Math.min(v.value, transfer);
      lines.push({ label: 'Promo code ' + v.code + ', ' + voucherText(v), value: -off, voucher: true });
    }
    lines.push({ label: 'Transaction fee', value: api.FEE });
    return { lines, total: lines.reduce((a, l) => a + l.value, 0) };
  }
  function voucherText(v) { return v.kind === 'percent' ? v.value + '% off transfers' : money(v.value) + ' off'; }

  // ---------- pieces ----------
  function placeName(p) { return p.type === 'airport' ? api.shortName(p) : (p.city || p.name); }

  // name: what the buttons say to a screen reader (the full "Baggage up to 10 kg", the row shows "Up to 10 kg");
  // pre: the id prefix, so the rows on the page and in the sheet over it don't share ids
  function stepper(id, label, desc, value, icon, name, pre) {
    const lid = (pre || 'lug-') + id;
    const [dtext, price] = Array.isArray(desc) ? desc : [desc, ''];
    // in the sheet the icons are 32 (Anya 16.11.2026), on the page 20
    return '<div class="lug-row">' + ic(icon, pre === 'lugs-' ? 32 : 20) +
      '<div class="lug-row__stepper" role="group" aria-labelledby="' + lid + '">' +
        '<div class="lug-row__text"><span id="' + lid + '" class="t-body">' + label + '</span><span class="t-body-sm c-tertiary">' + dtext + '</span></div>' +
        (price ? '<span class="lug-row__price t-label">' + price + '</span>' : '') +
        '<span class="stepper stepper--tight">' +
          '<button class="stepper__btn" data-act="lug" data-id="' + id + '" data-d="-1" aria-label="Fewer: ' + esc(name || label) + '"' + (value <= 0 ? ' disabled' : '') + '>' + ic('minus', 20) + '</button>' +
          '<span class="stepper__value t-label-lg" aria-live="polite">' + value + '</span>' +
          '<button class="stepper__btn" data-act="lug" data-id="' + id + '" data-d="1" aria-label="More: ' + esc(name || label) + '"' + (value >= 9 ? ' disabled' : '') + '>' + ic('plus', 20) + '</button>' +
        '</span>' +
      '</div></div>';
  }

  // Luggage: half open on the page (Phil 03.11.2026, as Anya's frame); the word "baggage" as on goopti.com (user 03.11.2026): the title, the intro, the two common sizes with
  // steppers and "More baggage options" into the sheet with all four. A bigger size picked in the sheet stays on the page.
  // Was one row like "Add your flight" with everything in the sheet (user 02.11.2026)
  function lugFree(L) { return L.every(l => l.o.kind === 'private'); }
  function lugIntro(free) {
    // without "Add luggage now to ensure there is enough space", the "Add" went into the title (user 03.11.2026)
    return free ? 'Free on your private ride' : 'One 5kg item included for free';
  }
  // v5: "Max 55×40×23 cm, €1", the special item says what it is ("Skis, bike, up to 32 kg, €27")
  // the price in its own column before the stepper (user 17.11.2026): [description, price]
  function lugDesc(item, L) { return [item.note ? esc(item.note) : 'Max <span class="nowrap">' + item.size + '</span>', lugFree(L) ? 'included' : item.price + ' €']; }
  const LUG_OPEN = ['trolley', 's20'];
  function luggage(e, L) {
    if (GO.extrasBaggage() === 3) return luggageV5(e, L);
    if (GO.extrasBaggage() === 2) return luggageRow(e, L);
    const rows = api.LUGGAGE.filter(i => LUG_OPEN.includes(i.id) || e.lug[i.id]);
    return '<section class="ex-card lug" aria-labelledby="lug-title">' +
      '<div class="lug__head"><h2 id="lug-title" class="t-label-lg">Baggage</h2><p class="t-body-sm c-secondary">' + lugIntro(lugFree(L)) + '</p></div>' +
      '<div class="lug__list">' + rows.map(i => stepper(i.id, i.label, lugDesc(i, L), e.lug[i.id], i.icon, i.total)).join('<hr class="lug__divider">') + '</div>' +
      (rows.length < api.LUGGAGE.length ? '<button class="link t-label lug__more" data-act="luggage">More baggage options</button>' : '') +
    '</section>';
  }

  // Baggage 2 in the 9:41 menu: one row like "Add your flight", the steppers in the sheet (user 02.11.2026)
  function luggageRow(e, L) {
    const n = api.LUGGAGE.reduce((a, i) => a + e.lug[i.id], 0);
    const sub = n ? n + (n === 1 ? ' item added' : ' items added') : lugIntro(lugFree(L));
    return '<section class="ex-card" aria-label="Baggage"><button class="flight-add" data-act="luggage">' +
      '<span class="flight-row__text">' +
        '<span class="flight-row__title t-h3">' + ic('luggage', 20) + '<span>' + 'Baggage' + '</span></span>' +
        '<span class="t-body-sm c-tertiary">' + sub + '</span>' +
      '</span>' + ic('chevron-right', 20) + '</button></section>';
  }

  // v5: one white bordered card, the whole card a button with a chevron, like "Add your flight" and Child seat (user 06.11.2026;
  // was the design's 679:1428 row with the pink "Add bag" link); once something is added the items stand under the title
  // v6 (Mobile 09.11.2026 3249:10509): Baggage and Child seat end in "+" in a grey circle 36 instead of the chevron
  function lineCard(label, act, icon, title, sub, plus) {
    return '<section class="ex-card ex-card--line" aria-label="' + label + '"><button class="flight-add" data-act="' + act + '">' +
      '<span class="flight-row__text">' +
        '<span class="flight-row__title t-h3">' + ic(icon, 20) + '<span>' + title + '</span></span>' +
        (sub ? '<span class="t-body-sm c-secondary flight-add__sub">' + sub + '</span>' : '') +
      // plus: "+" in the grey circle, or "edit" - a black pencil once something is added (Anya 16.11.2026)
      '</span>' + (plus ? '<span class="add-circle" aria-hidden="true">' + ic(plus === 'edit' ? 'edit' : plus === 'chevron' ? 'chevron-right' : 'plus', 20) + '</span>' : ic('chevron-right', 20)) + '</button></section>';
  }
  function luggageV5(e, L) {
    const added = api.LUGGAGE.filter(i => e.lug[i.id]).map(i => e.lug[i.id] + '× ' + i.label);
    if (added.length) { const s = GO.store.get(); added.unshift((s.adults + s.children) + '× Personal item, 5 kg'); } // the free item first, one per person (user 17.11.2026)
    if (!added.length && e.noBag) added.push('Only ' + (GO.store.get().adults + GO.store.get().children) + '× Personal item, 5 kg');
    // v6 (Mobile 09.11.2026, user 09.11.2026): always "Baggage" with "+"; empty - what goes for free, "Only a personal item up to 5 kg"
    // (v5: "Add baggage" / "One personal item up to 5 kg for free"); chosen - the items
    const some = api.LUGGAGE.some(i => e.lug[i.id]);
    return lineCard(some ? 'Change baggage' : 'Add baggage', 'luggage', 'luggage', some ? 'Baggage' : 'Add baggage', added.length ? added.map(esc).join(', ') : 'Only ' + (GO.store.get().adults + GO.store.get().children) + '× Personal item, 5 kg', 'chevron'); // right arrow in the grey circle, with baggage added too (user 17.11.2026)
  }

  // Child seat: one row like luggage and "Add your flight", the sheet as before (user 03.11.2026; a card with "+ Add" /
  // "2 seats added" on the right since Card/Child seats 2490:32525 / 2490:32018). Only with children.
  function seatCount(e) { return e.seats ? Object.values(e.seats.n).reduce((a, b) => a + b, 0) : 0; }
  // the choice belongs to the number of children it was made for: after Edit search with other children it is asked again
  function seatsDone(s, e) { return !s.children || !!(e.seats && e.seats.kids === s.children); }
  function childSeats(s, e) {
    if (!s.children) return '';
    const n = seatCount(e), done = seatsDone(s, e);
    // v5: the same card as Baggage and the flight, a chevron on the right (user 06.11.2026; was the design's 679:1437 row with "Select type")
    // empty: "Add child seat" / "Free for every child" (user 06.11.2026); chosen: "Child seat" and the count
    // v6 (Mobile 09.11.2026, user 09.11.2026): always "Child seat" with "+", "No seat needed" until seats are added (v5: "Add child seat" / "Free for every child")
    if (GO.extrasBaggage() === 3) return lineCard(n ? 'Change child seats' : 'Add child seat', 'seats', 'seat-card', 'Child seat', n ? n + (n === 1 ? ' seat added' : ' seats added') : 'No seat needed', n ? 'edit' : true);
    const sub = !done ? 'Free for every child' : n ? n + (n === 1 ? ' seat added' : ' seats added') : 'No seat needed';
    // variants page (04.11.2026): a link like "Add other passengers" on the payment page, the caption under it, no card, icon or chevron
    if (window.GO_SEED && GO_SEED.seatLink) return '<div class="seat-link"><button type="button" class="link t-body-sm seat-link__btn" data-act="seats">' + (done ? 'Child seat' : 'Add child seat') + '</button>' +
      '<span class="t-body-sm c-tertiary">' + sub + '</span></div>';
    return '<section class="ex-card" aria-label="Child seat"><button class="flight-add" data-act="seats">' +
      '<span class="flight-row__text">' +
        '<span class="flight-row__title t-h3">' + (window.GO_SEED && GO_SEED.seatNoIcon ? '' : ic('seat-card', 20)) + '<span>' + (done ? 'Child seat' : 'Add child seat') + '</span></span>' +
        '<span class="t-body-sm c-tertiary">' + sub + '</span>' +
      '</span>' + ic('chevron-right', 20) + '</button></section>';
  }

  // Legs that touch an airport: the flight that leaves after the drop-off, or the one that lands before the pick-up
  function flightLegs(L) {
    return L.map(l => {
      if (l.q.to.type === 'airport') return { leg: l.leg, airport: l.q.to, kind: 'dep', date: l.q.date };
      if (l.q.from.type === 'airport') return { leg: l.leg, airport: l.q.from, kind: 'arr', date: l.q.date };
      return null;
    }).filter(Boolean);
  }

  // ---------- flight verdicts (Streamline 14.10, Flight verdicts - C 2567:10496) ----------
  // ok: green with a check, warn: amber triangle, error: red no-entry sign ("very little time"), early: black question (over 3h 30m).
  // Icons and colours as in Anya's desktop (21.10.2026). Thresholds between the layout examples are ours.
  function verdict(f, fl, l) {
    const change = 'data-act="flight-time" data-leg="' + fl.leg + '"';
    const link = text => '<button class="link link--inline" ' + change + '>' + text + '</button>';
    if (fl.kind === 'dep') {
      const gap = f.dep - l.o.arrival;
      // zones and wording as the time sheet (user 17.11.2026); the action links to the time, "Great!" is plain text
      const z = window.GO_dropZone(gap);
      return { level: z.level, icon: z.emoji, html: esc(z.text) + (z.level === 'ok' ? ' ' + z.action : ''),
        action: z.level === 'ok' ? '' : '<button class="link t-label verdict__action" ' + change + (z.preset ? ' data-preset="1"' : '') + '>' + z.action + '</button>' };
    }
    // landing after midnight: the transport date is easy to get wrong
    if (f.arr < 240) {
      const a = fmtDay(u.addDays(fl.date, -1)).split(' '), b = fmtDay(fl.date);
      const first = a[2] === b.split(' ')[2] ? a.slice(0, 2).join(' ') : a.join(' ');
      return { level: 'warn', html: 'Night between <b>' + esc(first) + '</b> and <b>' + esc(b) + '</b>. Don’t forget to ' + link('double-check the selected date') + ' of your transport.' };
    }
    const gap = l.o.pickFrom - f.arr;
    // zones as Anya's (23.10.2026): 45m and more fine, 30m tight, less too short
    if (gap >= 45) return { level: 'ok', html: 'Your pick-up time is ' + u.fmtDur(gap) + ' after the flight’s landing' };
    if (gap >= 30) return { level: 'warn', html: 'Your pick-up time is <b>' + u.fmtDur(gap) + '</b> after the flight’s landing, ' + link('consider changing it') };
    if (gap >= 0) return { level: 'error', html: 'Your pick-up time is only <b>' + u.fmtDur(gap) + '</b> after the flight’s landing, ' + link('consider changing it') };
    return { level: 'error', html: 'Your pick-up time is <b>' + u.fmtDur(-gap) + '</b> before the flight’s landing, ' + link('consider changing it') };
  }

  // Filled flight: "EZY5832, Thu 15 Oct 12:25" / "Venice → London Gatwick", Change on the right, the verdict below
  function flightRow(f, fl, l) {
    const v = verdict(f, fl, l);
    const here = fl.airport.city || api.shortName(fl.airport);
    const title = f.code + ', ' + fmtDay(v.date || fl.date) + ' ' + fromMin(fl.kind === 'dep' ? f.dep : f.arr);
    return '<div class="flight-row">' +
      // the flight itself with a chevron changes the flight; links in the verdict change the ride's date and time (Phil, 20.10.2026)
      '<button class="flight-add" data-act="flight" data-leg="' + fl.leg + '" aria-label="Change flight ' + esc(f.code) + ', ' + esc(title.slice(f.code.length + 2)) + '">' +
        '<span class="flight-row__text">' +
          '<span class="flight-row__title t-label-lg">' + ic(fl.kind === 'dep' ? 'flight-takeoff' : 'flight-land', 20) + '<span>' + esc(title) + '</span></span>' +
          '<span class="t-body-sm c-tertiary">' + esc(fl.kind === 'dep' ? GO.withCode(here, fl.airport.id) + ' → ' + GO.withCode(f.city) : GO.withCode(f.city) + ' → ' + GO.withCode(here, fl.airport.id)) + '</span>' +
        '</span>' + '<span class="add-circle" aria-hidden="true">' + ic('chevron-right', 20) + '</span>' + // in a grey circle as "Check your flight" (16.11.2026)
      '</button>' +
      // verdicts are coloured text alone, the fine one too (user 12.11.2026: no icons, cleaner; the green check went the same day)
      '<div class="verdict verdict--' + v.level + ' t-body-sm">' + (v.icon ? '<span class="verdict__icon" aria-hidden="true">' + ic(v.icon, 22) + '</span>' : '') +

      lug(el) {

      'flight-time'(el) { GO.presetDrop = !!el.dataset.preset; GO.router.go(el.dataset.leg === 'ret' ? '/extras/return/when' : '/extras/when'); },
      'voucher-remove'() { setEx({ voucher: null }); refreshKeep('#voucher-code'); },

  // Re-render in place and keep the focus where the person was (steppers, voucher field)
  function refreshKeep(sel, fallback) {
    GO.router.refresh();

  // ---------- sheet: your flight ----------
  let fq = '', fTimer = null, fReq = 0;

  function flightCtx() {
    const s = GO.store.get();
    const F = flightLegs(legs(s).filter(l => l.o));
    return { s, fl: F.find(f => f.leg === s.flightLeg) || F[0] };
  }

  function flightResults(list, fl) {
    if (!fq.trim()) {
      return '<p class="t-body-sm c-secondary">Can’t find it, or flying charter?</p>' +
        '<button class="link t-label flight-manual" data-act="flight-manual">Enter flight details yourself</button>';

    if (!list) return '<div class="place-list__status"><span class="spinner" aria-hidden="true"></span><span class="t-body-sm">Looking for flights…</span></div>';
    if (!list.length) {
      return '<p class="t-body-sm c-secondary">No flights like “' + esc(fq) + '” on ' + fmtDay(fl.date) + '</p>' +
        '<button class="link t-label flight-manual" data-act="flight-manual">Enter flight details yourself</button>';
    }
    const manual = '<p class="t-body-sm c-secondary flight-manual-note">Not your flight? <button class="link link--inline" data-act="flight-manual">Enter flight details yourself</button></p>';
    return '<ul class="place-list" role="listbox" aria-label="Flights">' + list.map((f, i) =>
      '<li><button class="place-option" role="option" data-act="flight-pick" data-i="' + i + '">' +
        '<span class="place-option__icon">' + ic(fl.kind === 'dep' ? 'flight-takeoff' : 'flight-land', 20) + '</span>' +
        '<span class="place-option__text"><span class="place-option__name">' + esc(f.code + (f.airline ? ', ' + f.airline : '')) + '</span>' +
        '<span class="place-option__detail">' + esc(fl.kind === 'dep' ? 'To ' + f.city + ', departs ' + fromMin(f.dep) : 'From ' + f.city + ', lands ' + fromMin(f.arr)) + '</span></span>' +
      '</button></li>').join('') + '</ul>' + manual;
  }

  // demo flights fit the ride: out leaves 2h 30m after the drop-off (green), back lands 30m before the pick-up starts (amber)
  function pinFor(s, fl) {
    const l = legs(s).find(x => x.leg === fl.leg);
    if (!l || !l.o) return null;
    return fl.kind === 'dep'
      ? { code: 'EZY5832', at: Math.min(Math.round((l.o.arrival + 150) / 5) * 5, 1435) }
      : { code: 'EZY5833', at: l.o.pickFrom - 30 };
  }
  function saveFlight(f) {
    const { fl } = flightCtx();
    const flights = Object.assign({}, ex().flights);
    flights[fl.leg] = f;
    setEx({ flights });
    GO.router.back();

  let lastList = null;

        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">' + (fl.leg === 'ret' ? 'Your return flight' : 'Add your flight') + '</h2></div>' +

              // with a flight entered the x removes it in one click (user 17.11.2026)
              '<button class="field__clear" data-act="flight-clear" aria-label="' + (cur ? 'Remove this flight' : 'Clear') + '"' + (fq || cur ? '' : ' hidden') + '>' + ic('clear', 20) + '</button>' +

        root.querySelector('[data-act=flight-clear]').hidden = !fq && !ex().flights[fl.leg];

        api.flights(fl.airport, fl.date, fl.kind, fq, pinFor(s, fl)).then(list => {
          if (id !== fReq) return;
          lastList = list;
          root.querySelector('#flight-results').innerHTML = flightResults(list, fl);
        });
      };
      input.addEventListener('input', () => { fq = input.value; clearTimeout(fTimer); fTimer = setTimeout(run, 150); });
      if (fq) run();
    },
    actions: {
      close: () => GO.router.back(),
      'flight-clear'() {
        const { fl } = flightCtx();
        if (ex().flights[fl.leg]) { const flights = Object.assign({}, ex().flights); flights[fl.leg] = null; setEx({ flights }); return GO.router.back(); }
        const i = document.querySelector('#flight-q'); i.value = ''; i.dispatchEvent(new Event('input')); i.focus(); },
      'flight-pick'(el) {
        const f = lastList && lastList[+el.dataset.i];

      },
      'flight-remove'() {

        setEx({ flights });
        GO.router.back();
      },
      // its own sheet with the typed number carried over (2297:17803); replaces the search, so Save or the cross land on Extras

  function manualSelect(id, value, options, label, placeholder) {

    mount(root) {

        form.querySelectorAll('select').forEach(sel => sel.classList.toggle('is-empty', sel.value === ''));

      form.addEventListener('input', sync);

        const next = { 'mf-code': 'mf-city', 'mf-city': 'mf-h' }[ev.target.id];

  // Labels above the fields, Save once the company name and address are there; VAT is optional.
  const INV_FIELDS = [
    ['company', 'Company name', 'e.g. Alpe Tours d.o.o.', 'autocomplete="organization"'],
    ['address', 'Company address', 'Street, city, postcode', 'autocomplete="street-address"'],
    ['vat', 'VAT number', 'e.g. SI12345678', 'autocomplete="off" autocapitalize="characters" spellcheck="false"'],
  ];
  function invError(input, msg) {
    const f = input.closest('.form-field'), box = f.querySelector('.field');
    box.classList.toggle('field--error', !!msg);
    let p = f.querySelector('.field-error');
    if (!msg) { if (p) p.remove(); input.removeAttribute('aria-invalid'); return; }
    if (!p) { p = document.createElement('p'); p.className = 't-body-sm field-error'; p.id = input.id + '-err'; p.setAttribute('role', 'alert'); box.after(p); }
    p.textContent = msg;
    input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', p.id);
  }
  const invReady = form => ['company', 'address'].every(k => form.querySelector('[name=' + k + ']').value.trim());
  GO.screens['extras-invoice'] = GO.screens['details-invoice'] = {

        '</form>' +

  let seatDraft = null;

  function seatsFooter(s) {

    const n = Math.max(left, 1);

    return (err ? '<div id="seat-err" class="hint seats-hint" role="alert" style="--hint-bg:var(--gauge-warn-bg);">' + /* no 👶 (Anya 16.11.2026) */

  }
  GO.screens['extras-seats'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render(s) {
      const e = ex();
      const done = seatsDone(s, e);
      seatDraft = { n: Object.assign({ infant: 0, baby: 0, child: 0, booster: 0 }, done && e.seats.n), ok: !!(done && e.seats.ok) };
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Child seats</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<p class="t-body c-secondary">Free for every child.<br>Choose by your child’s weight.</p>' +
          // dividers between the seats as in Baggage (Anya 16.11.2026)
          '<div class="seat-list">' + api.SEATS.map(i => seatRow(i, s)).join('<hr class="lug__divider">') + '</div>' +
        '</div>' +
        '<div class="cta-bar seats-footer">' + seatsFooter(s) + '</div>';
    },
    mount(root) {
      root.addEventListener('change', ev => {
        if (!ev.target.hasAttribute('data-seat-ok')) return;
        seatDraft.ok = ev.target.checked;
        const foot = root.querySelector('.seats-footer');
        foot.innerHTML = seatsFooter(GO.store.get());
        foot.querySelector('[data-seat-ok]').focus();
      });
    },
    actions: {
      close() { seatsRequired = false; GO.router.back(); },
      seat(el) {
        const s = GO.store.get();
        const id = el.dataset.id, d = +el.dataset.d;
        if (d > 0 && seatsLeft(s) <= 0) return;
        seatDraft.n[id] = Math.max(0, seatDraft.n[id] + d);
        seatDraft.ok = false; // the consent names a number of children, a new count needs a new tick
        const sheet = document.querySelector('.sheet');
        sheet.querySelector('.seat-list').innerHTML = api.SEATS.map(i => seatRow(i, s)).join('<hr class="lug__divider">');
        sheet.querySelector('.seats-footer').innerHTML = seatsFooter(s);
        // keep the focus on the pressed button, or on its pair when it got disabled
        const same = sheet.querySelector('[data-act=seat][data-id=' + id + '][data-d="' + d + '"]');
        (same && !same.disabled ? same : sheet.querySelector('[data-act=seat][data-id=' + id + '][data-d="' + (-d) + '"]')).focus();
      },
      'seats-save'() {
        const s = GO.store.get();
        setEx({ seats: { n: Object.assign({}, seatDraft.n), ok: seatsLeft(s) > 0 && seatDraft.ok, kids: s.children } });
        if (seatsRequired) { seatsRequired = false; return GO.router.go('/details', { replace: true }); }
        GO.router.back();
        setTimeout(() => { const b = document.querySelector('[data-act=seats]'); if (b) b.focus({ preventScroll: true }); }, 50);
      },
    },
  };

  // ---------- sheet: luggage (user 02.11.2026): the steppers on a draft, Save keeps it, the cross drops it ----------
  let lugDraft = null, lugRequired = false;
  const lugDone = e => !!e.noBag || Object.values(e.lug).some(Boolean);
  // asked from Continue: the sheet's Continue waits for a bag or the tick
  // no checkbox since 06.11.2026 (client): Continue with nothing added means only the free personal item
  const lugBlocked = () => false;
  function lugButton() {
    const b = document.querySelector('.sheet [data-act=lug-save]');
    if (b) b.disabled = lugBlocked();
  }
  function lugList(L) {
    return api.LUGGAGE.map(item => stepper(item.id, item.label, lugDesc(item, L), lugDraft[item.id], item.icon, item.total, 'lugs-')).join('<hr class="lug__divider">');
  }
  // the terms in full, after the client's "Add baggage" popup on goopti.com (user 03.11.2026): the free item with its size,
  // then the yellow plate (the person has to act: declare it now). Private: no fees, so only the short promise
  function lugTerms(free) {
    if (free) return '<p class="t-body c-secondary">Your private ride carries your baggage at no extra cost. Add it so the driver knows.</p>';
    return '<p class="t-body c-secondary">Each passenger can take <b class="c-primary">one personal item up to 5 kg</b> for free, max <span class="nowrap">40×20×25 cm</span></p>' +
      '<p class="lug__terms t-body-sm">We can only take extra baggage you add when booking. Undeclared baggage is charged up to €27, or we may not be able to take it. Mind the maximum sizes.</p>';
  }
  GO.screens['extras-luggage'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render(s) {
      const L = legs(s);
      lugDraft = Object.assign({}, ex().lug);
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Baggage</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          lugTerms(lugFree(L)) +
          // v5 had "I only have a personal item up to 5 kg" with a checkbox here (685:469); removed by the client 06.11.2026
          '<div class="lug__list">' + lugList(L) + '</div>' +
        '</div>' +
        // Continue (v5; was Save): keeps the choice and goes back to Add-ons
        '<div class="cta-bar"><button class="btn btn--primary" data-act="lug-save"' + (lugBlocked() ? ' disabled' : '') + '>Confirm</button></div>'; // Confirm, as the invoice sheet (user 17.11.2026)
    },
    actions: {
      // closing the sheet that Continue opened counts as "no baggage": the next Continue goes on (user 17.11.2026)
      close() { if (lugRequired && !lugDone(ex())) setEx({ noBag: true }); lugRequired = false; GO.router.back(); },
      lug(el) {
        const id = el.dataset.id, d = +el.dataset.d;
        lugDraft[id] = Math.max(0, Math.min(9, lugDraft[id] + d));
        const sheet = document.querySelector('.sheet');
        sheet.querySelector('.lug__list').innerHTML = lugList(legs(GO.store.get()));
        lugButton();
        // keep the focus on the pressed button, or on its pair when it got disabled
        const same = sheet.querySelector('[data-act=lug][data-id=' + id + '][data-d="' + d + '"]');
        (same && !same.disabled ? same : sheet.querySelector('[data-act=lug][data-id=' + id + '][data-d="' + (-d) + '"]')).focus();
      },
      'lug-save'() {
        setEx({ lug: Object.assign({}, lugDraft), noBag: !Object.values(lugDraft).some(Boolean) });
        // asked from Continue: back to Add-ons, never straight on (user 17.11.2026); the next Continue goes to the passengers
        lugRequired = false;
        GO.router.back();
        setTimeout(() => { const b = document.querySelector('.extras [data-act=luggage]') || document.querySelector('.extras [data-act=lug]'); if (b) b.focus({ preventScroll: true }); }, 50);
      },
    },
  };

  // ---------- sheet: price details from the bar (as details-total) ----------
  GO.screens['extras-total'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render(s) {
      const L = legs(s);
      const T = L.length && !L.some(l => !l.o) ? totals(s, ex(), L) : { lines: [], total: 0 };
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Price details</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body">' +
          '<dl class="price-lines">' + T.lines.map(l =>
            '<div class="price-line"><dt class="t-body">' + esc(l.label) + '</dt><dd class="t-body">' + (l.value < 0 ? '−' : '') + money2(Math.abs(l.value)) + '</dd></div>').join('') +
            '<div class="price-line price-line--total"><dt class="t-label-lg">Total</dt><dd class="t-h3">' + money2(T.total) + '</dd></div>' +
          '</dl>' +
        '</div>' +
        '<div class="cta-bar"><button class="btn btn--secondary" data-act="close">Got it</button></div>';
    },
    actions: { close: () => GO.router.back() },
  };

  // ---------- sheet: No Worries, find out more (Flow 10 - Extras - sheet - No Worries details, 2264:126988) ----------
  const NW_COVER = [
    ['What if you miss your flight because of traffic jams, extreme weather or bad road conditions?', 'We provide a new flight ticket and, if needed, a hotel room at our cost'],
    ['What if the airline reschedules your flight?', 'We arrange a new GoOpti transfer for free'],
    ['What about delayed or rerouted flights?', 'We find a free replacement transfer'],
    ['How do you let us know you missed your flight or need a new transfer?', 'Your confirmation email has our contact details. In any of these cases, call us as soon as possible.'],
  ];
  GO.screens['extras-no-worries'] = {
    overlay: true, base: 'extras', sheetClass: 'sheet--bottom',
    render(s) {
      const e = ex();
      // per person on the button, as on the card (user 12.11.2026; was the total for everyone)
      const price = money(api.NO_WORRIES) + ' per person'; // whole euros as on the card (16.11.2026)
      return '<div class="sheet-handle" aria-hidden="true"></div>' +
        '<header class="sheet-header"><div class="sheet-header__titles"><h2 id="sheet-title" class="t-h1">Absolutely No Worries package</h2></div>' +
        '<button class="icon-btn" data-act="close" aria-label="Close">' + ic('close', 24) + '</button></header>' +
        '<div class="sheet__body sheet__body--gap16">' +
          '<h3 class="t-h3">What does the package cover?</h3>' +
          '<ul class="nw-cover">' + NW_COVER.map(([q, a]) => '<li class="nw-cover__item">' + ic('check-circle', 20, 'icon--success') +
            '<span class="nw-cover__text"><span class="t-body-sm c-secondary">' + q + '</span><span class="t-label">' + a + '</span></span></li>').join('') + '</ul>' +
          '<button class="link t-label nw-terms" data-act="nw-terms">Terms and conditions of service</button>' +
        '</div>' +
        // Add: primary, as in the frame; once added there is no button, the cross closes the sheet (user 12.11.2026; was Got it)
        (e.nw ? '' : '<div class="cta-bar"><button class="btn btn--primary" data-act="nw-sheet">Add for ' + price + '</button></div>');
    },
    actions: {
      close: () => GO.router.back(),
      'nw-sheet'() { if (!ex().nw) setEx({ nw: true }); GO.router.back(); },
      'nw-terms': () => u.toast('Terms open in a new tab on the real site'),
    },
  };
})();
</script>
<script>
// Details — Streamline, New flow 06.10.2026: Flow 13 one-way 1496:79390 / 79465 (filled) / 79540 (invoice open),
// round trip 1504:4492. Labels sit inside the fields (placeholders), each field also has a hidden <label>.
// Copy follows the round-trip frames (newer); the email placeholder "Email for ticket and receipt" since 02.11.2026 (shorter from 03.11.2026, fits 320). The invoice moved to Extras (20.10.2026).
(function () {
  const u = GO.u;
  const { esc } = u;
  const ic = GO.icon;
  const B = GO.booking;

  // Phone prefix: Slovenia first (half of the users), then Italy, Croatia, neighbours and the usual tourists
  const COUNTRIES = [
    ['si', 'Slovenia', '386'], ['it', 'Italy', '39'], ['hr', 'Croatia', '385'], ['at', 'Austria', '43'],
    ['de', 'Germany', '49'], ['ch', 'Switzerland', '41'], ['hu', 'Hungary', '36'], ['ba', 'Bosnia and Herzegovina', '387'],
    ['mk', 'North Macedonia', '389'], ['cz', 'Czechia', '420'], ['sk', 'Slovakia', '421'], ['pl', 'Poland', '48'],
    ['fr', 'France', '33'], ['be', 'Belgium', '32'], ['nl', 'Netherlands', '31'], ['ie', 'Ireland', '353'],
    ['gb', 'United Kingdom', '44'], ['us', 'United States', '1'],
  ];
  GO.COUNTRY_CODES = Object.fromEntries(COUNTRIES.map(c => [c[0], c[2]]));
  const country = code => COUNTRIES.find(c => c[0] === code) || COUNTRIES[0];

  const EMPTY = { first: '', last: '', email: '', cc: 'si', phone: '' };
  function contact() { return Object.assign({}, EMPTY, GO.store.get().contact); }
  function setContact(patch) { GO.store.set({ contact: Object.assign(contact(), patch) }); }

  // ---------- validation ----------
  // Errors appear after Continue, or when a touched field is left; typing a valid value clears them on the spot.
  let errors = {};
  let tried = false;

  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function check(c, key) {
    const v = (c[key] || '').trim();
    switch (key) {
      case 'first': return v ? '' : 'Enter your first name';
      case 'last': return v ? '' : 'Enter your last name';
      case 'email': return !v ? 'Enter your email' : EMAIL.test(v) ? '' : 'Check the email, it should look like name@example.com';
      case 'phone': {
        const d = v.replace(/\D/g, '').replace(/^0+/, '');
        return !d ? 'Enter your mobile number' : d.length < 6 || d.length > 12 ? 'Check the number, it looks too ' + (d.length < 6 ? 'short' : 'long') : '';
      }
      default: return '';
    }
  }
  const KEYS = ['first', 'last', 'email', 'phone'];

  // ---------- pieces ----------
  function errText(key) {
    return errors[key] ? '<p id="' + key + '-err" class="t-body-sm field-error">' + esc(errors[key]) + '</p>' : '';
  }
  function describedBy(key, helper) {
    const ids = [errors[key] ? key + '-err' : '', helper ? key + '-help' : ''].filter(Boolean).join(' ');
    return ids ? ' aria-describedby="' + ids + '"' : '';
  }

  function input(key, label, c, attrs, helper) {
    return '<div class="form-field">' +
      '<label class="sr-only" for="f-' + key + '">' + label + '</label>' +
      '<div class="field' + (errors[key] ? ' field--error' : '') + '">' +
        '<input id="f-' + key + '" name="' + key + '" placeholder="' + label + '" value="' + esc(c[key]) + '" ' + attrs +
        (errors[key] ? ' aria-invalid="true"' : '') + describedBy(key, helper) + '>' +
      '</div>' +
      errText(key) +
      (helper ? '<p id="' + key + '-help" class="t-body-sm c-secondary">' + helper + '</p>' : '') +
    '</div>';
  }

  // First and last name in one block with a divider; each half keeps its own hidden label and error
  function names(c) {
    const half = (key, label, ac) => '<label class="sr-only" for="f-' + key + '">' + label + '</label>' +
      '<input id="f-' + key + '" name="' + key + '" placeholder="' + label + '" value="' + esc(c[key]) + '" autocomplete="' + ac + '" autocapitalize="words" enterkeyhint="next"' +
      (errors[key] ? ' aria-invalid="true"' : '') + describedBy(key) + '>';
    return '<div class="form-field">' +
      '<div class="field field--names' + (errors.first || errors.last ? ' field--error' : '') + '">' +
        half('first', 'First name', 'given-name') + '<span class="field__divider" aria-hidden="true"></span>' + half('last', 'Last name', 'family-name') +
      '</div>' +
      // each error under its own half (Anya 16.11.2026; the last name's went under the first name on a second line)
      (errors.first || errors.last ? '<div class="names-errors"><div>' + errText('first') + '</div><div>' + errText('last') + '</div></div>' : '') +
    '</div>';
  }

  // The country code stands before the number as fixed text: only the number is typed, the code changes only through
  // the list with flags (user 22.10.2026). A number typed or pasted with +386 / 00386 moves its code into the list.
  const codeText = (cur, key) => '<span class="phone-cc__code t-body" aria-hidden="true" data-code' + (key ? '="' + key + '"' : '') + '>+' + cur[2] + '</span>';
  function splitIntl(v) {
    const m = v.match(/^\s*(?:\+|00)(\d+)/);
    if (!m) return null;
    const k = COUNTRIES.filter(c => m[1].startsWith(c[2])).sort((a, b) => b[2].length - a[2].length)[0];
    if (!k) return null;
    return { cc: k[0], rest: v.replace(/^\s*(?:\+|00)/, '').slice(k[2].length).replace(/^[\s-]+/, '') };
  }
  // run on every input of a phone field: returns the new country (or null) after moving the code out of the value
  function takeCode(input, select, flag, code) {
    const r = splitIntl(input.value);
    if (!r) return null;
    input.value = r.rest;
    select.value = r.cc;
    flag.innerHTML = GO.FLAGS[r.cc];
    code.textContent = '+' + country(r.cc)[2];
    return r.cc;
  }
  function phone(c) {
    const cur = country(c.cc);
    return '<div class="form-field">' +
      '<div class="field field--phone' + (errors.phone ? ' field--error' : '') + '">' +
        '<span class="phone-cc">' +
          '<span class="phone-cc__flag" data-flag>' + GO.FLAGS[cur[0]] + '</span>' + ic('chevron-down', 16) +
          '<select id="f-cc" name="cc" aria-label="Country code" autocomplete="tel-country-code">' +
            COUNTRIES.map(k => '<option value="' + k[0] + '"' + (k[0] === cur[0] ? ' selected' : '') + '>' + esc(k[1]) + ' +' + k[2] + '</option>').join('') +
          '</select>' +
        '</span>' + codeText(cur) +
        '<label class="sr-only" for="f-phone">Mobile number</label>' +
        '<input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" enterkeyhint="next" placeholder="41 234 567" value="' + esc(c.phone) + '"' +
          (errors.phone ? ' aria-invalid="true"' : '') + describedBy('phone') + '>' +
      '</div>' +
      errText('phone') + // no helper under the phone since 02.11.2026 (user)
    '</div>';
  }

  // Google, Facebook and email in one row (user 29.10.2026), no caption under them.
  // Three across don't fit with the icon on the left even at 375, so the icon is above the name.
  // "Or continue with" muted and centred, small grey text (Phil 30.10.2026; was label-lg on the left).
  // Since 02.11.2026 (user, as Airbnb's "or"): no grey plate, the caption is a divider with lines on both sides, "or continue with".
  function account() {
    // v5 (Presentations New 05.11 679:1299): on top of the page, "Sign in with" over the three grey buttons, the divider
    // "or book as Guest" under them leads to the fields (was under the fields with "or Register/Log in" on top, 05.11.2026)
    return '<section class="account" aria-labelledby="acc-title">' +
      // v6 (Mobile 09.11.2026, user 09.11.2026): no visible "Sign in with", the buttons right under the title; white, outlined
      // one row under the title (user 17.11.2026): "Booked with us before?" left, a round Google and a pill Log in right; no "or book as Guest"
      '<div class="account__bar">' +
        '<h2 id="acc-title" class="account__ask t-body c-secondary">Booked with us before?</h2>' +
        '<div class="account__acts">' +
          // Google as a pill with the logo and "Log in" too (user 17.11.2026; was the logo alone in a circle)
          '<button class="account__login t-label" data-act="login">' + ic('mail', 16) + 'Log in</button>' +
          '<button class="account__login t-label" data-act="social" data-p="Google" aria-label="Log in with Google">' + GO.LOGO_GOOGLE + 'Log in</button>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  // Logged-in card (Log in - Flixbus 2604:8427): an existing account fills the form, a new one only knows the email.
  // The title is "Logged in as …" for both (user 21.10.2026): a new account shows the name typed in the form, or the email.
  function accountCard(a) {
    const c = contact();
    const typed = [c.first, c.last].map(v => (v || '').trim()).filter(Boolean).join(' ');
    const who = a.name || typed || a.email;
    // no grey card, Log out as the How it works / Find out more links (user 30.10.2026; was a grey card with a pink label-lg Log out)
    return '<div class="account-card" role="status">' +
      // Passenger Step 8 wording (user 17.11.2026): "Logged in as / Account created for" the email, "Not you? Log out"
      '<div class="account-card__title"><span class="t-label-lg">' + (a.created ? 'Account created for ' : 'Logged in as ') + esc(a.email || who) + '</span>' +
      '<button type="button" class="link t-label account-card__out" data-act="logout">Not you? Log out</button></div>' +
      '<p class="t-body-sm c-secondary">' + (a.created ? 'Next time we fill in your details for you.'
        : a.company ? 'Booking for ' + esc(a.company) + (a.company.endsWith('.') ? '' : '.')
        : '') + '</p>' + // no "We filled in your details from your account" (user 17.11.2026)
      (a.linked ? '<button type="button" class="link t-label account-card__switch" data-act="switch-account">Switch account</button>' : '') +
      '</div>';
  }

  // Other passengers (2308:18785): with more than one traveller a link opens the sheet; once saved it reads "Edit other passengers data".
  // An underlined link without an icon, 12 under the phone (user 03.11.2026; grey with + / people icon since 30.10.2026,
  // an underlined label-lg link before)
  // Under the phone (user 17.11.2026): "Add other passengers info" and "I need an invoice for a company", both checkboxes.
  // Ticking one opens its sheet, ticked after Save with what was saved under the label; unticking drops it.
  function otherLink(s) {
    const e = B.ex();
    const saved = s.passengers || {};
    const list = others(s);
    // ticked once anything was saved for someone; the line lists the names that were typed
    const typed = list.map(o => saved[o.id]).filter(p => p && Object.keys(p).some(k => k !== 'cc' && (p[k] || '').trim()));
    const done = typed.length > 0; // ticked while anything is saved, unticked once all is cleared (user 17.11.2026)
    const namesTxt = typed.map(p => [p.first, p.last].map(v => (v || '').trim()).filter(Boolean).join(' ')).filter(Boolean).join(', ');
    const pax = list.length ? '<label class="checkbox ex-invoice ex-invoice--v5"><input type="checkbox" data-others' + (done ? ' checked' : '') + '>' +
        '<span class="checkbox__box" aria-hidden="true">' + ic('check', 12) + '</span>' +
        '<span class="checkbox__text"><span class="t-body">' + (done ? 'Other passengers info added' : 'Add other passengers info') + '</span></span></label>' : ''; // no names under it (user 17.11.2026)
    // booking for the company (Log in as → company): it is invoiced anyway, no invoice checkbox (user 17.11.2026)
    const acc = contact().account;
    return '<div class="details-checks">' + pax + (acc && acc.company ? '' : GO.invoiceRow(e)) + '</div>';
  }
  function otherLinkOld(s) {
    if (others(s).length === 0) return '';
    // v5 (Presentations New 05.11 679:1353): centred, semibold, "+" in front, no underline
    // approved Mobile 11.11.2026 (3323:24597): "Add more passengers", on the left under the names
    return '<div class="others others--start"><button type="button" class="others__link t-body-sm" data-act="others">' +
      (othersDone(s) ? 'Edit other passengers data' : ic('plus', 16) + 'Add more passengers') + '</button></div>';
  }

  // ---------- screen ----------
  GO.screens.details = {
    render(s) {
      // v5 (679:841): the title on the left next to Back, so it stays one line at 375
      // back on Details from Edit search without "Update search" (system back too): the old search returns
      if (s.editSnap && !GO.router.path().startsWith('/edit')) { GO.editRestore(); s = GO.store.get(); }
      const L = B.legs(s);
      // the grey route header as on Add-ons, the title under it on white (user 12.11.2026; since 10.11.2026 it was Back and the title in one row)
      // no visible title (Anya 16.11.2026): the route header says where we are; the h1 stays for screen readers
      // the title as on Add-ons; Log in and Google on its line, no "Booked with us before?" (user 17.11.2026)
      const loggedIn = !!contact().account;
      const head = GO.tripHead(s, L) + (loggedIn ? GO.pageTitle('Add passenger info')
        : '<div class="details__head">' + GO.pageTitle('Add passenger info') + '<div class="account__acts">' +
            '<button class="account__login t-label" data-act="login">' + ic('mail', 16) + 'Log in</button>' +
            '<button class="account__login t-label" data-act="social" data-p="Google" aria-label="Log in with Google">' + GO.LOGO_GOOGLE + 'Log in</button>' +
          '</div></div>');
      if (!L.length || L.some(l => !l.o)) {
        return head + GO.noRide(s);
      }
      const c = contact();
      const T = B.totals(s, B.ex(), L);
      return head +
        '<main class="details">' +
          // the passenger part in one block: the account or the fields, other passengers, the login; right on the page,
          // no grey card (user 03.11.2026; it was on one for a try the same day)
          '<div class="pax-card">' +
          // client 12.11.2026, back to the earlier layout: Google and Email on top, "or book as Guest", the guest fields,
          // "+ Add more passengers" under them; no "Already have an account? Log in here" (the login is on top).
          // Approved Mobile 11.11.2026 (3323:24597) had the fields first, the passengers link under the names and the login line under the phone
          (c.account ? accountCard(c.account) : '') +
          '<form class="details__form" data-details-form novalidate>' +
            '<section class="contact" aria-labelledby="contact-title">' +
              // no visible title: "Book without creating an account" removed (user 03.11.2026)
              '<h2 id="contact-title" class="sr-only">Contact details</h2>' +
              names(c) +
              // what the email is for sits in the placeholder, no helper under the field (user 02.11.2026)
              input('email', 'Email for notification', c, 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="next"') +
              phone(c) +
              otherLink(s) +
            '</section>' +
          '</form>' +
          '</div>' +
          '<hr class="details__rule">' +
          // payment on the same page since 29.10.2026 (Phil): under the login, the total and Pay at the page end, not sticky,
          // the small print under them (user 30.10.2026)
          GO.payBlock.html(T) +
        '</main>' +
        GO.payBlock.foot(T, 'bar') + GO.payBlock.foot(T, 'notes');
    },
    mount(root) {
      const form = root.querySelector('[data-details-form]');
      if (!form) return;
      GO.payBlock.mount(root);
      // the two checkboxes under the phone (user 17.11.2026): ticking opens the sheet, unticking drops what was saved
      const oc = root.querySelector('[data-others]');
      if (oc) oc.addEventListener('change', () => {
        // either way the box only opens the passengers: it follows the saved data, not the tap (user 17.11.2026)
        oc.checked = !oc.checked;
        GO.router.go('/details/passengers');
      });
      const ivc = root.querySelector('[data-invoice]');
      if (ivc) ivc.addEventListener('change', () => {
        if (ivc.checked) { ivc.checked = false; GO.router.go('/details/invoice'); }
        else { GO.store.set({ ex: Object.assign(B.ex(), { invoiceOn: false }) }); GO.router.refresh(); }
      });
      // Values go to the store as they are typed; an error disappears as soon as the value is fine
      form.addEventListener('input', ev => {
        const t = ev.target;
        if (!t.name || t.name === 'cc') return;
        if (t.name === 'phone') {
          const cc = takeCode(t, root.querySelector('#f-cc'), root.querySelector('[data-flag]'), root.querySelector('[data-code]'));
          if (cc) setContact({ cc });
        }
        setContact({ [t.name]: t.value });
        if (errors[t.name] && !check(contact(), t.name)) clearError(t);
      });
      form.addEventListener('change', ev => {
        if (ev.target.name !== 'cc') return;
        setContact({ cc: ev.target.value });
        root.querySelector('[data-flag]').innerHTML = GO.FLAGS[ev.target.value];
        root.querySelector('[data-code]').textContent = '+' + country(ev.target.value)[2];
      });
      // Leaving a field that already had text (or after a failed Continue) shows its error.
      // The DOM is patched in place: a re-render here would swallow the tap that moved the focus.
      form.addEventListener('focusout', ev => {
        const t = ev.target;
        if (!t.name || !KEYS.includes(t.name)) return;
        const c = contact();
        if (!tried && !(c[t.name] || '').trim()) return;
        showError(t.name, check(c, t.name));
      });
      // Enter (the "next" key on the phone keyboard) moves to the next field, on the last one it submits
      form.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
        ev.preventDefault();
        const list = Array.from(form.querySelectorAll('input'));
        const next = list[list.indexOf(ev.target) + 1];
        if (next) next.focus(); else GO.screens.details.actions.pay();
      });
    },
    actions: {
      back: () => GO.router.back(),
      // the pencil of the route header (v6): the whole search over Details, a changed search opens the offers (edit.js)
      edit: () => GO.editSearch('details'),
      'to-offers': () => GO.router.go('/offers', { replace: true }),
      'see-booking': () => GO.router.go('/booked', { replace: true }),
      'new-ride': () => GO.router.go('/', { replace: true }),
      // the same content as the old sheet of test accounts (user 22.10.2026): name, email and who it is
      // Passenger Step 8 logic (user 17.11.2026): a full account logs straight in, one without a phone finishes in the profile dialog
      social: el => GO.td.open(el, TEST_ACCOUNTS.map(a => ({ label: a.name, note: a.email + ', ' + a.note })), i => {
        const a = TEST_ACCOUNTS[i];
        if (a.phone) { signIn(a); GO.router.refresh(); return; }
        GO.openProfile(a, a.email, true);
      }),
      // an account linked to a company: Log in as again (Anya's desktop)
      'switch-account': () => GO.router.go('/details/choose'),
      logout() {
        setContact({ account: null, first: '', last: '', email: '', phone: '' }); // logging out clears the passenger's details (user 17.11.2026)
        ['first', 'last', 'email', 'phone'].forEach(k => delete errors[k]);
        GO.router.refresh();
        u.toast('You’re logged out');
        const el = document.getElementById('f-first'); if (el) el.focus({ preventScroll: true });
      },
      login: () => GO.router.go('/details/signin'),
      others: () => GO.router.go('/details/passengers'),
      total: () => GO.router.go('/details/total'),
      pay(el) {
        tried = true;
        const c = contact();
        KEYS.forEach(k => showError(k, check(c, k)));
        const first = KEYS.find(k => errors[k]);
        if (first) {
          const el = document.getElementById('f-' + first);
          el.focus({ preventScroll: true });
          el.closest('.form-field').scrollIntoView({ block: 'center', behavior: 'smooth' });
          return;
        }
        GO.payBlock.submit(el && el.dataset && el.dataset.method);
      },
      terms: () => GO.payBlock.terms(),
      'pay-other': () => GO.payBlock.other(),
      'card-remove': el => GO.payBlock.removeCard(+el.dataset.i),
    },
  };

  // Show or clear one field's error without re-rendering the screen
  function showError(key, msg) {
    const t = document.getElementById('f-' + key);
    if (!t) { delete errors[key]; return; }
    if (msg) errors[key] = msg; else delete errors[key];
    const f = t.closest('.form-field');
    const box = f.querySelector('.field');
    box.classList.toggle('field--error', !!msg || Array.from(box.querySelectorAll('input')).some(i => i !== t && errors[i.name]));
    let p = f.querySelector('#' + key + '-err');
    if (!msg) {
      if (p) p.remove(); t.removeAttribute('aria-invalid');
      const cols = f.querySelector('.names-errors');
      if (cols && !cols.querySelector('.field-error')) cols.remove();
    }
    else {
      if (!p || p.id !== key + '-err') { p = f.querySelector('#' + key + '-err'); }
      if (!p) {
        p = document.createElement('p'); p.id = key + '-err'; p.className = 't-body-sm field-error';
        if (box.classList.contains('field--names')) {
          // the names: each error in its own column under its half
          let cols = f.querySelector('.names-errors');
          if (!cols) { cols = document.createElement('div'); cols.className = 'names-errors'; cols.innerHTML = '<div></div><div></div>'; box.after(cols); }
          cols.children[key === 'last' ? 1 : 0].appendChild(p);
        } else box.after(p);
      }
      p.innerHTML = esc(msg);
      t.setAttribute('aria-invalid', 'true');
    }
    const ids = [msg ? key + '-err' : '', f.querySelector('#' + key + '-help') ? key + '-help' : ''].filter(Boolean).join(' ');
    if (ids) t.setAttribute('aria-describedby', ids); else t.removeAttribute('aria-describedby');
  }
  function clearError(t) { showError(t.name, ''); }

  // ---------- Continue with Google / Facebook (simulated) ----------
  // The real button opens the provider's own window and returns with the name and email. The prototype has no keys, so,
  // as in Anya's desktop (22.10.2026), a TEST DATA list under the button picks the account (was a sheet of test accounts).
  const TEST_ACCOUNTS = [
    { name: 'Maja Novak', first: 'Maja', last: 'Novak', email: 'maja.novak@gmail.com', cc: 'si', phone: '41 555 218', note: 'Booked with GoOpti before, phone and two cards saved',
      cards: [{ brand: 'Mastercard', last4: '3024' }, { brand: 'Visa', last4: '9223' }] },
    { name: 'Luca Rossi', first: 'Luca', last: 'Rossi', email: 'luca.rossi@gmail.com', note: 'New to GoOpti, no phone yet' },
  ];
  // Email only (not in the Google list): an account linked to a company asks who the booking is for after the code (Anya's desktop)
  const COMPANY_ACCOUNT = { name: 'Luka Kranjc', first: 'Luka', last: 'Kranjc', email: 'luka.kranjc@siol.net', cc: 'si', phone: '41 555 219',
    company: 'Kranjc Logistics d.o.o.', companyPhone: '1 555 2190', cards: [{ brand: 'Visa', last4: '4417' }] };

  // One way in for every path: an existing profile fills everything; a new account only knows the email, a typed name and phone stay.
  // Google and Facebook give the name and email, the phone comes only from a GoOpti profile. asCompany: the booking is for the company.
  function signIn(a, email, asCompany) {
    const patch = a
      ? { account: { name: a.name, email: a.email, linked: !!a.company, company: asCompany ? a.company : null, cards: a.cards || [] }, first: a.first, last: a.last, email: a.email }
      : { account: { name: '', email, created: true }, email };
    if (a && a.phone) Object.assign(patch, { cc: a.cc, phone: asCompany ? a.companyPhone : a.phone });
    // the company-linked account (Luka Kranjc) logs in with the passenger form left empty (user 17.11.2026)
    if (a && a.company) Object.assign(patch, { first: '', last: '', email: '', phone: '' });
    setContact(patch);
    Object.keys(patch).forEach(k => delete errors[k]);
  }
  // after signing in on Details the cursor goes to the first empty field: name and phone for a new account, the phone after Google
  function focusEmpty() {
    setTimeout(() => {
      const c = contact();
      const next = ['first', 'last', 'phone'].map(k => !(c[k] || '').trim() && document.getElementById('f-' + k)).find(Boolean);
      if (next) { next.focus({ preventScroll: true }); next.closest('.form-field').scrollIntoView({ block: 'center' }); }
    }, 50);
  }

  // ---------- dialog: sign in with a code from the email, as in Anya's desktop (user 22.10.2026) ----------
  // One path for logging in and signing up, no password: a popup over the dimmed screen, email → 4-digit code → done.
  // Replaces the full-screen Flixbus steps (Sign up ⇄ Log in → Almost there, 21.10.2026). The van over the title is Anya's car.png.
  // No real email goes out: any 4 digits pass, 0000 is wrong (TEST DATA under the field). maja.novak@gmail.com is an existing
  // account, any other email gets a new one.
  // 4 digits since 23.10.2026 (user; Anya's desktop has OTP_LEN = 4), was 6
  const OTP_LEN = 4;
  let loginEmail = '';
  let loginErr = '';
  let codeErr = '';
  const known = email => [...TEST_ACCOUNTS, COMPANY_ACCOUNT].find(a => a.email === email.toLowerCase());
  let pending = null; // the company-linked account waiting for Log in as
  // the same dialog opens from Details, from the profile icon on home (#/signin, user 20.10.2026) and from the account offer
  // on the booking confirmation (#/booked/signin, user 21.10.2026); it draws over the screen it came from
  const area = () => GO.hash().startsWith('#/details') ? 'details' : GO.hash().startsWith('#/booked') ? 'booked' : 'home';
  const fromHome = () => area() !== 'details'; // home and confirmation: back with a toast, no form to fill
  const route = step => area() === 'home' ? { signin: '/signin', code: '/signin/code', choose: '/signin/choose', profile: '/signin/profile' }[step] : '/' + area() + '/' + step;

  const closeBtn = '<button class="icon-btn auth-dialog__close" data-act="close" aria-label="Close">' + ic('close', 24) + '</button>';
  // Errors are patched in place, like on Details: a re-render would drop the keyboard
  function setFieldError(box, input, msg) {
    box.classList.toggle('field--error', !!msg);
    let p = box.parentElement.querySelector('.field-error');
    if (!msg) { if (p) p.remove(); input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); return; }
    if (!p) { p = document.createElement('p'); p.id = input.id + '-err'; p.className = 't-body-sm field-error'; p.setAttribute('role', 'alert'); box.after(p); }
    p.innerHTML = esc(msg);
    input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', p.id);
  }
  function busy(btn, label) {
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.innerHTML = '<span class="sr-only">' + label + '</span><span class="btn__label">' + (btn.textContent || 'Continue') + '</span>';
  }
  const emailError = v => !v ? 'Enter your email' : EMAIL.test(v) ? '' : 'Check the email, it should look like name@example.com';
  // the font of the small print under the payment on Details, no icon, centred (user 11.11.2026): 12/16 secondary, "Terms and Conditions" / "Privacy Policy"
  const legal = '<p class="auth__legal c-secondary"><span>By continuing, you accept the GoOpti <button type="button" class="link link--inline auth__legal-link" data-act="terms">Terms and Conditions</button> <span class="nowrap">and <button type="button" class="link link--inline auth__legal-link" data-act="terms">Privacy Policy</button></span></span></p>'; // "and" never hangs at the line end (user 21.10.2026)

  const emailScreen = {
    overlay: true, base: area, sheetClass: 'sheet--dialog',
    render() {
      const value = loginEmail || contact().email || '';
      return closeBtn +
        '<form class="auth" data-login-form novalidate>' +
          '<h2 id="sheet-title" class="t-h1">Log in</h2>' +
          '<p class="t-body c-secondary">No password needed. Enter your email and we’ll send you a 4-digit code.</p>' +
          '<div class="auth__form">' +
            '<div class="form-field"><label class="sr-only" for="login-email">Email</label>' +
              '<div class="field' + (loginErr ? ' field--error' : '') + '"><input id="login-email" placeholder="Your email" value="' + esc(value) + '" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="go"' +
                (loginErr ? ' aria-invalid="true" aria-describedby="login-email-err"' : '') + '></div>' +
              (loginErr ? '<p id="login-email-err" class="t-body-sm field-error" role="alert">' + esc(loginErr) + '</p>' : '') +
            '</div>' +
            // the newsletter opt-in from the client's desktop prototype (user 12.11.2026): in the login, under the email it is about
            // (it was under the phone on Details the same day); off by default, its wording without the full stop
            // no newsletter opt-in in the login (user 17.11.2026)
